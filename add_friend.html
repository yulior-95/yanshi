<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加好友</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .header .title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-right: 28px;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .search-bar {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .search-input {
            background-color: #f0f2f5;
            border-radius: 20px;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        
        .search-input i {
            color: #999;
            margin-right: 10px;
        }
        
        .search-input input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 16px;
        }
        
        .add-options {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .option-item {
            display: flex;
            align-items: center;
            padding: 18px 15px;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .option-item:last-child {
            border-bottom: none;
        }
        
        .option-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #1890ff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            color: white;
            font-size: 18px;
        }
        
        .option-info {
            flex: 1;
        }
        
        .option-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            margin-bottom: 3px;
        }
        
        .option-desc {
            font-size: 13px;
            color: #999;
        }
        
        .option-arrow {
            color: #ccc;
            font-size: 16px;
        }
        
        .section-title {
            font-size: 14px;
            color: #666;
            margin: 25px 0 15px;
            padding-left: 5px;
        }
        
        .recent-contacts {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .recent-header {
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .contact-list {
            display: flex;
            padding: 15px;
            overflow-x: auto;
        }
        
        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 15px;
            width: 60px;
        }
        
        .contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .contact-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .contact-name {
            font-size: 12px;
            color: #333;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <i class="fas fa-arrow-left back" onclick="window.history.back()"></i>
        <div class="title">添加好友</div>
    </div>
    
    <div class="content">
        <div class="search-bar">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="手机号/ID搜索" onclick="window.location.href='add_friend_search.html'">
            </div>
        </div>
        
        <div class="add-options">
            <div class="option-item" onclick="window.location.href='add_friend_search.html'">
                <div class="option-icon" style="background-color: #1890ff;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="option-info">
                    <div class="option-title">搜索添加</div>
                    <div class="option-desc">通过手机号/ID搜索好友</div>
                </div>
                <div class="option-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <div class="option-item" onclick="window.location.href='add_friend_scan.html'">
                <div class="option-icon" style="background-color: #52c41a;">
                    <i class="fas fa-qrcode"></i>
                </div>
                <div class="option-info">
                    <div class="option-title">扫一扫</div>
                    <div class="option-desc">扫描二维码添加好友</div>
                </div>
                <div class="option-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <div class="option-item" onclick="window.location.href='add_friend_contacts.html'">
                <div class="option-icon" style="background-color: #fa8c16;">
                    <i class="fas fa-address-book"></i>
                </div>
                <div class="option-info">
                    <div class="option-title">手机通讯录</div>
                    <div class="option-desc">添加通讯录中的联系人</div>
                </div>
                <div class="option-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
        
        <div class="section-title">最近添加</div>
        
        <div class="recent-contacts">
            <div class="contact-list">
                <div class="contact-item">
                    <div class="contact-avatar">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                    </div>
                    <div class="contact-name">陈明</div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-avatar">
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                    </div>
                    <div class="contact-name">刘洋</div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-avatar">
                        <img src="https://images.unsplash.com/photo-1544725176-7c40e5a71c5e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                    </div>
                    <div class="contact-name">周婷</div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-avatar">
                        <img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                    </div>
                    <div class="contact-name">张伟</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="tab-bar">
        <div class="tab">
            <i class="fas fa-comment"></i>
            <span>消息</span>
        </div>
        <div class="tab active">
            <i class="fas fa-address-book"></i>
            <span>通讯录</span>
        </div>
        <div class="tab">
            <i class="fas fa-phone-alt"></i>
            <span>通话</span>
        </div>
        <div class="tab">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>
    
    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000);
        });
    </script>
</body>
</html>
