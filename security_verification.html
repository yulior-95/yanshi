<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back-button {
            font-size: 16px;
            color: #1890ff;
            display: flex;
            align-items: center;
        }
        
        .header .back-button i {
            margin-right: 5px;
        }
        
        .header .title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .page-description {
            margin-bottom: 25px;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .verification-group {
            background-color: white;
            border-radius: 10px;
            margin-bottom: 25px;
            padding: 15px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 8px;
            color: #1890ff;
        }
        
        .verification-options {
            margin-bottom: 10px;
        }
        
        .verification-option {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
        }
        
        .verification-option.active {
            border-color: #1890ff;
            background-color: #e6f7ff;
        }
        
        .verification-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid #d9d9d9;
            margin-right: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .verification-option.active .verification-radio {
            border-color: #1890ff;
        }
        
        .verification-option.active .verification-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #1890ff;
            position: absolute;
        }
        
        .verification-label {
            flex: 1;
            font-size: 15px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .form-control {
            width: 100%;
            height: 46px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 16px;
            color: #333;
            background-color: #fff;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .verification-code-container {
            display: flex;
            align-items: center;
        }
        
        .verification-code-input {
            flex: 1;
            margin-right: 10px;
        }
        
        .btn-send-code {
            height: 46px;
            min-width: 110px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-send-code:disabled {
            background-color: #bae7ff;
            cursor: not-allowed;
        }
        
        .verification-input-group {
            display: none;
        }
        
        .verification-input-group.show {
            display: block;
        }
        
        .button-container {
            padding: 20px;
            background-color: white;
            border-top: 1px solid #eaeaea;
        }
        
        .btn-next {
            width: 100%;
            height: 44px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .btn-next:disabled {
            background-color: #bae7ff;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <div class="back-button">
            <i class="fas fa-chevron-left"></i>
            返回
        </div>
        <div class="title">安全验证</div>
        <div style="width: 60px;"></div>
    </div>
    
    <div class="content">
        <div class="page-description">
            请完成安全验证，以确认您的身份。根据N-1验证原则，请至少通过一种安全验证方式进行验证。
        </div>
        
        <div class="verification-group">
            <div class="section-title">
                <i class="fas fa-shield-alt"></i>选择验证方式
            </div>
            
            <div class="verification-options">
                <div class="verification-option active" onclick="selectVerification('phone')">
                    <div class="verification-radio"></div>
                    <div class="verification-label">手机验证码</div>
                </div>
                
                <div class="verification-option" onclick="selectVerification('email')">
                    <div class="verification-radio"></div>
                    <div class="verification-label">邮箱验证码</div>
                </div>
                
                <div class="verification-option" onclick="selectVerification('google')">
                    <div class="verification-radio"></div>
                    <div class="verification-label">谷歌验证器</div>
                </div>
            </div>
            
            <div class="verification-input-group show" id="phone-verification">
                <div class="form-group">
                    <div class="form-label">手机号码</div>
                    <div class="form-control" style="display: flex; align-items: center; color: #999; justify-content: space-between;">
                        138****8765
                        <span style="color: #1890ff;">更换</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="form-label">验证码</div>
                    <div class="verification-code-container">
                        <input type="text" class="form-control verification-code-input" placeholder="请输入6位验证码">
                        <button class="btn-send-code">获取验证码</button>
                    </div>
                </div>
            </div>
            
            <div class="verification-input-group" id="email-verification">
                <div class="form-group">
                    <div class="form-label">邮箱</div>
                    <div class="form-control" style="display: flex; align-items: center; color: #999; justify-content: space-between;">
                        ex****@example.com
                        <span style="color: #1890ff;">更换</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="form-label">验证码</div>
                    <div class="verification-code-container">
                        <input type="text" class="form-control verification-code-input" placeholder="请输入6位验证码">
                        <button class="btn-send-code">获取验证码</button>
                    </div>
                </div>
            </div>
            
            <div class="verification-input-group" id="google-verification">
                <div class="form-group">
                    <div class="form-label">谷歌验证码</div>
                    <input type="text" class="form-control" placeholder="请输入6位谷歌验证码">
                </div>
                
                <div style="font-size: 13px; color: #999; margin-top: 8px;">
                    <i class="fas fa-info-circle" style="margin-right: 5px;"></i>
                    请打开谷歌验证器APP，输入显示的6位验证码
                </div>
            </div>
        </div>
    </div>
    
    <div class="button-container">
        <button class="btn-next">下一步</button>
    </div>

    <script>
        function selectVerification(type) {
            // 隐藏所有验证输入组
            document.querySelectorAll('.verification-input-group').forEach(el => {
                el.classList.remove('show');
            });
            
            // 显示选中的验证输入组
            document.getElementById(`${type}-verification`).classList.add('show');
            
            // 更新选中状态
            document.querySelectorAll('.verification-option').forEach(el => {
                el.classList.remove('active');
            });
            
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
