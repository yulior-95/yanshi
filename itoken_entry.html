<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iToken 小程序入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #1d1d1f;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            position: relative;
        }

        .nav-bar .back {
            color: #007AFF;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-bar .title {
            font-size: 17px;
            font-weight: 600;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-bar .placeholder {
            width: 60px;
        }

        /* 主内容区 */
        .content {
            padding: 20px;
        }

        /* 用户信息区 */
        .user-section {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            background: #f5f5f7;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .user-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            font-weight: 600;
        }

        .user-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .user-info p {
            font-size: 14px;
            color: #86868b;
        }

        /* iToken 入口卡片 */
        .itoken-card {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .itoken-card:active {
            transform: scale(0.98);
        }

        .itoken-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .itoken-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .itoken-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .itoken-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .itoken-icon i {
            font-size: 22px;
            color: #fff;
        }

        .itoken-name {
            color: #fff;
        }

        .itoken-name h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .itoken-name p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .itoken-arrow {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .itoken-arrow i {
            color: #fff;
            font-size: 14px;
        }

        .itoken-status {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34C759;
        }

        .status-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .device-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            color: #fff;
        }

        /* 小程序标签 */
        .mini-program-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        /* 功能说明 */
        .feature-section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1d1d1f;
        }

        .feature-list {
            background: #f5f5f7;
            border-radius: 16px;
            overflow: hidden;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: #fff;
            margin-bottom: 1px;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon.blue {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
        }

        .feature-icon.green {
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
        }

        .feature-icon.orange {
            background: linear-gradient(135deg, #FF9500 0%, #FF6B00 100%);
        }

        .feature-icon.purple {
            background: linear-gradient(135deg, #AF52DE 0%, #9B30FF 100%);
        }

        .feature-icon i {
            color: #fff;
            font-size: 18px;
        }

        .feature-text h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1d1d1f;
        }

        .feature-text p {
            font-size: 13px;
            color: #86868b;
            line-height: 1.4;
        }

        /* 安全说明 */
        .security-info {
            background: #e8f4fd;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #b3d9f7;
        }

        .security-info-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .security-info-header i {
            color: #007AFF;
            font-size: 18px;
        }

        .security-info-header span {
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .security-info p {
            font-size: 13px;
            color: #86868b;
            line-height: 1.6;
        }

        /* 小程序打开动画遮罩 */
        .mini-program-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .mini-program-overlay.show {
            display: flex;
            animation: overlay-fade-in 0.3s ease forwards;
        }

        @keyframes overlay-fade-in {
            from {
                background: rgba(0, 0, 0, 0);
            }
            to {
                background: rgba(0, 0, 0, 0.5);
            }
        }

        .mini-program-sheet {
            width: 100%;
            max-width: 390px;
            background: #fff;
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            animation: sheet-slide-up 0.4s ease 0.1s forwards;
            overflow: hidden;
        }

        @keyframes sheet-slide-up {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .sheet-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sheet-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sheet-icon i {
            color: #fff;
            font-size: 18px;
        }

        .sheet-name {
            font-size: 16px;
            font-weight: 600;
        }

        .sheet-close {
            width: 28px;
            height: 28px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sheet-close i {
            color: #86868b;
            font-size: 12px;
        }

        .sheet-content {
            padding: 30px 20px;
            text-align: center;
        }

        .loading-animation {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }

        .loading-spinner {
            width: 100%;
            height: 100%;
            border: 3px solid #f0f0f0;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 15px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- iOS状态栏 -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back">
                <i class="fas fa-chevron-left"></i>
                <span>设置</span>
            </div>
            <div class="title">安全中心</div>
            <div class="placeholder"></div>
        </div>

        <!-- 主内容 -->
        <div class="content">
            <!-- 用户信息 -->
            <div class="user-section">
                <div class="user-avatar">张</div>
                <div class="user-info">
                    <h3>张三</h3>
                    <p>ID: 68****8888</p>
                </div>
            </div>

            <!-- iToken 入口卡片 -->
            <div class="itoken-card" id="itokenCard">
                <div class="mini-program-tag">
                    <i class="fas fa-cube"></i> 小程序
                </div>
                <div class="itoken-card-header">
                    <div class="itoken-logo">
                        <div class="itoken-icon">
                            <i class="fas fa-shield-halved"></i>
                        </div>
                        <div class="itoken-name">
                            <h2>iToken</h2>
                            <p>设备安全验证</p>
                        </div>
                    </div>
                    <div class="itoken-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                <div class="itoken-status">
                    <div class="status-item">
                        <div class="status-dot"></div>
                        <span class="status-text">已激活</span>
                    </div>
                    <div class="device-count">
                        <i class="fas fa-mobile-alt"></i> 2 台设备
                    </div>
                </div>
            </div>

            <!-- 功能说明 -->
            <div class="feature-section">
                <div class="section-title">iToken 功能</div>
                <div class="feature-list">
                    <div class="feature-item">
                        <div class="feature-icon blue">
                            <i class="fas fa-key"></i>
                        </div>
                        <div class="feature-text">
                            <h4>动态验证码</h4>
                            <p>每30秒自动刷新的安全验证码</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon green">
                            <i class="fas fa-link"></i>
                        </div>
                        <div class="feature-text">
                            <h4>多设备绑定</h4>
                            <p>支持绑定多台可信设备</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon orange">
                            <i class="fas fa-fingerprint"></i>
                        </div>
                        <div class="feature-text">
                            <h4>生物认证</h4>
                            <p>指纹/面容双重身份验证</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon purple">
                            <i class="fas fa-microchip"></i>
                        </div>
                        <div class="feature-text">
                            <h4>硬件级安全</h4>
                            <p>密钥存储于设备安全芯片</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 安全说明 -->
            <div class="security-info">
                <div class="security-info-header">
                    <i class="fas fa-info-circle"></i>
                    <span>关于 iToken</span>
                </div>
                <p>iToken 是独立于主应用的安全验证模块，即使主应用出现问题，您的设备绑定信息和验证功能仍然安全可用。所有敏感数据均存储在设备本地安全芯片中。</p>
            </div>
        </div>
    </div>

    <!-- 小程序打开动画 -->
    <div class="mini-program-overlay" id="miniProgramOverlay">
        <div class="mini-program-sheet">
            <div class="sheet-header">
                <div class="sheet-title">
                    <div class="sheet-icon">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <span class="sheet-name">iToken</span>
                </div>
                <div class="sheet-close" id="sheetClose">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="sheet-content">
                <div class="loading-animation">
                    <div class="loading-spinner"></div>
                </div>
                <p class="loading-text">正在打开小程序...</p>
            </div>
        </div>
    </div>

    <script>
        const itokenCard = document.getElementById('itokenCard');
        const overlay = document.getElementById('miniProgramOverlay');
        const sheetClose = document.getElementById('sheetClose');

        itokenCard.addEventListener('click', function() {
            overlay.classList.add('show');
            
            // 模拟加载后跳转
            setTimeout(function() {
                window.location.href = 'itoken_home.html';
            }, 1500);
        });

        sheetClose.addEventListener('click', function(e) {
            e.stopPropagation();
            overlay.classList.remove('show');
        });

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                overlay.classList.remove('show');
            }
        });
    </script>
</body>
</html>
