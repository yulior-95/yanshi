<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body class="lr-proto lr-page-light">
    <header class="lr-status-bar lr-status-light">
        <span class="lr-sb-time">9:41</span>
        <span class="lr-dynamic-island" aria-hidden="true"></span>
        <div class="lr-sb-icons">

    <div class="lr-nav-header">

                <div class="lr-rank-name">小雅</div>

        <div class="lr-rank-row">
            <div class="lr-rank-num">4</div>

        <div class="lr-tab-item"><i class="far fa-user"></i><span>我的</span></div>

</html>
