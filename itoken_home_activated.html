<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iToken - 已激活</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #fff;
        }

        /* 小程序顶部栏 */
        .mini-program-header {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            padding: 0 16px 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .close-btn i {
            color: #fff;
            font-size: 14px;
        }

        .header-title {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-btn i {
            color: #fff;
            font-size: 14px;
        }

        /* iToken 状态卡片 */
        .itoken-status-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-top: 10px;
            backdrop-filter: blur(10px);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-icon {
            width: 44px;
            height: 44px;
            background: rgba(52, 199, 89, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-icon i {
            font-size: 20px;
            color: #30D158;
        }

        .status-info h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .status-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .status-badge {
            margin-left: auto;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(52, 199, 89, 0.3);
            color: #30D158;
        }

        /* 主内容区 */
        .content {
            padding: 20px;
            padding-bottom: 120px;
        }

        /* 区块标题 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            margin-top: 8px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .section-action {
            font-size: 14px;
            color: #007AFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: #f5f5f7;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .empty-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #e5e5e7 0%, #d1d1d6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .empty-icon i {
            font-size: 28px;
            color: #86868b;
        }

        .empty-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 14px;
            color: #86868b;
            line-height: 1.5;
        }

        /* 添加账号按钮 */
        .add-account-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
        }

        .add-account-btn:active {
            transform: scale(0.98);
        }

        .add-account-btn i {
            color: #fff;
            font-size: 20px;
        }

        .add-account-btn span {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        /* 功能说明 */
        .feature-list {
            background: #f5f5f7;
            border-radius: 16px;
            overflow: hidden;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: #fff;
            margin-bottom: 1px;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon.blue {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
        }

        .feature-icon.green {
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
        }

        .feature-icon.orange {
            background: linear-gradient(135deg, #FF9500 0%, #FF6B00 100%);
        }

        .feature-icon i {
            color: #fff;
            font-size: 16px;
        }

        .feature-text h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #1d1d1f;
        }

        .feature-text p {
            font-size: 12px;
            color: #86868b;
        }

        /* 设备信息 */
        .device-info-card {
            background: #f5f5f7;
            border-radius: 16px;
            padding: 16px;
            margin-top: 24px;
        }

        .device-info-title {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .device-info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e5e5e7;
        }

        .device-info-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .device-info-label {
            font-size: 14px;
            color: #86868b;
        }

        .device-info-value {
            font-size: 14px;
            color: #1d1d1f;
            font-weight: 500;
        }

        .device-info-value.success {
            color: #34C759;
        }

        /* 底部安全栏 */
        .bottom-safe-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            padding: 12px 20px;
            padding-bottom: 34px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .safe-bar-icon {
            color: #34C759;
            font-size: 14px;
        }

        .safe-bar-text {
            font-size: 13px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- iOS状态栏 -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 小程序顶部栏 -->
        <div class="mini-program-header">
            <div class="header-top">
                <div class="header-left">
                    <div class="close-btn">
                        <i class="fas fa-times"></i>
                    </div>
                    <span class="header-title">iToken</span>
                </div>
                <div class="header-right">
                    <div class="header-btn">
                        <i class="fas fa-question-circle"></i>
                    </div>
                </div>
            </div>

            <!-- iToken 状态 -->
            <div class="itoken-status-card">
                <div class="status-header">
                    <div class="status-icon">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <div class="status-info">
                        <h3>iToken 安全验证器</h3>
                        <p>设备安全芯片保护</p>
                    </div>
                    <div class="status-badge">已激活</div>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="content">
            <!-- 已绑定账号列表 -->
            <div class="section-header">
                <span class="section-title">已绑定账号</span>
            </div>

            <!-- 空状态 -->
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <div class="empty-title">暂无绑定账号</div>
                <div class="empty-desc">添加68账号后，可获取专属安全验证码</div>
            </div>

            <!-- 添加账号按钮 -->
            <div class="add-account-btn" id="addAccountBtn">
                <i class="fas fa-plus"></i>
                <span>添加68账号</span>
            </div>

            <!-- 功能说明 -->
            <div class="section-header">
                <span class="section-title">绑定后可享</span>
            </div>

            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon blue">
                        <i class="fas fa-key"></i>
                    </div>
                    <div class="feature-text">
                        <h4>专属验证码</h4>
                        <p>每个账号独立的动态验证码</p>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon green">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <div class="feature-text">
                        <h4>资产保护</h4>
                        <p>敏感操作需验证码确认</p>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon orange">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div class="feature-text">
                        <h4>异常提醒</h4>
                        <p>异地登录实时通知</p>
                    </div>
                </div>
            </div>

            <!-- 设备信息 -->
            <div class="device-info-card">
                <div class="device-info-title">当前设备信息</div>
                <div class="device-info-item">
                    <span class="device-info-label">设备名称</span>
                    <span class="device-info-value">iPhone 15 Pro Max</span>
                </div>
                <div class="device-info-item">
                    <span class="device-info-label">激活状态</span>
                    <span class="device-info-value success">已激活</span>
                </div>
                <div class="device-info-item">
                    <span class="device-info-label">激活时间</span>
                    <span class="device-info-value">2026-01-17 09:41</span>
                </div>
            </div>
        </div>

        <!-- 底部安全栏 -->
        <div class="bottom-safe-bar">
            <i class="fas fa-lock safe-bar-icon"></i>
            <span class="safe-bar-text">iToken 已激活，由设备安全芯片保护</span>
        </div>
    </div>

    <script>
        // 添加账号按钮
        document.getElementById('addAccountBtn').addEventListener('click', function() {
            window.location.href = 'itoken_add_account.html';
        });

        // 关闭按钮
        document.querySelector('.close-btn').addEventListener('click', function() {
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
