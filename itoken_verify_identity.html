<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份验证</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #1d1d1f;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }

        .nav-bar .back {
            color: #007AFF;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-bar .title {
            font-size: 17px;
            font-weight: 600;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: #1d1d1f;
        }

        .nav-bar .placeholder {
            width: 60px;
        }

        /* 主内容区 */
        .content {
            padding: 20px;
            padding-bottom: 120px;
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            background: #e5e5e7;
            color: #86868b;
        }

        .step-num.active {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            color: #fff;
        }

        .step-num.completed {
            background: #34C759;
            color: #fff;
        }

        .step-label {
            font-size: 13px;
            color: #86868b;
        }

        .step-label.active {
            color: #007AFF;
            font-weight: 500;
        }

        .step-line {
            width: 40px;
            height: 2px;
            background: #e5e5e7;
        }

        .step-line.completed {
            background: #34C759;
        }

        /* 标题区域 */
        .section-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1d1d1f;
        }

        .section-subtitle {
            font-size: 15px;
            color: #86868b;
        }

        /* 表单区域 */
        .form-section {
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 8px;
            display: block;
        }

        .form-input {
            width: 100%;
            height: 52px;
            border: 1px solid #e5e5e7;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 16px;
            color: #1d1d1f;
            background: #f5f5f7;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #007AFF;
            background: #fff;
        }

        .form-input::placeholder {
            color: #86868b;
        }

        /* 验证码输入 */
        .code-input-group {
            display: flex;
            gap: 12px;
        }

        .code-input-group .form-input {
            flex: 1;
        }

        .send-code-btn {
            height: 52px;
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: #007AFF;
            color: #fff;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .send-code-btn:disabled {
            background: #e5e5e7;
            color: #86868b;
            cursor: not-allowed;
        }

        .send-code-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        /* 安全提示 */
        .security-tip {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 16px;
            background: #e8f4fd;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .security-tip i {
            color: #007AFF;
            font-size: 16px;
            margin-top: 2px;
        }

        .security-tip span {
            font-size: 13px;
            color: #1d1d1f;
            line-height: 1.5;
        }

        /* 验证方式选择 */
        .verify-options {
            margin-bottom: 24px;
        }

        .verify-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: #f5f5f7;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .verify-option.selected {
            background: #e8f4fd;
            border-color: #007AFF;
        }

        .verify-option:active {
            transform: scale(0.98);
        }

        .verify-option-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .verify-option-icon i {
            font-size: 20px;
            color: #007AFF;
        }

        .verify-option-content {
            flex: 1;
        }

        .verify-option-content h4 {
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 2px;
        }

        .verify-option-content p {
            font-size: 13px;
            color: #86868b;
        }

        .verify-option-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #c7c7cc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verify-option.selected .verify-option-check {
            background: #007AFF;
            border-color: #007AFF;
        }

        .verify-option.selected .verify-option-check::after {
            content: '';
            width: 6px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        /* 底部按钮区域 */
        .bottom-section {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            padding: 20px;
            padding-bottom: 34px;
            background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.95) 30%);
        }

        .submit-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
        }

        .submit-btn:disabled {
            background: #e5e5e7;
            color: #86868b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .submit-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        /* 帮助链接 */
        .help-link {
            text-align: center;
            margin-top: 16px;
        }

        .help-link a {
            font-size: 14px;
            color: #007AFF;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- iOS状态栏 -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back">
                <i class="fas fa-chevron-left"></i>
                <span>返回</span>
            </div>
            <div class="title">身份验证</div>
            <div class="placeholder"></div>
        </div>

        <!-- 主内容 -->
        <div class="content">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step">
                    <div class="step-num active">1</div>
                    <span class="step-label active">验证身份</span>
                </div>
                <div class="step-line"></div>
                <div class="step">
                    <div class="step-num">2</div>
                    <span class="step-label">确认生物识别</span>
                </div>
                <div class="step-line"></div>
                <div class="step">
                    <div class="step-num">3</div>
                    <span class="step-label">恢复完成</span>
                </div>
            </div>

            <!-- 标题区域 -->
            <div class="section-header">
                <h1 class="section-title">验证您的身份</h1>
                <p class="section-subtitle">请输入登录密码和短信验证码</p>
            </div>

            <!-- 表单区域 -->
            <div class="form-section">
                <div class="form-group">
                    <label class="form-label">登录密码</label>
                    <input type="password" class="form-input" placeholder="请输入登录密码" id="password">
                </div>

                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="text" class="form-input" value="138****5678" readonly style="color: #86868b;">
                </div>

                <div class="form-group">
                    <label class="form-label">短信验证码</label>
                    <div class="code-input-group">
                        <input type="text" class="form-input" placeholder="请输入验证码" id="code" maxlength="6">
                        <button class="send-code-btn" id="sendCodeBtn">获取验证码</button>
                    </div>
                </div>
            </div>

            <!-- 安全提示 -->
            <div class="security-tip">
                <i class="fas fa-shield-alt"></i>
                <span>验证成功后，您需要使用当前设备的生物识别（指纹/面容）进行确认，以恢复iToken功能。</span>
            </div>

            <!-- 帮助链接 -->
            <div class="help-link">
                <a href="#">收不到验证码？</a>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-section">
            <button class="submit-btn" id="submitBtn" disabled>
                下一步
            </button>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const codeInput = document.getElementById('code');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const submitBtn = document.getElementById('submitBtn');

        // 检查表单
        function checkForm() {
            const password = passwordInput.value.trim();
            const code = codeInput.value.trim();
            submitBtn.disabled = !(password.length >= 6 && code.length === 6);
        }

        passwordInput.addEventListener('input', checkForm);
        codeInput.addEventListener('input', checkForm);

        // 发送验证码
        let countdown = 0;
        sendCodeBtn.addEventListener('click', function() {
            if (countdown > 0) return;
            
            countdown = 60;
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = `${countdown}s`;
            
            const timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    sendCodeBtn.textContent = `${countdown}s`;
                } else {
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '获取验证码';
                    clearInterval(timer);
                }
            }, 1000);
        });

        // 提交
        submitBtn.addEventListener('click', function() {
            if (!this.disabled) {
                window.location.href = 'itoken_confirm_biometric.html';
            }
        });
    </script>
</body>
</html>
