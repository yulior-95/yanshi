<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>转账</title>
  <style>
    :root {
      --bg: #edeef3;
      --card: #fff;
      --theme: #178aff;
      --muted: #c4c7cf;
      --sub: #979797;
      --phone-w: 414px;
      --phone-h: 896px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "PingFang SC", "Helvetica Neue", sans-serif;
      background: #1c1c1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      max-height: calc(100vh - 40px);
      border-radius: 48px;
      overflow: hidden;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 10px #111, 0 0 0 12px #2a2a2a, 0 30px 80px rgba(0,0,0,.55);
    }
    .status {
      height: 48px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; font-size: 17px; font-weight: 600; flex-shrink: 0;
    }
    .island { width: 124px; height: 36px; background: #000; border-radius: 33px; }
    .header {
      height: 50px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; flex-shrink: 0;
    }
    .side { width: 120px; display: flex; align-items: center; }
    .side.right { justify-content: flex-end; }
    .back, .hist {
      border: 0; background: transparent; cursor: pointer; display: grid; place-items: center;
    }
    .back { width: 24px; height: 24px; }
    .back img { width: 10px; height: 18px; transform: scaleX(-1); }
    .hist {
      width: 62px; height: 36px; border-radius: 43px; background: rgba(255,255,255,.35);
    }
    .hist img { width: 22px; height: 22px; }
    .title { font-size: 18px; font-weight: 500; }
    .body { flex: 1; padding: 16px; overflow: auto; }
    .field {
      background: var(--card);
      border-radius: 8px;
      min-height: 54px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      border: 0;
      font: inherit;
      text-align: left;
    }
    .field.click { cursor: pointer; }
    .label { color: var(--muted); font-size: 16px; white-space: nowrap; }
    .right { display: flex; align-items: center; gap: 8px; }
    .name { font-size: 16px; opacity: .7; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .coin-ico { width: 24px; height: 24px; }
    .coin-name { font-size: 16px; }
    .amt { font-size: 16px; opacity: .7; }
    .all { color: var(--theme); font-size: 16px; border: 0; background: transparent; cursor: pointer; font-family: inherit; }
    .meta {
      display: flex; justify-content: space-between; font-size: 14px; color: var(--sub);
      margin: -4px 0 16px;
    }
    .meta b { color: var(--theme); font-weight: 400; }
    .meta .u { color: #000; }
    .note input {
      flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px;
    }
    .note input::placeholder { color: var(--muted); }
    .total { text-align: center; margin: 24px 0 32px; }
    .total .big {
      font-size: 46px; line-height: 1.5; font-weight: 500;
      font-family: DINPro, "Helvetica Neue", sans-serif;
    }
    .total .big small { font-size: 16px; }
    .total .cny { color: #81818d; font-size: 16px; }
    .btn {
      width: 100%; height: 48px; border: 0; border-radius: 8px;
      background: var(--theme); color: #fff; font-size: 16px; font-weight: 500;
      font-family: inherit; cursor: pointer;
    }
    .home { height: 34px; position: relative; flex-shrink: 0; margin-top: auto; }
    .home::after {
      content: ""; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 100px; background: #000;
    }
    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.45);
      display: none; z-index: 20; align-items: flex-end;
    }
    .overlay.show { display: flex; }
    .sheet {
      width: 100%; background: #f2f2f7; border-radius: 16px 16px 0 0;
      padding: 12px 16px 24px; animation: up .22s ease;
    }
    @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sheet h3 { text-align: center; font-size: 16px; font-weight: 500; margin-bottom: 12px; }
    .sheet .item {
      width: 100%; background: #fff; border: 0; border-radius: 8px; height: 54px;
      padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; font: inherit; cursor: pointer;
    }
    .pwd {
      display: flex; justify-content: center; gap: 10px; margin: 8px 0 16px;
    }
    .pwd i {
      width: 40px; height: 40px; border-radius: 8px; background: #fff; display: grid; place-items: center;
    }
    .pwd i.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #000; }
    .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .keys button {
      height: 48px; border: 0; border-radius: 8px; background: #fff; font-size: 22px;
      font-family: inherit; cursor: pointer;
    }
    .keys button.ghost { background: transparent; color: #666; font-size: 14px; }
    .toast {
      position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
      background: rgba(0,0,0,.78); color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 30; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .arrow { width: 12px; height: 12px; transform: rotate(-90deg); }
    @media (max-width: 480px) {
      body { background: var(--bg); }
      .phone { width: 100vw; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><div class="island"></div><span style="font-size:12px">100%</span></div>
    <div class="header">
      <div class="side">
        <button class="back" onclick="location.href='chat_message_all.html'" aria-label="返回">
          <img src="assets/icons/back.svg" alt="">
        </button>
      </div>
      <div class="title">转账</div>
      <div class="side right">
        <button class="hist" id="btnHist" aria-label="记录"><img src="assets/icons/tf_arrow.svg" alt=""></button>
      </div>
    </div>

    <div class="body">
      <div class="field">
        <span class="label">转账给</span>
        <div class="right">
          <span class="name">Albert Flores</span>
          <img class="avatar" src="assets/media/avatar_albert.png" alt="">
        </div>
      </div>
      <button class="field click" id="btnCoin" type="button">
        <div class="right" style="gap:8px">
          <img class="coin-ico" src="assets/icons/coin_c.svg" alt="">
          <span class="coin-name" id="coin">C</span>
        </div>
        <img class="arrow" src="assets/icons/arrow_right.svg" alt="">
      </button>
      <div class="field">
        <span class="label">转账数量</span>
        <div class="right">
          <input class="amt" id="amount" value="20" style="width:80px;border:0;outline:none;background:transparent;text-align:right;font:inherit;font-size:16px;opacity:.7">
          <button class="all" id="btnAll" type="button">全部</button>
        </div>
      </div>
      <div class="meta">
        <div>网络费用 <b>2.00</b> <span class="u">C</span></div>
        <div>可用余额 <b id="bal">20.00</b> <span class="u">C</span></div>
      </div>
      <div class="field note">
        <input id="note" placeholder="添加转账说明">
      </div>
      <div class="total">
        <div class="big"><span id="total">22.00</span><small>C</small></div>
        <div class="cny">≈￥<span id="cny">22.00</span></div>
      </div>
      <button class="btn" id="btnSubmit">转账</button>
    </div>
    <div class="home"></div>

    <div class="overlay" id="coinOverlay">
      <div class="sheet">
        <h3>选择币种</h3>
        <button class="item" data-coin="C" data-bal="20.00"><span>C</span><span style="color:#178aff">可用 20.00</span></button>
        <button class="item" data-coin="USDT" data-bal="120.50"><span>USDT</span><span style="color:#178aff">可用 120.50</span></button>
        <button class="item" data-coin="BTC" data-bal="0.82"><span>BTC</span><span style="color:#178aff">可用 0.82</span></button>
      </div>
    </div>

    <div class="overlay" id="pwdOverlay">
      <div class="sheet">
        <h3>请输入安全密码</h3>
        <div class="pwd" id="pwdDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="keys" id="keys">
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
          <button class="ghost" data-k="cancel">取消</button>
          <button data-k="0">0</button>
          <button class="ghost" data-k="del">删除</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    const amount = document.getElementById("amount");
    const total = document.getElementById("total");
    const cny = document.getElementById("cny");
    const bal = document.getElementById("bal");
    const coin = document.getElementById("coin");
    const coinOverlay = document.getElementById("coinOverlay");
    const pwdOverlay = document.getElementById("pwdOverlay");
    const dots = [...document.querySelectorAll("#pwdDots i")];
    let pin = "";
    let balance = 20;

    function toast(t) {
      const el = document.getElementById("toast");
      el.textContent = t; el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1400);
    }
    function sync() {
      const n = Number(amount.value || 0);
      const sum = n + 2;
      total.textContent = sum.toFixed(2);
      cny.textContent = sum.toFixed(2);
    }
    amount.addEventListener("input", sync);
    sync();

    document.getElementById("btnAll").onclick = () => {
      amount.value = String(balance);
      sync();
    };
    document.getElementById("btnHist").onclick = () => toast("转账记录");
    document.getElementById("btnCoin").onclick = () => coinOverlay.classList.add("show");
    coinOverlay.onclick = (e) => {
      if (e.target === coinOverlay) coinOverlay.classList.remove("show");
      const b = e.target.closest("[data-coin]");
      if (!b) return;
      coin.textContent = b.dataset.coin;
      balance = Number(b.dataset.bal);
      bal.textContent = balance.toFixed(2);
      coinOverlay.classList.remove("show");
    };

    document.getElementById("btnSubmit").onclick = () => {
      pin = "";
      dots.forEach((d) => d.classList.remove("on"));
      pwdOverlay.classList.add("show");
    };

    document.getElementById("keys").onclick = (e) => {
      const b = e.target.closest("[data-k]");
      if (!b) return;
      const k = b.dataset.k;
      if (k === "cancel") { pwdOverlay.classList.remove("show"); pin = ""; return; }
      if (k === "del") { pin = pin.slice(0, -1); }
      else if (pin.length < 6) pin += k;
      dots.forEach((d, i) => d.classList.toggle("on", i < pin.length));
      if (pin.length === 6) {
        setTimeout(() => {
          pwdOverlay.classList.remove("show");
          toast("转账成功，对方待收款");
          setTimeout(() => (location.href = "chat_transfer_result.html"), 700);
        }, 200);
      }
    };
  </script>
</body>
</html>
