<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>发出的红包</title>
  <style>
    :root {
      --bg: #edeef3;
      --card: rgba(255,255,255,.6);
      --sub: #81818d;
      --danger: #fb2826;
      --theme: #178aff;
      --phone-w: 414px;
      --phone-h: 896px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "PingFang SC", "Helvetica Neue", sans-serif;
      background: #1c1c1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      max-height: calc(100vh - 40px);
      border-radius: 48px;
      overflow: hidden;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 10px #111, 0 0 0 12px #2a2a2a, 0 30px 80px rgba(0,0,0,.55);
    }
    .status {
      height: 48px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; font-size: 17px; font-weight: 600; flex-shrink: 0;
    }
    .island { width: 124px; height: 36px; background: #000; border-radius: 33px; }
    .header {
      height: 50px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; flex-shrink: 0;
    }
    .side { width: 120px; display: flex; align-items: center; }
    .side.right { justify-content: flex-end; }
    .back, .more {
      border: 0; background: transparent; cursor: pointer; display: grid; place-items: center;
    }
    .back { width: 24px; height: 24px; }
    .back img { width: 10px; height: 18px; transform: scaleX(-1); }
    .more {
      width: 62px; height: 36px; border-radius: 43px; background: rgba(255,255,255,.35);
    }
    .more img { width: 30px; height: 30px; }
    .title { font-size: 18px; font-weight: 500; }
    .body { flex: 1; overflow: auto; padding: 12px 16px 16px; }
    .profile {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 12px;
    }
    .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .who img {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .who .meta { min-width: 0; }
    .who .nm {
      font-size: 14px; max-width: 146px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .who .sub { font-size: 12px; color: var(--sub); display: flex; gap: 4px; align-items: center; }
    .who .sub b { color: var(--danger); font-weight: 400; }
    .filters { display: flex; gap: 16px; flex-shrink: 0; }
    .chip {
      height: 36px; border-radius: 100px; border: 0; background: rgba(255,255,255,.6);
      padding: 0 16px; display: flex; align-items: center; gap: 4px;
      font: inherit; font-size: 14px; cursor: pointer;
    }
    .chip img { width: 12px; height: 12px; }
    .sum {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      padding: 24px; display: flex; flex-direction: column; align-items: center;
      margin-bottom: 12px;
    }
    .sum .coin {
      display: flex; align-items: center; gap: 8px; height: 48px; font-size: 16px;
    }
    .sum .coin img { width: 24px; height: 24px; }
    .sum .amt {
      font-size: 48px; font-weight: 500; line-height: 1.5;
      font-family: "DIN Alternate", "DINPro", "Helvetica Neue", sans-serif;
    }
    .sum .fx { font-size: 14px; }
    .sum .rate {
      display: flex; align-items: center; font-size: 14px; color: var(--sub);
    }
    .sum .rate .v { color: #000; }
    .sum .rate button {
      width: 24px; height: 24px; border: 0; background: transparent; cursor: pointer;
      display: grid; place-items: center;
    }
    .sum .rate button img { width: 14px; height: 12px; }
    .list {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      overflow: hidden;
    }
    .item {
      padding: 12px 16px 13px; border-bottom: 1px solid #efefef; cursor: pointer;
    }
    .item:last-child { border-bottom: 0; }
    .item:active { background: rgba(0,0,0,.03); }
    .item .top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 500; line-height: 20px;
    }
    .item .bot {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--sub); line-height: 20px; margin-top: 4px;
    }
    .home {
      height: 34px; flex-shrink: 0; position: relative;
    }
    .home::after {
      content: ""; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 100px; background: #000;
    }
    .sheet {
      position: absolute; inset: 0; background: rgba(0,0,0,.4);
      display: none; align-items: flex-end; z-index: 10;
    }
    .sheet.show { display: flex; }
    .sheet .panel {
      width: 100%; background: #fff; border-radius: 16px 16px 0 0; padding: 12px 16px 24px;
    }
    .sheet .panel button {
      width: 100%; height: 48px; border: 0; background: transparent;
      font: inherit; font-size: 16px; cursor: pointer; border-bottom: 1px solid #efefef;
    }
    .sheet .panel button:last-child { border: 0; color: var(--sub); }
    .toast {
      position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,.78); color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 480px) {
      body { background: var(--bg); }
      .phone { width: 100vw; height: 100vh; max-height: none; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span>9:41</span>
      <div class="island"></div>
      <span>100%</span>
    </div>
    <div class="header">
      <div class="side">
        <button class="back" id="btnBack" aria-label="返回">
          <img src="assets/icons/back.svg" alt="">
        </button>
      </div>
      <div class="title">发出的红包</div>
      <div class="side right">
        <button class="more" id="btnMore" aria-label="更多">
          <img src="assets/icons/more.svg" alt="">
        </button>
      </div>
    </div>
    <div class="body">
      <div class="profile">
        <div class="who">
          <img src="assets/media/avatar_rp_me.png" alt="">
          <div class="meta">
            <div class="nm">我的名字很长max146px宽度</div>
            <div class="sub">共发出红包 <b id="cnt">14</b> 个</div>
          </div>
        </div>
        <div class="filters">
          <button class="chip" id="btnCoin">C <img src="assets/icons/arrow_down.svg" alt=""></button>
          <button class="chip" id="btnYear">2026 <img src="assets/icons/arrow_down.svg" alt=""></button>
        </div>
      </div>
      <div class="sum">
        <div class="coin">
          <img src="assets/icons/coin_c_sm.svg" alt="">
          <span id="sumCoin">C</span>
        </div>
        <div class="amt" id="sumAmt">180.00</div>
        <div class="fx">≈￥180.00</div>
        <div class="rate">
          <span>当前参考汇率：</span>
          <span class="v">￥1.00</span>
          <button type="button" id="btnRefresh" aria-label="刷新">
            <img src="assets/icons/refresh_blue.svg" alt="">
          </button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="home"></div>

    <div class="sheet" id="coinSheet">
      <div class="panel">
        <button data-coin="C">C</button>
        <button data-coin="USDT">USDT</button>
        <button data-coin="BTC">BTC</button>
        <button data-close>取消</button>
      </div>
    </div>
    <div class="sheet" id="yearSheet">
      <div class="panel">
        <button data-year="2026">2026</button>
        <button data-year="2025">2025</button>
        <button data-year="2024">2024</button>
        <button data-close>取消</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    const rows = [
      { title: "拼手机红包", amount: "110.00", status: "已领取1/1个", time: "01-23 17:45" },
      { title: "拼手机红包", amount: "10.00", status: "已领取1/1个", time: "01-23 17:45" },
      { title: "拼手机红包", amount: "20.00", status: "已领取2/2个", time: "01-23 17:45" },
      { title: "拼手机红包", amount: "10.00", status: "已领取1/1个", time: "01-23 17:45" },
      { title: "拼手机红包", amount: "100.00", status: "已领取0/7个", time: "01-23 17:45" },
    ];
    const list = document.getElementById("list");
    const coinLabel = document.getElementById("btnCoin");
    let coin = "C";

    function render() {
      list.innerHTML = rows.map((r) => `
        <div class="item">
          <div class="top">
            <span>${r.title}</span>
            <span>${r.amount} ${coin}</span>
          </div>
          <div class="bot">
            <span>${r.time}</span>
            <span>${r.status}</span>
          </div>
        </div>`).join("");
    }
    render();

    function toast(t) {
      const el = document.getElementById("toast");
      el.textContent = t; el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1200);
    }

    document.getElementById("btnBack").onclick = () =>
      history.length > 1 ? history.back() : (location.href = "chat_redpacket.html");
    document.getElementById("btnMore").onclick = () => toast("更多");
    document.getElementById("btnRefresh").onclick = () => toast("汇率已刷新");

    const coinSheet = document.getElementById("coinSheet");
    const yearSheet = document.getElementById("yearSheet");
    document.getElementById("btnCoin").onclick = () => coinSheet.classList.add("show");
    document.getElementById("btnYear").onclick = () => yearSheet.classList.add("show");

    coinSheet.onclick = (e) => {
      if (e.target === coinSheet || e.target.matches("[data-close]")) coinSheet.classList.remove("show");
      const b = e.target.closest("[data-coin]");
      if (!b) return;
      coin = b.dataset.coin;
      coinLabel.innerHTML = `${coin} <img src="assets/icons/arrow_down.svg" alt="">`;
      document.getElementById("sumCoin").textContent = coin;
      coinSheet.classList.remove("show");
      render();
    };
    yearSheet.onclick = (e) => {
      if (e.target === yearSheet || e.target.matches("[data-close]")) yearSheet.classList.remove("show");
      const b = e.target.closest("[data-year]");
      if (!b) return;
      document.getElementById("btnYear").innerHTML = `${b.dataset.year} <img src="assets/icons/arrow_down.svg" alt="">`;
      yearSheet.classList.remove("show");
    };
    list.onclick = (e) => {
      if (e.target.closest(".item")) toast("红包详情");
    };
  </script>
</body>
</html>
