<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>语音通话 · 接收方</title>
  <style>
    :root {
      --phone-w: 414px;
      --phone-h: 896px;
      --hangup: #fb2826;
      --theme: #178aff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "PingFang SC", "Helvetica Neue", sans-serif;
      background: #1c1c1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      max-height: calc(100vh - 40px);
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      background: #111;
      box-shadow: 0 0 0 10px #111, 0 0 0 12px #2a2a2a, 0 30px 80px rgba(0,0,0,.55);
    }
    .bg {
      position: absolute; inset: 0;
      background: #0d0d0f center/cover no-repeat;
      filter: blur(28px) brightness(.35);
      transform: scale(1.2);
    }
    .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.72);
      display: flex; flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 56px 0 40px;
      color: #fff;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 0 20px;
      min-height: 40px;
    }
    .pip {
      width: 36px; height: 36px; border-radius: 50%;
      border: 0; background: rgba(255,255,255,.12);
      display: grid; place-items: center; cursor: pointer;
    }
    .pip img { width: 18px; height: 18px; }
    .center {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      margin-top: 48px;
    }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: block;
    }
    .name { font-size: 24px; font-weight: 500; line-height: 1.5; }
    .tip { font-size: 14px; opacity: .9; }
    .actions {
      display: flex; gap: 72px; align-items: flex-start; justify-content: center;
      margin-bottom: 24px;
    }
    .act {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      border: 0; background: transparent; color: #fff; cursor: pointer; font: inherit;
    }
    .act .btn {
      width: 64px; height: 64px; border-radius: 50%;
      display: grid; place-items: center;
    }
    .act .btn img { width: 28px; height: 28px; filter: brightness(0) invert(1); }
    .act.decline .btn { background: var(--hangup); }
    .act.accept .btn { background: var(--theme); }
    .act span { font-size: 14px; }
    .home {
      width: 134px; height: 5px; border-radius: 100px; background: rgba(255,255,255,.85);
    }
    .toast {
      position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,.78); color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 480px) {
      body { background: #111; }
      .phone { width: 100vw; height: 100vh; max-height: none; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <img class="bg" src="assets/media/avatar_voice.png" alt="">
    <div class="overlay">
      <div class="top-bar">
        <button class="pip" id="btnPip" aria-label="缩小">
          <img src="assets/icons/pip_min.svg" alt="">
        </button>
      </div>
      <div class="center">
        <img class="avatar" src="assets/media/avatar_voice.png" alt="">
        <div class="name">Albert Flores</div>
        <div class="tip" id="tip">邀请你语音通话</div>
      </div>
      <div>
        <div class="actions">
          <button class="act decline" id="btnDecline">
            <div class="btn"><img src="assets/icons/call_decline.svg" alt=""></div>
            <span>取消</span>
          </button>
          <button class="act accept" id="btnAccept">
            <div class="btn"><img src="assets/icons/call_accept.svg" alt=""></div>
            <span>接听</span>
          </button>
        </div>
        <div style="display:flex;justify-content:center"><div class="home"></div></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    function toast(t) {
      const el = document.getElementById("toast");
      el.textContent = t; el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1200);
    }
    document.getElementById("btnPip").onclick = () => toast("缩小为浮窗");
    document.getElementById("btnDecline").onclick = () => {
      document.getElementById("tip").textContent = "已取消";
      toast("已拒绝");
      setTimeout(() => (location.href = "chat_message_all.html"), 800);
    };
    document.getElementById("btnAccept").onclick = () => {
      document.getElementById("tip").textContent = "通话中 00:01";
      toast("已接听");
      document.getElementById("btnAccept").style.visibility = "hidden";
      document.querySelector("#btnDecline span").textContent = "挂断";
    };
  </script>
</body>
</html>
