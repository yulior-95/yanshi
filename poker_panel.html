<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扑克牌表情包面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .emoji-panel {
            flex: 1;
            background-color: white;
            display: flex;
            flex-direction: column;
        }
        
        .emoji-tabs {
            display: flex;
            border-bottom: 1px solid #eaeaea;
        }
        
        .emoji-tab {
            padding: 12px 15px;
            cursor: pointer;
            font-size: 15px;
            color: #666;
            position: relative;
        }
        
        .emoji-tab.active {
            color: #1890ff;
        }
        
        .emoji-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15px;
            right: 15px;
            height: 2px;
            background-color: #1890ff;
        }
        
        .emoji-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        
        .emoji-group-title {
            font-size: 14px;
            color: #999;
            margin: 10px 0;
        }
        
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .poker-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .poker-card {
            width: 70px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 8px;
            background-color: white;
            position: relative;
        }
        
        .poker-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .poker-name {
            font-size: 12px;
            color: #666;
        }
        
        .recently-used {
            margin-bottom: 20px;
        }
        
        .input-area {
            background-color: #f8f9fa;
            padding: 10px;
            border-top: 1px solid #eaeaea;
        }
        
        .input-container {
            display: flex;
            align-items: center;
        }
        
        .input-actions {
            display: flex;
            align-items: center;
            margin-right: 10px;
        }
        
        .input-actions i {
            font-size: 24px;
            color: #666;
            margin-right: 15px;
        }
        
        .text-input {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }
        
        .text-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            margin: 0 10px;
        }
        
        .text-input i {
            color: #999;
            font-size: 20px;
        }
        
        .send-button {
            margin-left: 10px;
            width: 36px;
            height: 36px;
            background-color: #1890ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        
        /* 扑克牌动画效果 */
        @keyframes pokerFlip {
            0% { transform: perspective(800px) rotateY(0deg); }
            50% { transform: perspective(800px) rotateY(90deg); }
            100% { transform: perspective(800px) rotateY(0deg); }
        }
        
        .poker-animation {
            animation: pokerFlip 3s ease-in-out forwards;
            transform-style: preserve-3d;
        }
        
        /* 预览区域 */
        .preview-area {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f5ff;
            border-bottom: 1px solid #e6f0ff;
        }
        
        .preview-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .preview-card {
            width: 100px;
            height: 140px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background-color: white;
            position: relative;
        }
        
        .preview-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-button {
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 14px;
            margin-top: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-button i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="status-bar">

        </div>
        <div class="status-bar-right">

    <div class="preview-area">

                    </div>
                    <div class="poker-item">

            <div>

                    <div class="poker-item" data-card="黑桃A">

                    </div>
                    <div class="poker-item" data-card="黑桃2">
                        <div class="poker-card">

                    </div>

                    </div>
                    <div class="poker-item" data-card="黑桃4">
                        <div class="poker-card">

                    </div>
                </div>
            </div>
            
            <div>
                <div class="emoji-group-title">红桃系列</div>
                <div class="emoji-grid">

                    <div class="poker-item" data-card="红桃2">

                    </div>
                    <div class="poker-item" data-card="红桃3">

                    <div class="poker-item" data-card="红桃K">

            <div>

                <div class="emoji-grid">
                    <div class="poker-item" data-card="方块A">

            <div>

                <div class="emoji-grid">
                    <div class="poker-item" data-card="梅花A">
                        <div class="poker-card">
                            <img src="https://tinyurl.com/mvd6m6je" alt="梅花A">
                        </div>
                        <div class="poker-name">梅花A</div>
                    </div>
                    <div class="poker-item" data-card="梅花2">
                        <div class="poker-card">
                            <img src="https://tinyurl.com/2p94zkdn" alt="梅花2">
                        </div>

                    </div>
                    <div class="poker-item" data-card="梅花3">

    </div>
    
    <div class="input-area">
        <div class="input-container">
            <div class="input-actions">
                <i class="fas fa-plus-circle"></i>

    <div class="tab-bar">
        <div class="tab active">
            <i class="fas fa-comment"></i>

        </div>

            <span>通讯录</span>
        </div>
        <div class="tab">
            <i class="fas fa-compass"></i>
            <span>发现</span>
        </div>
        <div class="tab">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>

    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);
        
        // 点击扑克牌项更新预览区
        const pokerItems = document.querySelectorAll('.poker-item');
        const previewCard = document.getElementById('previewCard');
        
        pokerItems.forEach(item => {
            item.addEventListener('click', function() {
                // 获取当前选中的卡片
                const cardImage = this.querySelector('img').src;
                const cardName = this.querySelector('.poker-name').textContent;
                
                // 更新预览区域
                previewCard.querySelector('img').src = cardImage;
                previewCard.dataset.cardName = cardName;
                
                // 移除其他项的选中状态
                pokerItems.forEach(otherItem => {
                    otherItem.style.transform = '';
                    otherItem.style.boxShadow = '';
                });
                
                // 添加选中效果
                this.style.transform = 'scale(1.05)';
                this.style.boxShadow = '0 5px 15px rgba(24, 144, 255, 0.3)';
            });
        });
        
        // 发送按钮功能
        const sendButton = document.querySelector('.preview-button');
        
        sendButton.addEventListener('click', function() {
            // 这里应该跳回到聊天界面并发送卡片
            // 在实际应用中，这里需要与聊天页面进行通信
            alert('已发送扑克牌表情: ' + (previewCard.dataset.cardName || '黑桃A'));
        });
        
        // 预览卡片动画
        previewCard.addEventListener('click', function() {
            this.classList.add('poker-animation');
            
            // 动画结束后移除类
            setTimeout(() => {
                this.classList.remove('poker-animation');
            }, 3000);
        });
    </script>
</body>
</html>
