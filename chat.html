<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天详情</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
        }
        
        .header .info {
            flex: 1;
        }
        
        .header .name {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        
        .header .status {
            display: flex;
            font-size: 12px;
            color: #666;
            margin-top: 2px;
            align-items: center;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        
        .status-dot.online {
            background-color: #34c759;
        }
        
        .header .encryption-status {
            font-size: 12px;
            color: #1890ff;
            display: flex;
            align-items: center;
            margin-left: 8px;
        }
        
        .header .encryption-status i {
            margin-right: 4px;
        }
        
        .header .actions {
            display: flex;
            align-items: center;
        }
        
        .header .actions i {
            font-size: 20px;
            color: #333;
            margin-left: 15px;
        }
        
        .burn-setting-badge {
            background-color: #fff1e6;
            color: #ff9500;
            font-size: 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 2px 6px;
            cursor: pointer;
        }
        
        .burn-setting-badge i {
            margin-right: 4px;
            font-size: 12px;
        }
        
        .chat-body {
            flex: 1;
            padding: 10px 15px;
            overflow-y: auto;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        
        .message-info {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 10px 12px;
            border-radius: 10px;
            position: relative;
            font-size: 16px;
            line-height: 1.4;
        }
        
        .message.received {
            align-items: flex-start;
        }
        
        .message.sent {
            align-items: flex-end;
        }
        
        .message.received .message-bubble {
            background-color: white;
            color: #333;
            border: 1px solid #e1e4e8;
            border-top-left-radius: 0;
        }
        
        .message.sent .message-bubble {
            background-color: #1890ff;
            color: white;
            border-top-right-radius: 0;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 5px;
            position: relative;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .online-status {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #34c759;
            border: 1px solid white;
        }
        
        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            display: flex;
            align-items: center;
        }
        
        .burn-countdown {
            margin-left: 5px;
            font-size: 11px;
            color: #ff9500;
            display: flex;
            align-items: center;
        }
        
        .burn-countdown i {
            margin-right: 2px;
        }
        
        .encryption-mark {
            font-size: 10px;
            margin-right: 5px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .message.received .encryption-mark {
            color: rgba(0, 0, 0, 0.5);
        }
        
        .message-image {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .message-voice {
            display: flex;
            align-items: center;
            min-width: 80px;
        }
        
        .message-voice i {
            margin-right: 8px;
            font-size: 18px;
        }
        
        .input-area {
            background-color: #f8f9fa;
            padding: 10px;
            border-top: 1px solid #eaeaea;
        }
        
        .input-container {
            display: flex;
            align-items: center;
        }
        
        .input-actions {
            display: flex;
            align-items: center;
            margin-right: 10px;
        }
        
        .input-actions i {
            font-size: 24px;
            color: #666;
            margin-right: 15px;
        }
        
        .text-input {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }
        
        .text-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            margin: 0 10px;
        }
        
        .text-input i {
            color: #999;
            font-size: 20px;
        }
        
        .send-button {
            margin-left: 10px;
            width: 36px;
            height: 36px;
            background-color: #1890ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
        }
        
        .burn-setting-panel {
            position: absolute;
            bottom: 70px;
            left: 0;
            right: 0;
            background-color: white;
            padding: 15px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .panel-close {
            font-size: 20px;
            color: #999;
        }
        
        .time-selector {
            margin: 20px 0;
        }
        
        .time-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 5px;  
            background: #e1e1e1;
            outline: none;
            margin: 10px 0;
        }
        
        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%; 
            background: #1890ff;
            cursor: pointer;
        }
        
        .time-options {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .selected-time {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            text-align: center;
            margin: 10px 0;
        }
        
        .apply-button {
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }

        /* 添加消息状态样式 */
    .message-status {
        font-size: 12px;
        margin-left: 5px;
        display: inline-flex;
        align-items: center;
    }
    
    .status-sending {
        color: #999;
        animation: rotate 1s linear infinite;
    }
    
    .status-sent {
        color: #999;
    }
    
    .status-delivered {
        color: #999;
    }
    
    .status-read {
        color: #1890ff;
    }
    
    .status-failed {
        color: #ff3b30;
    }
    
    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    /* 发送失败消息样式 */
    .message.failed .message-bubble {
        border: 1px solid rgba(255, 59, 48, 0.3);
    }
    
    /* 重发按钮样式 */
    .resend-button {
        font-size: 12px;
        color: #ff3b30;
        background-color: rgba(255, 59, 48, 0.1);
        padding: 4px 8px;
        border-radius: 4px;
        margin-top: 5px;
        cursor: pointer;
        align-self: flex-end;
        display: none;
    }
    
    .message.failed .resend-button {
        display: inline-block;
    }
    
    .resend-button:hover {
        background-color: rgba(255, 59, 48, 0.2);
    }
    </style>
</head>

<!-- 添加JavaScript处理消息状态 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 实时更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);
        
        // 失败消息点击重发事件
        const resendButtons = document.querySelectorAll('.resend-button');
        resendButtons.forEach(button => {
            button.addEventListener('click', function() {
                const messageElement = this.parentElement;
                
                // 移除失败状态
                messageElement.classList.remove('failed');
                
                // 获取状态指示器
                const statusIndicator = messageElement.querySelector('.message-status');
                statusIndicator.className = 'message-status status-sending';
                statusIndicator.innerHTML = '<i class="fas fa-circle-notch"></i>';
                
                // 隐藏重发按钮
                this.style.display = 'none';
                
                // 模拟重发过程
                setTimeout(() => {
                    statusIndicator.className = 'message-status status-sent';
                    statusIndicator.innerHTML = '<i class="fas fa-check"></i>';
                    
                    setTimeout(() => {
                        statusIndicator.className = 'message-status status-delivered';
                        statusIndicator.innerHTML = '<i class="fas fa-check-double"></i>';
                    }, 1000);
                }, 2000);
            });
        });
        
        // 演示发送消息
        const sendButton = document.querySelector('.send-button');
        const textInput = document.querySelector('.text-input input');
        
        sendButton.addEventListener('click', function() {
            const messageText = textInput.value.trim();
            if (!messageText) return;
            
            // 创建新消息元素
            const messageElement = document.createElement('div');
            messageElement.className = 'message sent';
            
            // 随机模拟网络状态
            const networkState = Math.random();
            let statusClass = 'status-sending';
            let statusIcon = '<i class="fas fa-circle-notch"></i>';
            
            const messageBubble = document.createElement('div');
            messageBubble.className = 'message-bubble';
            messageBubble.innerHTML = `<i class="fas fa-lock encryption-mark"></i>${messageText}`;
            
            const messageTime = document.createElement('div');
            messageTime.className = 'message-time';
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            messageTime.innerHTML = `${hours}:${minutes}<div class="message-status ${statusClass}">${statusIcon}</div>`;
            
            messageElement.appendChild(messageBubble);
            messageElement.appendChild(messageTime);
            
            // 添加到聊天区域
            document.querySelector('.chat-body').appendChild(messageElement);
            
            // 清空输入框
            textInput.value = '';
            
            // 滚动到最新消息
            document.querySelector('.chat-body').scrollTop = document.querySelector('.chat-body').scrollHeight;
            
            // 模拟消息状态变化
            const statusIndicator = messageElement.querySelector('.message-status');
            
            if (networkState > 0.8) {
                // 模拟发送失败
                setTimeout(() => {
                    statusIndicator.className = 'message-status status-failed';
                    statusIndicator.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
                    messageElement.classList.add('failed');
                    
                    const resendButton = document.createElement('div');
                    resendButton.className = 'resend-button';
                    resendButton.innerHTML = '<i class="fas fa-redo-alt"></i> 重新发送';
                    messageElement.appendChild(resendButton);
                    
                    resendButton.addEventListener('click', function() {
                        messageElement.classList.remove('failed');
                        statusIndicator.className = 'message-status status-sending';
                        statusIndicator.innerHTML = '<i class="fas fa-circle-notch"></i>';
                        this.style.display = 'none';
                        
                        setTimeout(() => {
                            statusIndicator.className = 'message-status status-sent';
                            statusIndicator.innerHTML = '<i class="fas fa-check"></i>';
                            
                            setTimeout(() => {
                                statusIndicator.className = 'message-status status-delivered';
                                statusIndicator.innerHTML = '<i class="fas fa-check-double"></i>';
                            }, 1000);
                        }, 2000);
                    });
                }, 3000);
            } else {
                // 正常发送流程
                setTimeout(() => {
                    statusIndicator.className = 'message-status status-sent';
                    statusIndicator.innerHTML = '<i class="fas fa-check"></i>';
                    
                    setTimeout(() => {
                        statusIndicator.className = 'message-status status-delivered';
                        statusIndicator.innerHTML = '<i class="fas fa-check-double"></i>';
                        
                        if (networkState < 0.3) {
                            setTimeout(() => {
                                statusIndicator.className = 'message-status status-read';
                                statusIndicator.innerHTML = '<i class="fas fa-check-double"></i>';
                            }, 2000);
                        }
                    }, 1000);
                }, 1500);
            }
        });
    });
</script>
