<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iToken绑定成功</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #1d1d1f;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            position: relative;
        }

        .nav-bar .title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
        }

        /* 主内容区 */
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 50px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34C759;
        }

        /* 成功动画容器 */
        .success-animation {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 40px;
        }

        /* 成功圆环 */
        .success-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.2) 0%, rgba(48, 179, 80, 0.2) 100%);
            animation: success-pulse 2s ease-in-out infinite;
        }

        .success-ring::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.3) 0%, rgba(48, 179, 80, 0.3) 100%);
        }

        @keyframes success-pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        /* 成功图标 */
        .success-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(52, 199, 89, 0.4);
        }

        .success-icon i {
            font-size: 42px;
            color: #fff;
            animation: check-bounce 0.6s ease-out;
        }

        @keyframes check-bounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 庆祝粒子 */
        .confetti {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: confetti-fall 3s ease-out forwards;
        }

        .confetti-piece:nth-child(1) { left: 10%; background: #007AFF; animation-delay: 0s; }
        .confetti-piece:nth-child(2) { left: 20%; background: #5856D6; animation-delay: 0.1s; }
        .confetti-piece:nth-child(3) { left: 30%; background: #34C759; animation-delay: 0.2s; }
        .confetti-piece:nth-child(4) { left: 40%; background: #FF9500; animation-delay: 0.3s; }
        .confetti-piece:nth-child(5) { left: 50%; background: #FF2D55; animation-delay: 0.4s; }
        .confetti-piece:nth-child(6) { left: 60%; background: #007AFF; animation-delay: 0.5s; }
        .confetti-piece:nth-child(7) { left: 70%; background: #5856D6; animation-delay: 0.6s; }
        .confetti-piece:nth-child(8) { left: 80%; background: #34C759; animation-delay: 0.7s; }
        .confetti-piece:nth-child(9) { left: 90%; background: #FF9500; animation-delay: 0.8s; }

        @keyframes confetti-fall {
            0% {
                top: -10px;
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            100% {
                top: 200px;
                opacity: 0;
                transform: rotate(720deg) scale(0);
            }
        }

        /* 状态文字 */
        .status-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .status-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-subtitle {
            font-size: 15px;
            color: #86868b;
            line-height: 1.5;
            max-width: 280px;
            margin: 0 auto;
        }

        /* 绑定信息卡片 */
        .binding-info {
            width: 100%;
            background: #f5f5f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .binding-info-title {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .binding-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #e5e5e7;
        }

        .binding-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .binding-item:first-of-type {
            padding-top: 0;
        }

        .binding-label {
            font-size: 14px;
            color: #86868b;
        }

        .binding-value {
            font-size: 14px;
            color: #1d1d1f;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .binding-value.success {
            color: #34C759;
        }

        .binding-value i {
            font-size: 12px;
        }

        /* 设备信息 */
        .device-card {
            width: 100%;
            background: #e8f4fd;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #b3d9f7;
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .device-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-icon i {
            font-size: 22px;
            color: #fff;
        }

        .device-info h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1d1d1f;
        }

        .device-info p {
            font-size: 13px;
            color: #86868b;
        }

        .device-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #e8f8ed;
            border-radius: 10px;
        }

        .device-status i {
            color: #34C759;
            font-size: 14px;
        }

        .device-status span {
            font-size: 13px;
            color: #34C759;
            font-weight: 500;
        }

        /* 安全提示 */
        .security-tips {
            width: 100%;
            background: #f5f5f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .security-tips-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1d1d1f;
        }

        .security-tips-title i {
            color: #FF9500;
        }

        .tip-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
        }

        .tip-item i {
            color: #34C759;
            font-size: 12px;
            margin-top: 3px;
        }

        .tip-item span {
            font-size: 13px;
            color: #86868b;
            line-height: 1.5;
        }

        /* 底部按钮区域 */
        .bottom-section {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            padding: 20px;
            padding-bottom: 34px;
            background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.95) 30%);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .primary-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.3);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .secondary-btn:active {
            transform: scale(0.98);
            background: #e5e5e7;
        }

        /* 徽章 */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
        }

        .badge i {
            font-size: 10px;
        }

        /* Token ID 显示 */
        .token-id {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            color: #86868b;
            word-break: break-all;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">

                    <div class="confetti-piece"></div>

                <div class="binding-item">
                    <span class="binding-label">绑定状态</span>

                <div class="binding-item">

        <!-- 底部按钮 -->

    </div>

    <script>

        document.querySelector('.primary-btn').addEventListener('click', function() {

            window.location.href = 'message.html';
        });

        document.querySelector('.secondary-btn').addEventListener('click', function() {

            window.location.href = 'security_settings.html';
        });
    </script>
</body>
</html>
