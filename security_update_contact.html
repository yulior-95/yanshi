<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新联系方式</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back-button {
            font-size: 16px;
            color: #1890ff;
            display: flex;
            align-items: center;
        }
        
        .header .back-button i {
            margin-right: 5px;
        }
        
        .header .title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .page-description {
            margin-bottom: 25px;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .contact-group {
            background-color: white;
            border-radius: 10px;
            margin-bottom: 25px;
            padding: 15px;
        }
        
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
        }
        
        .progress-bar::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 30px;
            right: 30px;
            height: 2px;
            background-color: #e8e8e8;
            z-index: 1;
        }
        
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 30px;
            width: 66.67%;
            height: 2px;
            background-color: #1890ff;
            z-index: 2;
        }
        
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            position: relative;
        }
        
        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #1890ff;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .step-circle.inactive {
            background-color: #e8e8e8;
            color: #999;
        }
        
        .step-label {
            font-size: 12px;
            color: #666;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 8px;
            color: #1890ff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .form-control {
            width: 100%;
            height: 46px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 16px;
            color: #333;
            background-color: #fff;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .verification-code-container {
            display: flex;
            align-items: center;
        }
        
        .verification-code-input {
            flex: 1;
            margin-right: 10px;
        }
        
        .btn-send-code {
            height: 46px;
            min-width: 110px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-send-code:disabled {
            background-color: #bae7ff;
            cursor: not-allowed;
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 15px;
        }
        
        .tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 15px;
            color: #666;
            cursor: pointer;
        }
        
        .tab.active {
            color: #1890ff;
            border-bottom: 2px solid #1890ff;
            font-weight: 500;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .button-container {
            padding: 20px;
            background-color: white;
            border-top: 1px solid #eaeaea;
        }
        
        .btn-next {
            width: 100%;
            height: 44px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .btn-next:disabled {
            background-color: #bae7ff;
            cursor: not-allowed;
        }
        
        /* 新增样式 - 已选择安全项展示 */
        .selected-items-container {
            background-color: white;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 15px;
        }
        
        .selected-items-title {
            font-size: 15px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .selected-items-title i {
            margin-right: 8px;
            color: #1890ff;
        }
        
        .selected-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .item-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background-color: #e6f7ff;
            border-radius: 20px;
            color: #1890ff;
            font-size: 14px;
        }
        
        .item-tag i {
            margin-right: 6px;
        }
        
        .item-tag.disabled {
            background-color: #f5f5f5;
            color: #999;
        }
        
        .note-container {
            background-color: #fff9e6;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
        }
        
        .note-content {
            display: flex;
            align-items: flex-start;
        }
        
        .note-content i {
            color: #fa8c16;
            margin-right: 8px;
            margin-top: 2px;
        }
        
        .note-text {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <div class="back-button">
            <i class="fas fa-chevron-left"></i>
            返回
        </div>
        <div class="title">更新联系方式</div>
        <div style="width: 60px;"></div>
    </div>
    
    <div class="content">
        <div class="progress-bar">
            <div class="progress-step">
                <div class="step-circle">1</div>
                <div class="step-label">选择项目</div>
            </div>
            <div class="progress-step">
                <div class="step-circle">2</div>
                <div class="step-label">安全验证</div>
            </div>
            <div class="progress-step">
                <div class="step-circle">3</div>
                <div class="step-label">更新信息</div>
            </div>
            <div class="progress-step">
                <div class="step-circle inactive">4</div>
                <div class="step-label">身份确认</div>
            </div>
        </div>
        
        <!-- 新增已选择安全项展示区域 -->
        <div class="selected-items-container">
            <div class="selected-items-title">
                <i class="fas fa-shield-alt"></i>
                您已选择以下安全项进行修改：
            </div>
            <div class="selected-items">
                <div class="item-tag">
                    <i class="fas fa-mobile-alt"></i>
                    手机号码
                </div>
                <div class="item-tag">
                    <i class="fas fa-qrcode"></i>
                    谷歌验证码
                </div>
                <div class="item-tag disabled">
                    <i class="fas fa-envelope"></i>
                    邮箱
                </div>
                <div class="item-tag disabled">
                    <i class="fas fa-key"></i>
                    安全交易密码
                </div>
            </div>
            
            <div class="note-container">
                <div class="note-content">
                    <i class="fas fa-info-circle"></i>
                    <div class="note-text">
                        灰色项目为未选择修改的安全项，此处仅展示您的选择。当前页面仅需完成需要更新联系方式的安全项。
                    </div>
                </div>
            </div>
        </div>
        
        <div class="page-description">
            根据您的选择，请设置新的联系方式，完成后需通过验证码确认。
        </div>
        
        <div class="contact-group">
            <div class="section-title">
                <i class="fas fa-mobile-alt"></i>
                设置新手机号码
            </div>
            
            <div class="form-group">
                <div class="form-label">国家/地区</div>
                <div class="form-control" style="display: flex; align-items: center; justify-content: space-between;">
                    <span>中国大陆 +86</span>
                    <i class="fas fa-chevron-down" style="color: #999;"></i>
                </div>
            </div>
            
            <div class="form-group">
                <div class="form-label">新手机号码</div>
                <input type="tel" class="form-control" placeholder="请输入新手机号码">
            </div>
            
            <div class="form-group">
                <div class="form-label">验证码</div>
                <div class="verification-code-container">
                    <input type="text" class="form-control verification-code-input" placeholder="请输入6位验证码">
                    <button class="btn-send-code">获取验证码</button>
                </div>
            </div>
        </div>
        
        <!-- 谷歌验证码更新区域，根据选择动态显示 -->
        <div class="contact-group">
            <div class="section-title">
                <i class="fas fa-qrcode"></i>
                设置新谷歌验证器
            </div>
            
            <div style="text-align: center; margin-bottom: 15px;">
                <img src="https://images.unsplash.com/photo-1621318164726-9e29b52219e5?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80" alt="谷歌验证码二维码" style="width: 200px; height: 200px; border-radius: 10px;">
            </div>
            
            <div class="form-group">
                <div class="form-label">密钥（备用）</div>
                <div class="form-control" style="display: flex; align-items: center; justify-content: space-between;">
                    <span style="color: #666; font-size: 15px;">HXDL 7Y3H G5MN VUTF XPQJ</span>
                    <i class="far fa-copy" style="color: #1890ff;"></i>
                </div>
            </div>
            
            <div class="form-group">
                <div class="form-label">验证码</div>
                <input type="text" class="form-control" placeholder="请输入谷歌验证器中的6位验证码">
            </div>
            
            <div style="font-size: 13px; color: #666; margin-top: 10px; line-height: 1.5;">
                <div style="margin-bottom: 5px;">
                    <i class="fas fa-info-circle" style="color: #1890ff; margin-right: 5px;"></i>
                    请使用谷歌验证器App扫描上方二维码，或手动输入密钥进行设置。
                </div>
                <div>
                    <i class="fas fa-exclamation-triangle" style="color: #fa8c16; margin-right: 5px;"></i>
                    请妥善保管备用密钥，当您更换设备时可用于恢复验证器。
                </div>
            </div>
        </div>
    </div>
    
    <div class="button-container">
        <button class="btn-next">下一步</button>
    </div>

    <script>
        // 模拟从上一步获取选择的安全项
        const selectedItems = {
            phone: true,
            google: true,
            email: false,
            password: false
        };
        
        // 页面加载时根据用户选择显示对应的表单区域
        window.onload = function() {
            // 更新已选择安全项的展示
            updateSelectedItemsDisplay();
        };
        
        // 更新已选择安全项的展示
        function updateSelectedItemsDisplay() {
            const itemTags = document.querySelectorAll('.item-tag');
            
            // 根据选择状态更新标签样式
            itemTags.forEach(tag => {
                const icon = tag.querySelector('i');
                if (icon.classList.contains('fa-mobile-alt') && !selectedItems.phone) {
                    tag.classList.add('disabled');
                } else if (icon.classList.contains('fa-envelope') && !selectedItems.email) {
                    tag.classList.add('disabled');
                } else if (icon.classList.contains('fa-qrcode') && !selectedItems.google) {
                    tag.classList.add('disabled');
                } else if (icon.classList.contains('fa-key') && !selectedItems.password) {
                    tag.classList.add('disabled');
                }
            });
        }
    </script>
</body>
</html>
