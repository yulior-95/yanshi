<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户详情</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .header .title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-right: 28px;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
        }
        
        .profile-section {
            background-color: white;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 10px solid #f8f9fa;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-name {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .profile-id {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
        }
        
        .gender-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
            font-size: 12px;
        }
        
        .gender-icon.male {
            background-color: #e6f7ff;
            color: #1890ff;
        }
        
        .gender-icon.female {
            background-color: #fff0f6;
            color: #eb2f96;
        }
        
        .info-section {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            width: 80px;
            font-size: 15px;
            color: #666;
        }
        
        .info-value {
            flex: 1;
            font-size: 15px;
            color: #333;
        }
        
        .action-button {
            margin: 20px 15px;
        }
        
        .add-friend-btn {
            width: 100%;
            height: 45px;
            background-color: #1890ff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .add-friend-btn:active {
            background-color: #096dd9;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        
        .modal-content {
            width: 90%;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .modal-body {
            padding: 20px 15px;
        }
        
        .verification-input {
            margin-bottom: 15px;
        }
        
        .verification-input textarea {
            width: 100%;
            height: 100px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }
        
        .modal-footer {
            display: flex;
            border-top: 1px solid #f0f2f5;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
        }
        
        .modal-btn.cancel {
            color: #666;
            border-right: 1px solid #f0f2f5;
        }
        
        .modal-btn.confirm {
            color: #1890ff;
            font-weight: 500;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <i class="fas fa-arrow-left back" onclick="window.location.href='add_friend_search.html'"></i>
        <div class="title">用户详情</div>
    </div>
    
    <div class="content">
        <div class="profile-section">
            <div class="profile-avatar">
                <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="profile-name">
                李明
                <span class="gender-icon male"><i class="fas fa-mars"></i></span>
            </div>
            <div class="profile-id">ID: liming2023</div>
            <div style="font-size: 14px; color: #999;">地区：北京</div>
        </div>
        
        <div class="info-section">
            <div class="info-item">
                <div class="info-label">手机号</div>
                <div class="info-value">139****5678</div>
            </div>
            <div class="info-item">
                <div class="info-label">个性签名</div>
                <div class="info-value">生活不止眼前的代码，还有诗和远方</div>
            </div>
        </div>
        
        <div class="action-button">
            <button class="add-friend-btn" id="addFriendBtn">添加好友</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="addFriendModal">
        <div class="modal-content">
            <div class="modal-header">
                添加好友
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 15px; font-size: 14px; color: #666;">
                    请输入验证信息，等待对方同意
                </div>
                <div class="verification-input">
                    <textarea placeholder="我是..." id="verificationText">我是...</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <div class="modal-btn cancel" id="cancelBtn">取消</div>
                <div class="modal-btn confirm" id="confirmBtn">发送</div>
            </div>
        </div>
    </div>
    

    
    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000);
            
            const addFriendBtn = document.getElementById('addFriendBtn');
            const addFriendModal = document.getElementById('addFriendModal');
            const cancelBtn = document.getElementById('cancelBtn');
            const confirmBtn = document.getElementById('confirmBtn');
            const verificationText = document.getElementById('verificationText');
            
            // 显示模态框
            addFriendBtn.addEventListener('click', function() {
                addFriendModal.style.display = 'flex';
            });
            
            // 取消添加
            cancelBtn.addEventListener('click', function() {
                addFriendModal.style.display = 'none';
            });
            
            // 确认添加
            confirmBtn.addEventListener('click', function() {
                // 判断是否有验证信息
                if (verificationText.value.trim() === '' || verificationText.value.trim() === '我是...') {
                    alert('请输入验证信息');
                    return;
                }
                
                // 关闭模态框
                addFriendModal.style.display = 'none';
                
                // 更改按钮状态
                addFriendBtn.textContent = '等待验证';
                addFriendBtn.style.backgroundColor = '#f0f2f5';
                addFriendBtn.style.color = '#999';
                addFriendBtn.disabled = true;
                
                // 模拟发送成功提示
                setTimeout(() => {
                    alert('验证信息已发送，等待对方同意');
                }, 500);
            });
        });
    </script>
</body>
</html>
