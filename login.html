<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .container {
            padding: 30px 20px;
        }
        
        .logo {
            text-align: center;
            margin: 40px 0;
        }
        
        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
        }
        
        .logo h1 {
            margin-top: 10px;
            font-size: 24px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-control {
            width: 100%;
            height: 50px;
            background-color: white;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
        }
        
        .form-control i {
            color: #adb5bd;
            margin-right: 10px;
            font-size: 20px;
        }
        
        .form-control input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 16px;
        }
        
        .form-control .verification-code {
            color: #1890ff;
            font-size: 14px;
            padding: 8px 12px;
            background-color: #f0f9ff;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .login-options {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
            margin-top: 15px;
            margin-bottom: 30px;
        }
        
        .login-type {
            display: flex;
            align-items: center;
        }
        
        .login-type input {
            margin-right: 5px;
        }
        
        .btn-login {
            width: 100%;
            height: 50px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 30px;
            cursor: pointer;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .register-link a {
            color: #1890ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="logo">
            <img src="https://images.unsplash.com/photo-1577563908411-5077b6dc7624?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="加密聊天">
            <h1>安全加密聊天</h1>
        </div>
        
        <div class="form-group">
            <div class="form-control">
                <i class="fas fa-mobile-alt"></i>
                <input type="tel" placeholder="请输入手机号/邮箱">
            </div>
        </div>
        
        <div class="form-group">
            <div class="form-control">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="请输入密码">
            </div>
        </div>
        
        <div class="login-options">
            <div class="login-type">
                <input type="radio" id="password" name="login-type" checked>
                <label for="password">密码登录</label>
            </div>
            <div class="login-type">
                <input type="radio" id="verification" name="login-type">
                <label for="verification">验证码登录</label>
            </div>
            <div>忘记密码？</div>
        </div>
        
        <button class="btn-login">登 录</button>
        
        <div class="register-link">
            还没有账号？<a href="register.html">立即注册</a>
        </div>
    </div>
</body>
</html>
