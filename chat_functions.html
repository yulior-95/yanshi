<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天功能窗口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
        }
        
        .header .info {
            flex: 1;
        }
        
        .header .name {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        
        .header .status {
            display: flex;
            font-size: 12px;
            color: #666;
            margin-top: 2px;
            align-items: center;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        
        .status-dot.online {
            background-color: #34c759;
        }
        
        .header .encryption-status {
            font-size: 12px;
            color: #1890ff;
            display: flex;
            align-items: center;
            margin-left: 8px;
        }
        
        .header .encryption-status i {
            margin-right: 4px;
        }
        
        .header .actions {
            display: flex;
            align-items: center;
        }
        
        .header .actions i {
            font-size: 20px;
            color: #333;
            margin-left: 15px;
        }
        
        .burn-setting-badge {
            background-color: #fff1e6;
            color: #ff9500;
            font-size: 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 2px 6px;
            cursor: pointer;
        }
        
        .burn-setting-badge i {
            margin-right: 4px;
            font-size: 12px;
        }
        
        .chat-body {
            flex: 1;
            padding: 10px 15px;
            overflow-y: auto;
            background-color: #f5f5f5;
            position: relative;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        
        .message-info {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 10px 12px;
            border-radius: 10px;
            position: relative;
            font-size: 16px;
            line-height: 1.4;
        }
        
        .message.received {
            align-items: flex-start;
        }
        
        .message.sent {
            align-items: flex-end;
        }
        
        .message.received .message-bubble {
            background-color: white;
            color: #333;
            border: 1px solid #e1e4e8;
            border-top-left-radius: 0;
        }
        
        .message.sent .message-bubble {
            background-color: #1890ff;
            color: white;
            border-top-right-radius: 0;
        }
        
        .function-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            z-index: 10;
            border-top: 1px solid #eaeaea;
        }
        
        .function-tabs {
            display: flex;
            border-bottom: 1px solid #eaeaea;
        }
        
        .function-tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 15px;
            color: #666;
            position: relative;
        }
        
        .function-tab.active {
            color: #1890ff;
        }
        
        .function-tab.active:after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background-color: #1890ff;
        }
        
        .function-content {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .function-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .function-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #1890ff;
            margin-bottom: 8px;
        }
        
        .function-name {
            font-size: 12px;
            color: #666;
        }
        
        .input-area {
            background-color: #f8f9fa;
            padding: 10px;
            border-top: 1px solid #eaeaea;
            display: flex;
            align-items: center;
        }
        
        .input-actions {
            display: flex;
            align-items: center;
            margin-right: 10px;
        }
        
        .input-actions i {
            font-size: 24px;
            color: #666;
        }
        
        .text-input {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
        }
        
        .text-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            margin: 0 10px;
        }
        
        .text-input i {
            color: #999;
            font-size: 20px;
        }
        
        .send-button {
            margin-left: 10px;
            width: 36px;
            height: 36px;
            background-color: #1890ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
        }
        
        /* 添加消息状态样式 */
        .message-status {
            font-size: 12px;
            margin-left: 5px;
            display: inline-flex;
            align-items: center;
        }
        
        .status-sending {
            color: #999;
            animation: rotate 1s linear infinite;
        }
        
        .status-sent {
            color: #999;
        }
        
        .status-delivered {
            color: #999;
        }
        
        .status-read {
            color: #1890ff;
        }
        
        .status-failed {
            color: #ff3b30;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 发送失败消息样式 */
        .message.failed .message-bubble {
            border: 1px solid rgba(255, 59, 48, 0.3);
        }
        
        /* 重发按钮样式 */
        .resend-button {
            font-size: 12px;
            color: #ff3b30;
            background-color: rgba(255, 59, 48, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 5px;
            cursor: pointer;
            align-self: flex-end;
            display: none;
        }
        
        .message.failed .resend-button {
            display: inline-block;
        }
        
        .resend-button:hover {
            background-color: rgba(255, 59, 48, 0.2);
        }
        
        /* 文件传输进度样式 */
        .upload-progress {
            height: 4px;
            background-color: #f0f2f5;
            border-radius: 2px;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: #1890ff;
            border-radius: 2px;
            transition: width 0.3s;
        }
        
        .upload-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }
        
        .message.received .upload-info {
            color: rgba(0, 0, 0, 0.5);
        }
        
        /* 网络错误提示样式 */
        .network-error-notice {
            background-color: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .network-error-notice i {
            margin-right: 8px;
        }
        
        .retry-button {
            background-color: #ff3b30;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>

    <!-- 添加JavaScript处理消息状态和网络提示 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 实时更新状态栏时间
            function updateTime() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                document.querySelector('.time').textContent = `${hours}:${minutes}`;
            }
            
            updateTime();
            setInterval(updateTime, 60000);
            
            // 模拟上传进度
            const progressBar = document.querySelector('.progress-bar');
            const progressText = document.querySelector('.upload-info span:last-child');
            const uploadSizeText = document.querySelector('.upload-info span:first-child');
            
            let progress = 65;
            const totalSize = 6.5; // MB
            
            const uploadInterval = setInterval(() => {
                if (progress >= 100) {
                    clearInterval(uploadInterval);
                    
                    // 更新成已发送状态
                    const statusIndicator = document.querySelector('.message-status.status-sending');
                    statusIndicator.className = 'message-status status-sent';
                    statusIndicator.innerHTML = '<i class="fas fa-check"></i>';
                    
                    setTimeout(() => {
                        statusIndicator.className = 'message-status status-delivered';
                        statusIndicator.innerHTML = '<i class="fas fa-check-double"></i>';
                    }, 1000);
                    
                    return;
                }
                
                progress += 5;
                const currentSize = (totalSize * progress / 100).toFixed(1);
                
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `${progress}%`;
                uploadSizeText.textContent = `${currentSize}MB / ${totalSize}MB`;
            }, 1000);
            
            // 失败消息点击重发事件
            const resendButtons = document.querySelectorAll('.resend-button');
            resendButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const messageElement = this.parentElement;
                    
                    // 移除失败状态
                    messageElement.classList.remove('failed');
                    
                    // 获取状态指示器
                    const statusIndicator = messageElement.querySelector('.message-status');
                    statusIndicator.className = 'message-status status-sending';
                    statusIndicator.innerHTML = '<i class="fas fa-circle-notch"></i>';
                    
                    // 更新消息气泡内容
                    const errorText = messageElement.querySelector('.message-bubble div div div:last-child');
                    errorText.textContent = '正在重新上传...';
                    errorText.style.color = '#999';
                    
                    // 隐藏重发按钮
                    this.style.display = 'none';
                    
                    // 模拟重发过程
                    setTimeout(() => {
                        statusIndicator.className = 'message-status status-sent';
                        statusIndicator.innerHTML = '<i class="fas fa-check"></i>';
                        
                        // 更新消息气泡内容
                        errorText.textContent = '上传完成';
                        errorText.style.color = '#52c41a';
                        
                        setTimeout(() => {
                            statusIndicator.className = 'message-status status-delivered';
                            statusIndicator.innerHTML = '<i class="fas fa-check-double"></i>';
                        }, 1000);
                    }, 2500);
                });
            });
            
            // 网络错误提示的重试按钮
            const retryButton = document.querySelector('.retry-button');
            retryButton.addEventListener('click', function() {
                const notice = this.parentElement;
                
                // 显示正在重新连接
                this.textContent = '连接中...';
                this.disabled = true;
                
                // 模拟重新连接
                setTimeout(() => {
                    notice.style.backgroundColor = 'rgba(82, 196, 26, 0.1)';
                    notice.style.color = '#52c41a';
                    notice.querySelector('div').innerHTML = '<i class="fas fa-wifi"></i> 网络已恢复，消息将正常发送';
                    this.style.display = 'none';
                    
                    // 3秒后隐藏提示
                    setTimeout(() => {
                        notice.style.display = 'none';
                    }, 3000);
                }, 2000);
            });
            
            // 底部网络状态提示的重新连接按钮
            const reconnectButton = document.querySelector('button[style*="border: 1px solid #ff3b30"]');
            reconnectButton.addEventListener('click', function() {
                const statusText = this.previousElementSibling;
                
                // 显示正在重新连接
                this.textContent = '连接中...';
                this.disabled = true;
                
                // 模拟重新连接
                setTimeout(() => {
                    statusText.innerHTML = '<i class="fas fa-wifi" style="margin-right: 5px;"></i> 网络已恢复正常';
                    statusText.style.color = '#52c41a';
                    this.style.display = 'none';
                    
                    // 关闭失败上传的错误提示
                    document.querySelector('.message.failed').classList.remove('failed');
                    
                    // 更新失败消息状态
                    const failedStatus = document.querySelector('.message-status.status-failed');
                    failedStatus.className = 'message-status status-sending';
                    failedStatus.innerHTML = '<i class="fas fa-circle-notch"></i>';
                    
                    // 更新消息气泡内容
                    const errorText = document.querySelector('.message-bubble div div div:last-child');
                    errorText.textContent = '正在重新上传...';
                    errorText.style.color = '#999';
                    
                    // 隐藏重发按钮
                    document.querySelector('.resend-button').style.display = 'none';
                    
                    // 模拟成功上传
                    setTimeout(() => {
                        failedStatus.className = 'message-status status-sent';
                        failedStatus.innerHTML = '<i class="fas fa-check"></i>';
                        
                        // 更新消息气泡内容
                        errorText.textContent = '上传完成';
                        errorText.style.color = '#52c41a';
                    }, 2000);
                }, 2000);
            });
        });
    </script>
</body>
</html>
