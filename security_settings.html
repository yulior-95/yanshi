<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全设置</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="time">12:30</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>
        
        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back"><i class="fas fa-chevron-left"></i> 返回</div>
            <div class="title">安全设置</div>
            <div></div>
        </div>
        
        <!-- 内容区 -->
        <div class="content">
            <div class="card">
                <div class="list-item">
                    <div class="title">登录密码</div>
                    <div class="value">修改 <i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="list-item">
                    <div class="title">指纹验证</div>
                    <div class="value">已设置 <i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="list-item">
                    <div class="title">面容识别</div>
                    <div class="value">未设置 <i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="list-item" onclick="window.location.href='itoken_authorize.html'" style="cursor: pointer;">
                    <div class="title">iToken设备绑定</div>
                    <div class="value">未绑定 <i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
            
            <div class="card">
                <div class="list-item">
                    <div class="title">应用指纹验证场景</div>
                    <div class="value"><i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="list-item">
                    <div class="title">安全验证</div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="list-item">
                    <div class="title">支付验证</div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="list-item">
                    <div class="title">登录验证</div>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <div class="card">
                <div class="list-item">
                    <div class="title">安全手机</div>
                    <div class="value">138****5678 <i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="list-item">
                    <div class="title">安全邮箱</div>
                    <div class="value">未设置 <i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
        </div>
        
        <!-- 底部标签栏 -->
        <div class="tab-bar">
            <div class="tab-item">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="tab-item">
                <i class="fas fa-compass"></i>
                <span>发现</span>
            </div>
            <div class="tab-item">
                <i class="fas fa-bell"></i>
                <span>通知</span>
            </div>
            <div class="tab-item active">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
