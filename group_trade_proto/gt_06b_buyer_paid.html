<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>买方 · 已付款待放币</title>

</head>
<body>
  <div class="phone">
    <div class="status">
      <span class="time">9:45</span>
      <div class="island"></div>
      <div class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
    </div>
    <div class="nav">
      <a class="back" href="gt_05_chat_packet.html"><i class="fa-solid fa-chevron-left"></i></a>

      <div class="side"></div>
    </div>
    <div class="body pad">
      <div style="display:flex;justify-content:center;margin-bottom:4px">
        <span class="tag blue"><i class="fa-solid fa-check"></i> 已付款</span>
      </div>

        <div class="clock">06:18</div>

        <div class="coin">USDT</div>

        <div style="font-weight:600">已通知卖方</div>
        <div style="font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5">
          若倒计时结束卖方仍未放币，你可发起申诉，由后台审核处理。

      </div>
      <div class="timeline" style="margin:8px 0 16px;padding:0 8px">
        <div class="item"><div class="dot green"></div><div><div class="t">订单创建</div><div class="d">09:41</div></div></div>
        <div class="item"><div class="dot green"></div><div><div class="t">你已确认付款</div><div class="d">09:44</div></div></div>
        <div class="item"><div class="dot orange"></div><div><div class="t">等待卖方「我已收到」</div><div class="d">进行中</div></div></div>
      </div>
      <a class="btn soft" href="gt_07_seller_detail.html" style="display:grid;place-items:center;text-decoration:none;margin-bottom:10px">查看卖方视角</a>
      <a class="btn ghost" href="gt_11_appeal_entry.html" style="display:grid;place-items:center;text-decoration:none">模拟超时 → 进入申诉入口</a>

    <div class="home-indicator"></div>
  </div>
