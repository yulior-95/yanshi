<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>输入安全密码</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="gt_common.css">
</head>
<body>
  <div class="phone">
    <div class="status">
      <span class="time">9:41</span>
      <div class="island"></div>
      <div class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
    </div>
    <div class="nav">
      <a class="back" href="gt_03_create.html"><i class="fa-solid fa-chevron-left"></i></a>
      <div class="title-wrap"><div class="title">安全验证</div></div>
      <div class="side"></div>
    </div>

    <div class="body" style="display:flex;flex-direction:column">
      <div style="text-align:center;padding:28px 24px 0">
        <div style="width:56px;height:56px;border-radius:16px;background:var(--theme-soft);color:var(--theme);display:grid;place-items:center;margin:0 auto 16px;font-size:24px">
          <i class="fa-solid fa-lock"></i>
        </div>
        <div style="font-size:18px;font-weight:600">请输入安全密码</div>
        <div style="font-size:13px;color:var(--sub);margin-top:8px">发起群聊交易 · 冻结 200.00 USDT<br>买家将支付 ¥1,450.00（汇率 7.25）</div>
      </div>
      <div class="dots" id="dots">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div style="flex:1"></div>
      <div class="pin-pad" id="pad">
        <button type="button">1</button><button type="button">2</button><button type="button">3</button>
        <button type="button">4</button><button type="button">5</button><button type="button">6</button>
        <button type="button">7</button><button type="button">8</button><button type="button">9</button>
        <button type="button" class="ghost"></button>
        <button type="button">0</button>
        <button type="button" class="ghost" data-del><i class="fa-solid fa-delete-left"></i></button>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
  <script>
    let pin = '';
    const dots = [...document.querySelectorAll('#dots i')];
    function render() {
      dots.forEach((d, i) => d.classList.toggle('on', i < pin.length));
      if (pin.length === 6) location.href = 'gt_05_chat_packet.html';
    }
    document.querySelectorAll('#pad button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.hasAttribute('data-del')) { pin = pin.slice(0, -1); render(); return; }
        const t = btn.textContent.trim();
        if (!/^\d$/.test(t) || pin.length >= 6) return;
        pin += t; render();
      });
    });
  </script>
</body>
</html>
