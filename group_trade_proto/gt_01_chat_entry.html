<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>群聊 · 群聊交易入口</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="gt_common.css">
  <style>
    .chat-bg { background: #ebebeb url("https://images.unsplash.com/photo-1557683316-973673baf926?w=800&q=40") center/cover; }
    .chat-bg .body { background: rgba(237,238,243,.92); }
    .plus-panel {
      background: #f7f7f8; border-top: 1px solid var(--line); padding: 16px 12px 8px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; flex-shrink: 0;
    }
    .plus-panel a {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      text-decoration: none; color: var(--ink); font-size: 12px;
    }
    .plus-panel .ico {
      width: 56px; height: 56px; border-radius: 14px; background: #fff;
      display: grid; place-items: center; font-size: 22px; color: #444;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .plus-panel .ico.trade { color: var(--theme); background: var(--theme-soft); }
    .composer {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: #f7f7f8; border-top: 1px solid var(--line); flex-shrink: 0;
    }
    .composer input {
      flex: 1; height: 36px; border: 0; border-radius: 8px; padding: 0 12px;
      background: #fff; font: inherit; font-size: 15px;
    }
    .composer button {
      width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent;
      color: #555; font-size: 20px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone chat-bg">
    <div class="status">
      <span class="time">9:41</span>
      <div class="island"></div>
      <div class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
    </div>
    <div class="nav" style="background:rgba(255,255,255,.9);backdrop-filter:blur(12px)">
      <button class="back"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="title-wrap">
        <div class="title">币友交流群</div>
        <div class="sub">128 名成员 · 已开放群聊交易</div>
      </div>
      <button class="side" style="border:0;background:transparent;font-size:18px;color:#333"><i class="fa-solid fa-ellipsis"></i></button>
    </div>

    <div class="body pad">
      <div class="msg-row">
        <img class="avatar sm" src="../figma_proto/assets/media/avatar_contact1.png" alt="">
        <div class="bubble">有人出 USDT 吗？支持支付宝</div>
      </div>
      <div class="msg-row">
        <img class="avatar sm" src="../figma_proto/assets/media/avatar_contact3.png" alt="">
        <div class="bubble">走群聊交易比较安全，有倒计时</div>
      </div>
      <div class="msg-row me">
        <img class="avatar sm" src="../figma_proto/assets/media/avatar_albert.png" alt="">
        <div>
          <a class="packet" href="gt_05_chat_packet.html" style="display:block;text-decoration:none;color:#fff">
            <div class="top"><i class="fa-solid fa-handshake"></i> 群聊交易</div>
            <div class="mid">200.00 USDT</div>
            <div style="font-size:12px;opacity:.9;margin:-4px 0 8px">应付 ¥1,450.00</div>
            <div class="bot"><span>买家 · Alex</span><span>点击查看</span></div>
          </a>
        </div>
      </div>
    </div>

    <div class="composer">
      <button><i class="fa-regular fa-face-smile"></i></button>
      <input placeholder="发消息…" readonly>
      <button id="btnPlus"><i class="fa-solid fa-plus"></i></button>
    </div>
    <div class="plus-panel" id="plusPanel">
      <a href="#"><div class="ico"><i class="fa-regular fa-image"></i></div>相册</a>
      <a href="#"><div class="ico"><i class="fa-solid fa-camera"></i></div>拍摄</a>
      <a href="gt_02_select_payee.html"><div class="ico trade"><i class="fa-solid fa-right-left"></i></div>群聊交易</a>
      <a href="#"><div class="ico"><i class="fa-solid fa-gift" style="color:#e84a3d"></i></div>红包</a>
      <a href="#"><div class="ico"><i class="fa-solid fa-file"></i></div>文件</a>
      <a href="#"><div class="ico"><i class="fa-solid fa-id-card"></i></div>名片</a>
      <a href="#"><div class="ico"><i class="fa-solid fa-phone"></i></div>语音通话</a>
      <a href="#"><div class="ico"><i class="fa-solid fa-video"></i></div>视频通话</a>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
