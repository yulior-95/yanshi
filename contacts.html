<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .header .actions {
            display: flex;
            align-items: center;
        }
        
        .header .actions i {
            font-size: 20px;
            color: #333;
            margin-left: 20px;
        }
        
        .search-bar {
            padding: 10px 15px;
            background-color: white;
        }
        
        .search-input {
            background-color: #f0f2f5;
            border-radius: 10px;
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }
        
        .search-input i {
            color: #999;
            margin-right: 8px;
        }
        
        .search-input input {
            border: none;
            background: transparent;
            flex: 1;
            outline: none;
            font-size: 14px;
        }
        
        .contact-list {
            flex: 1;
            overflow-y: auto;
            background-color: white;
        }
        
        .section-header {
            padding: 8px 15px;
            background-color: #f5f5f5;
            font-size: 14px;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        
        .contact-item {
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f2f5;
            align-items: center;
        }
        
        .contact-item:active {
            background-color: #f9f9f9;
        }
        
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            margin-right: 12px;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .contact-info {
            flex: 1;
        }
        
        .contact-name {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .contact-status {
            font-size: 13px;
            color: #999;
            margin-top: 3px;
        }
        
        .group-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e6f7ff;
            color: #1890ff;
        }
        
        .group-icon i {
            font-size: 20px;
        }
        
        .contact-action {
            color: #999;
            font-size: 16px;
        }
        
        .index-bar {
            position: fixed;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            font-size: 12px;
            color: #1890ff;
        }
        
        .index-bar div {
            padding: 2px 4px;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <div class="title">通讯录</div>
        <div class="actions">
            <i class="fas fa-plus"></i>
        </div>
    </div>
    
    <div class="search-bar">
        <div class="search-input">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索">
        </div>
    </div>
    
    <div class="contact-list">
        <div class="section-header">群聊</div>
        
        <div class="contact-item">
            <div class="avatar group-icon">
                <i class="fas fa-users"></i>
            </div>
            <div class="contact-info">
                <div class="contact-name">网络安全群</div>
                <div class="contact-status">28人</div>
            </div>
            <div class="contact-action">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="contact-item">
            <div class="avatar group-icon">
                <i class="fas fa-users"></i>
            </div>
            <div class="contact-info">
                <div class="contact-name">WEB3讨论组</div>
                <div class="contact-status">15人</div>
            </div>
            <div class="contact-action">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="section-header">好友</div>
        
        <div class="contact-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="contact-info">
                <div class="contact-name">张三</div>
                <div class="contact-status">在线</div>
            </div>
            <div class="contact-action">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="contact-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="contact-info">
                <div class="contact-name">李四</div>
                <div class="contact-status">当前可用</div>
            </div>
            <div class="contact-action">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="contact-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="contact-info">
                <div class="contact-name">王五</div>
                <div class="contact-status">1小时前在线</div>
            </div>
            <div class="contact-action">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="contact-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="contact-info">
                <div class="contact-name">赵六</div>
                <div class="contact-status">5小时前在线</div>
            </div>
            <div class="contact-action">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
    </div>
    
    <div class="index-bar">
        <div>群</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>L</div>
        <div>W</div>
        <div>Z</div>
        <div>#</div>
    </div>
    
    <div class="tab-bar">
        <div class="tab">
            <i class="fas fa-comment"></i>
            <span>消息</span>
        </div>
        <div class="tab active">
            <i class="fas fa-address-book"></i>
            <span>通讯录</span>
        </div>
        <div class="tab">
            <i class="fas fa-phone-alt"></i>
            <span>通话</span>
        </div>
        <div class="tab">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>
</body>
</html>
