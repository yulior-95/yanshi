<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            align-items: center;
        }
        
        .header .back {
            font-size: 20px;
            color: #333;
        }
        
        .header .title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-right: 20px;
        }
        
        .container {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control {
            width: 100%;
            height: 50px;
            background-color: white;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
        }
        
        .form-control i {
            color: #adb5bd;
            margin-right: 10px;
            font-size: 20px;
        }
        
        .form-control input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 16px;
        }
        
        .form-control .verification-code {
            color: #1890ff;
            font-size: 14px;
            padding: 8px 12px;
            background-color: #f0f9ff;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .agreement {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-top: 15px;
            margin-bottom: 30px;
        }
        
        .agreement input {
            margin-right: 5px;
        }
        
        .agreement a {
            color: #1890ff;
            text-decoration: none;
        }
        
        .btn-register {
            width: 100%;
            height: 50px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .login-link a {
            color: #1890ff;
            text-decoration: none;
        }
        
        .register-type {
            display: flex;
            margin-bottom: 20px;
        }
        
        .register-type-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-bottom: 2px solid transparent;
            color: #666;
            cursor: pointer;
        }
        
        .register-type-item.active {
            color: #1890ff;
            border-bottom-color: #1890ff;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <i class="fas fa-arrow-left back"></i>
        <div class="title">注册账号</div>
    </div>
    
    <div class="container">
        <div class="register-type">
            <div class="register-type-item active">手机注册</div>
            <div class="register-type-item">邮箱注册</div>
        </div>
        
        <div class="form-group">
            <label class="form-label">手机号</label>
            <div class="form-control">
                <i class="fas fa-mobile-alt"></i>
                <input type="tel" placeholder="请输入手机号">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">验证码</label>
            <div class="form-control">
                <i class="fas fa-shield-alt"></i>
                <input type="text" placeholder="请输入验证码">
                <div class="verification-code">获取验证码</div>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">设置密码</label>
            <div class="form-control">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="请设置8-20位密码">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">确认密码</label>
            <div class="form-control">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="请再次输入密码">
            </div>
        </div>
        
        <div class="agreement">
            <input type="checkbox" id="agree" checked>
            <label for="agree">我已阅读并同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a></label>
        </div>
        
        <button class="btn-register">注 册</button>
        
        <div class="login-link">
            已有账号？<a href="login.html">立即登录</a>
        </div>
    </div>
</body>
</html>
