<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>主播打赏榜</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="live_reward_proto.css">
</head>
<body class="lr-proto lr-page-light">
    <header class="lr-status-bar lr-status-light">
        <span class="lr-sb-time">9:41</span>
        <span class="lr-dynamic-island" aria-hidden="true"></span>
        <div class="lr-sb-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </header>

    <div class="lr-nav-header">
        <button type="button" class="lr-nav-back"><i class="fas fa-chevron-left"></i></button>
        <div class="lr-nav-meta" style="flex:1;text-align:center;margin-right:32px;">
            <div class="lr-nav-title" style="font-size:17px;">主播打赏榜</div>
            <div class="lr-nav-sub">本场直播 · 累计已送出</div>
        </div>
    </div>

    <main class="lr-rank-main">
        <p class="lr-rank-tip">
            <i class="fas fa-circle-info" style="color:#1890ff;"></i>
            统计维度：<strong>观众 → 当前主播</strong> 的送礼总额（C币），实时刷新；与积分无关。
        </p>

        <div class="lr-rank-row">
            <div class="lr-rank-num rank-1"><i class="fas fa-trophy"></i></div>
            <div class="lr-rank-avatar"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&q=80&auto=format&fit=crop" alt=""></div>
            <div class="lr-rank-info">
                <div class="lr-rank-name">糖纸风筝</div>
                <div class="lr-rank-sub">送出火箭 ×2 · 城堡 ×1</div>
            </div>
            <div class="lr-rank-amount">1,364 <small style="font-size:11px;color:#8e8e93;font-weight:600;">C币</small></div>
        </div>

        <div class="lr-rank-row">
            <div class="lr-rank-num rank-2">2</div>
            <div class="lr-rank-avatar"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=120&q=80&auto=format&fit=crop" alt=""></div>
            <div class="lr-rank-info">
                <div class="lr-rank-name">OceanLin</div>
                <div class="lr-rank-sub">跑车 ×6</div>
            </div>
            <div class="lr-rank-amount">228 <small style="font-size:11px;color:#8e8e93;font-weight:600;">C币</small></div>
        </div>

        <div class="lr-rank-row">
            <div class="lr-rank-num rank-3">3</div>
            <div class="lr-rank-avatar"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120&q=80&auto=format&fit=crop" alt=""></div>
            <div class="lr-rank-info">
                <div class="lr-rank-name">小鹿叮叮</div>
                <div class="lr-rank-sub">玫瑰 ×120</div>
            </div>
            <div class="lr-rank-amount">120 <small style="font-size:11px;color:#8e8e93;font-weight:600;">C币</small></div>
        </div>

        <div class="lr-rank-row">
            <div class="lr-rank-num">4</div>
            <div class="lr-rank-avatar"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=120&q=80&auto=format&fit=crop" alt=""></div>
            <div class="lr-rank-info">
                <div class="lr-rank-name">阿杰</div>
                <div class="lr-rank-sub">荧光棒 ×15</div>
            </div>
            <div class="lr-rank-amount">120 <small style="font-size:11px;color:#8e8e93;font-weight:600;">C币</small></div>
        </div>

        <div class="lr-rank-row">
            <div class="lr-rank-num">5</div>
            <div class="lr-rank-avatar"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=80&auto=format&fit=crop" alt=""></div>
            <div class="lr-rank-info">
                <div class="lr-rank-name">Momo</div>
                <div class="lr-rank-sub">混合礼物</div>
            </div>
            <div class="lr-rank-amount">86 <small style="font-size:11px;color:#8e8e93;font-weight:600;">C币</small></div>
        </div>

        <p class="lr-rank-tip" style="margin-top:8px;">金额单位为 <strong>C币</strong>；榜单仅展示本场直播周期内数据。</p>
    </main>

    <nav class="lr-tab-bar-app">
        <div class="lr-tab-item"><i class="far fa-comment-dots"></i><span>消息</span></div>
        <div class="lr-tab-item"><i class="far fa-address-book"></i><span>通讯录</span></div>
        <div class="lr-tab-item active"><i class="fas fa-tower-broadcast"></i><span>直播</span></div>
        <div class="lr-tab-item"><i class="far fa-user"></i><span>我的</span></div>
    </nav>
</body>
</html>
