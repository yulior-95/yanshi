<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全密码验证</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: rgba(0, 0, 0, 0.7);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 密码验证弹窗 */
        .password-modal {
            width: 90%;
            max-width: 340px;
            background: linear-gradient(180deg, #242442 0%, #1a1a2e 100%);
            border-radius: 24px;
            padding: 32px 24px;
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.8) translateY(30px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* 头部图标 */
        .password-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .password-icon::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(16, 185, 129, 0.3);
            animation: pulse-icon 2s infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .password-icon i {
            font-size: 36px;
            color: #10b981;
        }

        /* 标题 */
        .password-title {
            text-align: center;
            margin-bottom: 8px;
        }

        .password-title h3 {
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .password-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* 交易信息摘要 */
        .transaction-summary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .summary-row:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .summary-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .summary-value {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        .summary-value.highlight {
            color: #10b981;
            font-size: 16px;
            font-weight: 600;
        }

        /* 密码输入区域 */
        .password-input-area {
            margin-bottom: 20px;
        }

        .password-input-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .forgot-password {
            color: #e94560;
            font-size: 12px;
            cursor: pointer;
        }

        /* 密码圆点输入框 */
        .password-dots-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .password-dot {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .password-dot.filled {
            background: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }

        .password-dot.filled::after {
            content: '';
            width: 14px;
            height: 14px;
            background: #10b981;
            border-radius: 50%;
            animation: dotPop 0.2s;
        }

        @keyframes dotPop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .password-dot.error {
            background: rgba(233, 69, 96, 0.1);
            border-color: #e94560;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 数字键盘 */
        .number-keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .key-btn {
            height: 56px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: white;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .key-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .key-btn:active {
            background: rgba(16, 185, 129, 0.2);
            transform: scale(0.95);
        }

        .key-btn.action {
            background: transparent;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
        }

        .key-btn.action:hover {
            color: white;
        }

        .key-btn.delete {
            color: #e94560;
        }

        /* 生物识别选项 */
        .biometric-option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .biometric-option:hover {
            color: white;
        }

        .biometric-option i {
            font-size: 20px;
            color: #1890ff;
        }

        /* 安全提示 */
        .security-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
        }

        .security-footer i {
            color: #10b981;
        }

        /* 验证成功状态 */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .success-content {
            text-align: center;
            animation: successPop 0.5s;
        }

        @keyframes successPop {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 15px 50px rgba(16, 185, 129, 0.4);
        }

        .success-icon i {
            font-size: 48px;
            color: white;
        }

        .success-text {
            color: white;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .success-subtext {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 密码验证弹窗 -->
    <div class="password-modal">
        <!-- 图标 -->
        <div class="password-icon">
            <i class="fas fa-shield-alt"></i>
        </div>

        <!-- 标题 -->
        <div class="password-title">
            <h3>安全密码验证</h3>
        </div>
        <p class="password-subtitle">请输入6位安全密码完成验证</p>

        <!-- 交易信息摘要 -->
        <div class="transaction-summary">
            <div class="summary-row">
                <span class="summary-label">操作类型</span>
                <span class="summary-value">游戏资产转入</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">目标游戏</span>
                <span class="summary-value">德州扑克</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">转入金额</span>
                <span class="summary-value highlight">100 USDT</span>
            </div>
        </div>

        <!-- 密码输入区域 -->
        <div class="password-input-area">
            <div class="password-input-label">
                <span>安全密码</span>
                <span class="forgot-password">忘记密码?</span>
            </div>
            <div class="password-dots-container" id="passwordDots">
                <div class="password-dot" data-index="0"></div>
                <div class="password-dot" data-index="1"></div>
                <div class="password-dot" data-index="2"></div>
                <div class="password-dot" data-index="3"></div>
                <div class="password-dot" data-index="4"></div>
                <div class="password-dot" data-index="5"></div>
            </div>
        </div>

        <!-- 数字键盘 -->
        <div class="number-keyboard">
            <div class="key-btn" onclick="inputPassword('1')">1</div>
            <div class="key-btn" onclick="inputPassword('2')">2</div>
            <div class="key-btn" onclick="inputPassword('3')">3</div>
            <div class="key-btn" onclick="inputPassword('4')">4</div>
            <div class="key-btn" onclick="inputPassword('5')">5</div>
            <div class="key-btn" onclick="inputPassword('6')">6</div>
            <div class="key-btn" onclick="inputPassword('7')">7</div>
            <div class="key-btn" onclick="inputPassword('8')">8</div>
            <div class="key-btn" onclick="inputPassword('9')">9</div>
            <div class="key-btn action" onclick="useBiometric()"><i class="fas fa-fingerprint"></i></div>
            <div class="key-btn" onclick="inputPassword('0')">0</div>
            <div class="key-btn action delete" onclick="deletePassword()"><i class="fas fa-backspace"></i></div>
        </div>

        <!-- 生物识别选项 -->
        <div class="biometric-option" onclick="useBiometric()">
            <i class="fas fa-fingerprint"></i>
            <span>使用指纹/面容验证</span>
        </div>

        <!-- 安全提示 -->
        <div class="security-footer">
            <i class="fas fa-lock"></i>
            <span>密码已加密传输 · 本地安全存储</span>
        </div>
    </div>

    <!-- 验证成功弹窗 -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <div class="success-text">验证成功</div>
            <div class="success-subtext">正在进入游戏...</div>
        </div>
    </div>

    <script>
        let password = '';
        const maxLength = 6;

        function inputPassword(num) {
            if (password.length >= maxLength) return;
            
            password += num;
            updateDots();
            
            if (password.length === maxLength) {
                verifyPassword();
            }
        }

        function deletePassword() {
            if (password.length > 0) {
                password = password.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            const dots = document.querySelectorAll('.password-dot');
            dots.forEach((dot, index) => {
                dot.classList.remove('filled', 'error');
                if (index < password.length) {
                    dot.classList.add('filled');
                }
            });
        }

        function verifyPassword() {
            // 模拟验证过程
            setTimeout(() => {
                // 模拟验证成功（实际应用中会发送请求验证）
                if (password === '123456') {
                    showSuccess();
                } else {
                    showError();
                }
            }, 500);
        }

        function showError() {
            const dots = document.querySelectorAll('.password-dot');
            dots.forEach(dot => {
                dot.classList.add('error');
            });
            
            setTimeout(() => {
                password = '';
                updateDots();
            }, 500);
        }

        function showSuccess() {
            document.getElementById('successOverlay').style.display = 'flex';
            
            // 2秒后模拟跳转
            setTimeout(() => {
                alert('验证成功！即将进入游戏...');
            }, 1500);
        }

        function useBiometric() {
            // 模拟生物识别
            const dots = document.querySelectorAll('.password-dot');
            let i = 0;
            const interval = setInterval(() => {
                if (i < maxLength) {
                    dots[i].classList.add('filled');
                    i++;
                } else {
                    clearInterval(interval);
                    password = '123456';
                    showSuccess();
                }
            }, 100);
        }
    </script>
</body>
</html>
