<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打赏 · 礼物（C币）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="live_reward_proto.css">
</head>
<body class="lr-proto lr-live-room">
    <header class="lr-status-bar lr-status-light">
        <span class="lr-sb-time">9:41</span>
        <span class="lr-dynamic-island" aria-hidden="true"></span>
        <div class="lr-sb-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </header>

    <div class="lr-nav-header">
        <button type="button" class="lr-nav-back"><i class="fas fa-chevron-left"></i></button>
        <div class="lr-nav-avatar">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=160&q=80&auto=format&fit=crop" alt="">
        </div>
        <div class="lr-nav-meta">
            <div class="lr-nav-title">68测试群-0...(43)</div>
            <div class="lr-nav-sub">刚刚在线</div>
        </div>
    </div>

    <div class="lr-scroll-stack">
        <div class="lr-half-player">
            <img class="lr-video-img" src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=900&q=85&auto=format&fit=crop" alt="">
            <button type="button" class="lr-pp-chevron"><i class="fas fa-chevron-down"></i></button>
            <button type="button" class="lr-pp-mute"><i class="fas fa-volume-xmark"></i></button>
            <div class="lr-pp-pause"><i class="fas fa-pause"></i></div>
            <div class="lr-pp-live"><span class="dot"></span>正在直播</div>
            <div class="lr-pp-score">ITA 0 11 · 13 0 POL</div>
            <button type="button" class="lr-pp-fs"><i class="fas fa-expand"></i></button>
            <button type="button" class="lr-reward-fab"><i class="fas fa-gift"></i><span class="lr-fab-label">打赏</span></button>
        </div>
        <div class="lr-chat-feed">
            <div class="lr-msg incoming">
                <div class="lr-msg-avatar"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&q=80&auto=format&fit=crop" alt=""></div>
                <div class="lr-msg-body">
                    <div class="lr-msg-name">小雅</div>
                    <div class="lr-bubble">单打太强了<span class="lr-msg-time">17:11</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="lr-composer">
        <div class="lr-composer-inner">
            <button type="button" class="lr-comp-plus"><i class="fas fa-plus"></i></button>
            <div class="lr-comp-field"><span class="at">@</span><input type="text" placeholder=""></div>
            <button type="button" class="lr-comp-emoji"><i class="far fa-face-smile"></i></button>
            <button type="button" class="lr-comp-send"><i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <nav class="lr-tab-bar-app">
        <div class="lr-tab-item"><i class="far fa-comment-dots"></i><span>消息</span></div>
        <div class="lr-tab-item"><i class="far fa-address-book"></i><span>通讯录</span></div>
        <div class="lr-tab-item active"><i class="fas fa-tower-broadcast"></i><span>直播</span></div>
        <div class="lr-tab-item"><i class="far fa-user"></i><span>我的</span></div>
    </nav>

    <div class="lr-sheet-backdrop"></div>
    <div class="lr-sheet above-bottom">
        <div class="lr-sheet-handle"></div>
        <div class="lr-sheet-title-row">
            <h2 class="lr-sheet-title">送礼物</h2>
            <button type="button" class="lr-sheet-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="lr-balance-with-recharge">
            <div class="lr-balance-row">
                <span class="label">可用余额</span>
                <span class="value"><i class="fas fa-coins"></i> 328.50 <small style="font-size:11px;font-weight:600;">C币</small></span>
            </div>
            <button type="button" class="lr-recharge-pill-btn" title="跳转钱包充值"><i class="fas fa-wallet"></i> 充值</button>
        </div>
        <p style="font-size:12px;color:#8e8e93;margin:-6px 0 12px;">礼物按 C币 计价 · 8 款 · 2 行 × 4 列</p>
        <div class="lr-gift-grid">
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=400&q=80&auto=format&fit=crop" alt="玫瑰"></div>
                <span class="cost"><b>1</b> C币</span>
            </div>
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1560439514-4e9645039924?w=300&q=80&auto=format&fit=crop" alt="掌声"></div>
                <span class="cost"><b>2</b> C币</span>
            </div>
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=300&q=80&auto=format&fit=crop" alt="糖果"></div>
                <span class="cost"><b>5</b> C币</span>
            </div>
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=300&q=80&auto=format&fit=crop" alt="荧光"></div>
                <span class="cost"><b>8</b> C币</span>
            </div>
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300&q=80&auto=format&fit=crop" alt="跑车"></div>
                <span class="cost"><b>38</b> C币</span>
            </div>
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1517976487492-5750f3195933?w=300&q=80&auto=format&fit=crop" alt="火箭"></div>
                <span class="cost"><b>88</b> C币</span>
            </div>
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1524413840807-0c3cb6fa808d?w=300&q=80&auto=format&fit=crop" alt="城堡"></div>
                <span class="cost"><b>388</b> C币</span>
            </div>
            <div class="lr-gift-cell">
                <div class="thumb"><img src="https://images.unsplash.com/photo-1573408301185-9146fe634ad0?w=400&q=80&auto=format&fit=crop" alt="皇冠"></div>
                <span class="cost"><b>688</b> C币</span>
            </div>
        </div>
    </div>
</body>
</html>
