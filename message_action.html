<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息操作菜单</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: rgba(0, 0, 0, 0.5);
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .chat-interface {
            flex: 1;
            position: relative;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        
        .message-bubble {
            position: absolute;
            top: 30%;
            left: 20px;
            max-width: 70%;
            padding: 10px 12px;
            background-color: white;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            border-top-left-radius: 0;
            font-size: 16px;
            line-height: 1.4;
            color: #333;
        }
        
        .message-sender {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .action-menu {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        
        .action-item {
            display: flex;
            padding: 15px;
            align-items: center;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .action-item:last-child {
            border-bottom: none;
        }
        
        .action-item:active {
            background-color: #f8f8f8;
        }
        
        .action-icon {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            color: #1890ff;
            font-size: 18px;
        }
        
        .action-icon.danger {
            color: #ff3b30;
        }
        
        .action-text {
            font-size: 16px;
            color: #333;
        }
        
        .action-text.danger {
            color: #ff3b30;
        }
        
        .cancel-button {
            margin: 10px auto;
            width: 80%;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        
        .cancel-button .action-item {
            justify-content: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="chat-interface">
        <div class="message-bubble">
            有关于最新的安全协议，我们需要讨论一下实施方案。
            <div class="message-sender">长按出现此菜单</div>
        </div>
        
        <div class="action-menu">
            <div class="action-item">
                <div class="action-icon">
                    <i class="fas fa-reply"></i>
                </div>
                <div class="action-text">回复</div>
            </div>
            
            <div class="action-item">
                <div class="action-icon">
                    <i class="fas fa-copy"></i>
                </div>
                <div class="action-text">复制</div>
            </div>
            
            <div class="action-item">
                <div class="action-icon">
                    <i class="fas fa-share"></i>
                </div>
                <div class="action-text">转发</div>
            </div>
            
            <div class="action-item">
                <div class="action-icon">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div class="action-text">详情</div>
            </div>
            
            <div class="action-item">
                <div class="action-icon">
                    <i class="fas fa-check-square"></i>
                </div>
                <div class="action-text">多选</div>
            </div>
            
            <div class="action-item">
                <div class="action-icon danger">
                    <i class="fas fa-trash-alt"></i>
                </div>
                <div class="action-text danger">删除</div>
            </div>
        </div>
        
        <div class="cancel-button">
            <div class="action-item">
                <div class="action-text">取消</div>
            </div>
        </div>
    </div>
</body>
</html>
