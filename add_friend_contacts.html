<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机通讯录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .header .title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-right: 28px;
        }
        
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        
        .access-banner {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
        }
        
        .banner-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f0f7ff;
            color: #1890ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-right: 15px;
        }
        
        .banner-text {
            flex: 1;
        }
        
        .banner-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }
        
        .banner-description {
            font-size: 13px;
            color: #999;
        }
        
        .banner-action {
            padding: 6px 15px;
            background-color: #1890ff;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .contacts-list {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .section-header {
            padding: 10px 15px;
            background-color: #f5f5f5;
            font-size: 14px;
            color: #666;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .contact-item:last-child {
            border-bottom: none;
        }
        
        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 12px;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 16px;
        }
        
        .contact-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .contact-info {
            flex: 1;
        }
        
        .contact-name {
            font-size: 16px;
            color: #333;
            margin-bottom: 2px;
        }
        
        .contact-phone {
            font-size: 13px;
            color: #999;
        }
        
        .contact-action {
            padding: 6px 12px;
            background-color: #f0f2f5;
            color: #1890ff;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .contact-action.green {
            background-color: #f6ffed;
            color: #52c41a;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <i class="fas fa-arrow-left back" onclick="window.location.href='add_friend.html'"></i>
        <div class="title">手机通讯录</div>
    </div>
    
    <div class="content">
        <div class="access-banner">
            <div class="banner-icon">
                <i class="fas fa-address-book"></i>
            </div>
            <div class="banner-text">
                <div class="banner-title">通讯录权限</div>
                <div class="banner-description">允许访问通讯录，快速找到您的好友</div>
            </div>
            <div class="banner-action" id="accessBtn">允许</div>
        </div>
        
        <div class="contacts-list" id="contactsList" style="display: none;">
            <div class="section-header">已加入的联系人</div>
            
            <div class="contact-item">
                <div class="contact-avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">张三</div>
                    <div class="contact-phone">138****1234</div>
                </div>
                <div class="contact-action green">已添加</div>
            </div>
            
            <div class="contact-item">
                <div class="contact-avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">李四</div>
                    <div class="contact-phone">139****5678</div>
                </div>
                <div class="contact-action">添加</div>
            </div>
            
            <div class="contact-item">
                <div class="contact-avatar">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">王芳</div>
                    <div class="contact-phone">139****5678</div>
                </div>
                <div class="contact-action green">已添加</div>
            </div>
            
            <div class="section-header">未添加的联系人</div>
            
            <div class="contact-item">
                <div class="contact-avatar">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">李明</div>
                    <div class="contact-phone">139****5678</div>
                </div>
                <div class="contact-action" onclick="window.location.href='add_friend_detail.html'">添加</div>
            </div>
            
            <div class="contact-item">
                <div class="contact-avatar">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">钱伟</div>
                    <div class="contact-phone">159****1234</div>
                </div>
                <div class="contact-action">添加</div>
            </div>
            
            <div class="contact-item">
                <div class="contact-avatar">ZL</div>
                <div class="contact-info">
                    <div class="contact-name">周丽</div>
                    <div class="contact-phone">135****7890</div>
                </div>
                <div class="contact-action">添加</div>
            </div>
            
            <div class="contact-item">
                <div class="contact-avatar">CX</div>
                <div class="contact-info">
                    <div class="contact-name">陈欣</div>
                    <div class="contact-phone">186****3456</div>
                </div>
                <div class="contact-action">添加</div>
            </div>
            
            <div class="contact-item">
                <div class="contact-avatar">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">宋达</div>
                    <div class="contact-phone">176****2345</div>
                </div>
                <div class="contact-action">添加</div>
            </div>
        </div>
    </div>
    

    
    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000);
            
            const accessBtn = document.getElementById('accessBtn');
            const contactsList = document.getElementById('contactsList');
            const bannerEl = document.querySelector('.access-banner');
            
            // 点击允许访问通讯录
            accessBtn.addEventListener('click', function() {
                bannerEl.style.display = 'none';
                contactsList.style.display = 'block';
            });
            
            // 点击添加按钮
            const addButtons = document.querySelectorAll('.contact-action:not(.green)');
            addButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const name = this.parentElement.querySelector('.contact-name').textContent;
                    alert(`已向${name}发送好友申请`);
                    this.textContent = '已邀请';
                    this.style.color = '#999';
                    this.style.backgroundColor = '#f5f5f5';
                });
            });
        });
    </script>
</body>
</html>
