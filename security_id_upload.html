<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份证上传</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back-button {
            font-size: 16px;
            color: #1890ff;
            display: flex;
            align-items: center;
        }
        
        .header .back-button i {
            margin-right: 5px;
        }
        
        .header .title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .page-description {
            margin-bottom: 25px;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .upload-group {
            background-color: white;
            border-radius: 10px;
            margin-bottom: 25px;
            padding: 15px;
        }
        
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
        }
        
        .progress-bar::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 30px;
            right: 30px;
            height: 2px;
            background-color: #e8e8e8;
            z-index: 1;
        }
        
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 30px;
            width: 100%;
            height: 2px;
            background-color: #1890ff;
            z-index: 2;
        }
        
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            position: relative;
        }
        
        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #1890ff;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .step-label {
            font-size: 12px;
            color: #666;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 8px;
            color: #1890ff;
        }
        
        .upload-area {
            margin-bottom: 20px;
        }
        
        .upload-title {
            font-size: 15px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .upload-title i {
            margin-right: 5px;
            color: #1890ff;
        }
        
        .upload-box {
            border: 2px dashed #e8e8e8;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background-color: #fafafa;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            height: 180px;
            overflow: hidden;
        }
        
        .upload-box:hover {
            border-color: #1890ff;
            background-color: #e6f7ff;
        }
        
        .upload-icon {
            font-size: 40px;
            color: #1890ff;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 12px;
        }
        
        .upload-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
            display: none;
        }
        
        .upload-box.has-image .upload-preview {
            display: block;
        }
        
        .upload-box.has-image .upload-icon,
        .upload-box.has-image .upload-text,
        .upload-box.has-image .upload-hint {
            display: none;
        }
        
        .upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .id-example {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        .example-item {
            width: 48%;
            background-color: #fafafa;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }
        
        .example-title {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .example-image {
            width: 100%;
            border-radius: 5px;
            height: 80px;
            object-fit: cover;
        }
        
        .note {
            font-size: 13px;
            color: #ff9800;
            background-color: #fff9e6;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            display: flex;
            align-items: flex-start;
        }
        
        .note i {
            margin-right: 5px;
            margin-top: 2px;
        }
        
        .button-container {
            padding: 20px;
            background-color: white;
            border-top: 1px solid #eaeaea;
        }
        
        .btn-submit {
            width: 100%;
            height: 44px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .btn-submit:disabled {
            background-color: #bae7ff;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <div class="back-button">
            <i class="fas fa-chevron-left"></i>
            返回
        </div>
        <div class="title">身份证上传</div>
        <div style="width: 60px;"></div>
    </div>
    
    <div class="content">
        <div class="progress-bar">
            <div class="progress-step">
                <div class="step-circle">1</div>
                <div class="step-label">选择项目</div>
            </div>
            <div class="progress-step">
                <div class="step-circle">2</div>
                <div class="step-label">安全验证</div>
            </div>
            <div class="progress-step">
                <div class="step-circle">3</div>
                <div class="step-label">更新信息</div>
            </div>
            <div class="progress-step">
                <div class="step-circle">4</div>
                <div class="step-label">身份确认</div>
            </div>
        </div>
        
        <div class="page-description">
            为了确保账户安全，请上传您的身份证正面和反面照片，需与注册时使用的证件一致。
        </div>
        
        <div class="upload-group">
            <div class="section-title">
                <i class="fas fa-id-card"></i>身份证上传
            </div>
            
            <div class="upload-area">
                <div class="upload-title">
                    <i class="fas fa-id-card-alt"></i>身份证正面（人像面）
                </div>
                <div class="upload-box" id="frontIdBox">
                    <div class="upload-icon">
                        <i class="fas fa-camera"></i>
                    </div>
                    <div class="upload-text">点击上传身份证正面照片</div>
                    <div class="upload-hint">请确保照片清晰可见，无遮挡</div>
                    <img src="" class="upload-preview" id="frontIdPreview">
                    <input type="file" id="frontIdInput" accept="image/*" onchange="previewImage(this, 'frontIdBox', 'frontIdPreview')">
                </div>
            </div>
            
            <div class="upload-area">
                <div class="upload-title">
                    <i class="fas fa-id-card"></i>身份证反面（国徽面）
                </div>
                <div class="upload-box" id="backIdBox">
                    <div class="upload-icon">
                        <i class="fas fa-camera"></i>
                    </div>
                    <div class="upload-text">点击上传身份证反面照片</div>
                    <div class="upload-hint">请确保照片清晰可见，无遮挡</div>
                    <img src="" class="upload-preview" id="backIdPreview">
                    <input type="file" id="backIdInput" accept="image/*" onchange="previewImage(this, 'backIdBox', 'backIdPreview')">
                </div>
            </div>
            
            <div class="id-example">
                <div class="example-item">
                    <div class="example-title">身份证正面示例</div>
                    <img src="https://images.unsplash.com/photo-1599934448057-a235e5ab9c1a?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" class="example-image">
                </div>
                <div class="example-item">
                    <div class="example-title">身份证反面示例</div>
                    <img src="https://images.unsplash.com/photo-1599934447679-9072bc1f24f5?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" class="example-image">
                </div>
            </div>
            
            <div class="note">
                <i class="fas fa-exclamation-circle"></i>
                <div>
                    <div>请确保上传的身份证与注册账户时使用的证件一致，否则可能导致验证失败。</div>
                    <div>您的身份信息将被严格保密，仅用于身份验证。</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="button-container">
        <button class="btn-submit" id="submitBtn" disabled>提交</button>
    </div>

    <script>
        function previewImage(input, boxId, previewId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(previewId).src = e.target.result;
                    document.getElementById(boxId).classList.add('has-image');
                    checkSubmitButton();
                }
                reader.readAsDataURL(file);
            }
        }
        
        function checkSubmitButton() {
            const frontId = document.getElementById('frontIdInput').files.length > 0;
            const backId = document.getElementById('backIdInput').files.length > 0;
            
            document.getElementById('submitBtn').disabled = !(frontId && backId);
        }
    </script>
</body>
</html>
