<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iToken设备绑定</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #1d1d1f;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }

        .nav-bar .back {
            color: #007AFF;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-bar .title {
            font-size: 17px;
            font-weight: 600;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-bar .placeholder {
            width: 60px;
        }

        /* 主内容区 */
        .content {
            padding: 20px;
            padding-bottom: 120px;
        }

        /* 顶部图标区域 */
        .hero-section {
            text-align: center;
            padding: 40px 0;
        }

        .token-icon-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            position: relative;
        }

        .token-icon-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.3) 0%, rgba(88, 86, 214, 0.3) 100%);
            animation: pulse 2s ease-in-out infinite;
        }

        .token-icon-bg::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.5) 0%, rgba(88, 86, 214, 0.5) 100%);
        }

        .token-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 122, 255, 0.4);
        }

        .token-icon i {
            font-size: 36px;
            color: #fff;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1d1d1f;
        }

        .hero-subtitle {
            font-size: 15px;
            color: #86868b;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        /* 功能说明卡片 */
        .feature-card {
            background: #f5f5f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .feature-card-title {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e7;
        }

        .feature-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .feature-item:first-child {
            padding-top: 0;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon.security {
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
        }

        .feature-icon.device {
            background: linear-gradient(135deg, #007AFF 0%, #0055D4 100%);
        }

        .feature-icon.protect {
            background: linear-gradient(135deg, #FF9500 0%, #FF6B00 100%);
        }

        .feature-icon i {
            font-size: 18px;
            color: #fff;
        }

        .feature-text h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1d1d1f;
        }

        .feature-text p {
            font-size: 13px;
            color: #86868b;
            line-height: 1.4;
        }

        /* 安全提示 */
        .security-notice {
            background: #fff3e0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border: 1px solid #ffcc80;
        }

        .security-notice i {
            color: #FF9500;
            font-size: 20px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .security-notice-text {
            font-size: 13px;
            color: #1d1d1f;
            line-height: 1.5;
        }

        .security-notice-text strong {
            color: #FF9500;
        }

        /* 协议同意区域 */
        .agreement-section {
            margin-bottom: 20px;
        }

        .agreement-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
        }

        .checkbox-wrapper {
            position: relative;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .checkbox-wrapper input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .checkbox-custom {
            position: absolute;
            top: 0;
            left: 0;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid #c7c7cc;
            background: transparent;
            transition: all 0.2s ease;
        }

        .checkbox-wrapper input:checked + .checkbox-custom {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-color: transparent;
        }

        .checkbox-custom::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 7px;
            width: 5px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .checkbox-wrapper input:checked + .checkbox-custom::after {
            opacity: 1;
        }

        .agreement-text {
            font-size: 14px;
            color: #1d1d1f;
            line-height: 1.5;
        }

        .agreement-text a {
            color: #007AFF;
            text-decoration: none;
        }

        /* 底部按钮区域 */
        .bottom-section {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            padding: 20px;
            padding-bottom: 34px;
            background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.95) 30%);
        }

        .authorize-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
        }

        .authorize-btn:disabled {
            background: #e5e5e7;
            color: #86868b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .authorize-btn:not(:disabled):active {
            transform: scale(0.98);
        }

        .authorize-btn i {
            font-size: 18px;
        }

        /* 流程步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e5e5e7;
        }

        .step-dot.active {
            background: #007AFF;
            width: 24px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- iOS状态栏 -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back">
                <i class="fas fa-chevron-left"></i>
                <span>返回</span>
            </div>
            <div class="title">iToken设备绑定</div>
            <div class="placeholder"></div>
        </div>

        <!-- 主内容 -->
        <div class="content">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
                <div class="step-dot"></div>
            </div>

            <!-- 顶部图标区域 -->
            <div class="hero-section">
                <div class="token-icon-wrapper">
                    <div class="token-icon-bg"></div>
                    <div class="token-icon">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                </div>
                <h1 class="hero-title">启用iToken安全绑定</h1>
                <p class="hero-subtitle">将您的账户与当前设备进行安全绑定，有效防止账号被盗后的资产损失</p>
            </div>

            <!-- 功能说明 -->
            <div class="feature-card">
                <div class="feature-card-title">iToken 将为您提供</div>
                
                <div class="feature-item">
                    <div class="feature-icon security">
                        <i class="fas fa-microchip"></i>
                    </div>
                    <div class="feature-text">
                        <h4>硬件级安全</h4>
                        <p>利用设备安全芯片生成唯一密钥，私钥永不离开设备</p>
                    </div>
                </div>

                <div class="feature-item">
                    <div class="feature-icon device">
                        <i class="fas fa-link"></i>
                    </div>
                    <div class="feature-text">
                        <h4>设备强绑定</h4>
                        <p>账户与设备一对一绑定，其他设备无法操作您的资产</p>
                    </div>
                </div>

                <div class="feature-item">
                    <div class="feature-icon protect">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <div class="feature-text">
                        <h4>资产保护</h4>
                        <p>即使账号密码泄露，攻击者也无法转移您的数字资产</p>
                    </div>
                </div>
            </div>

            <!-- 安全提示 -->
            <div class="security-notice">
                <i class="fas fa-exclamation-triangle"></i>
                <div class="security-notice-text">
                    <strong>重要提示：</strong>绑定后，资产操作将仅限于此设备。如需更换设备，请提前在设置中解除绑定。
                </div>
            </div>

            <!-- 协议同意 -->
            <div class="agreement-section">
                <div class="agreement-item">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="agreement1" checked>
                        <div class="checkbox-custom"></div>
                    </div>
                    <label class="agreement-text" for="agreement1">
                        我已阅读并同意 <a href="#">《iToken服务协议》</a> 和 <a href="#">《设备绑定须知》</a>
                    </label>
                </div>
                <div class="agreement-item">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="agreement2" checked>
                        <div class="checkbox-custom"></div>
                    </div>
                    <label class="agreement-text" for="agreement2">
                        我理解绑定后资产操作将仅限于当前设备
                    </label>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-section">
            <button class="authorize-btn" id="authorizeBtn">
                <i class="fas fa-fingerprint"></i>
                授权并开始绑定
            </button>
        </div>
    </div>

    <script>
        // 检查协议勾选状态
        const agreement1 = document.getElementById('agreement1');
        const agreement2 = document.getElementById('agreement2');
        const authorizeBtn = document.getElementById('authorizeBtn');

        function checkAgreements() {
            authorizeBtn.disabled = !(agreement1.checked && agreement2.checked);
        }

        agreement1.addEventListener('change', checkAgreements);
        agreement2.addEventListener('change', checkAgreements);

        // 初始检查
        checkAgreements();

        // 授权按钮点击
        authorizeBtn.addEventListener('click', function() {
            if (!this.disabled) {
                // 跳转到生成中页面
                window.location.href = 'itoken_generating.html';
            }
        });
    </script>
</body>
</html>
