<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享名片</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .header .title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-right: 28px;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        
        .card-preview {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-avatar {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            overflow: hidden;
            margin-right: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-user-info {
            flex: 1;
        }
        
        .card-username {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .card-id {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }
        
        .card-gender {
            font-size: 12px;
            background-color: #e6f7ff;
            color: #1890ff;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }
        
        .card-gender i {
            margin-right: 3px;
        }
        
        .card-qrcode {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 30px;
            height: 30px;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
        }
        
        .card-info-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        
        .card-info-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 10px;
        }
        
        .card-info-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background-color: #e6f7ff;
            color: #1890ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
        }
        
        .card-info-content {
            flex: 1;
        }
        
        .card-info-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 2px;
        }
        
        .card-info-value {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        
        .card-border-pattern {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #1890ff 25%, transparent 25%, transparent 50%, #1890ff 50%, #1890ff 75%, transparent 75%, transparent);
            background-size: 20px 20px;
        }
        
        .share-channels {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }
        
        .channels-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .channel-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        
        .channel-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-bottom: 8px;
        }
        
        .wechat {
            background-color: #07C160;
        }
        
        .moments {
            background-color: #07C160;
        }
        
        .qq {
            background-color: #12B7F5;
        }
        
        .weibo {
            background-color: #E6162D;
        }
        
        .copylink {
            background-color: #1890ff;
        }
        
        .messages {
            background-color: #5AC8FA;
        }
        
        .email {
            background-color: #34C759;
        }
        
        .more {
            background-color: #FF9500;
        }
        
        .channel-name {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .copy-section {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 10px;
            margin-top: 10px;
        }
        
        .copy-input {
            flex: 1;
            border: none;
            background-color: transparent;
            color: #999;
            font-size: 14px;
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        
        .copy-btn {
            background-color: #1890ff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        
        /* 二维码弹窗样式 */
        .qrcode-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .qrcode-container {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .qrcode-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        
        .qrcode-image {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
        }
        
        .qrcode-image img {
            width: 100%;
            height: 100%;
        }
        
        .qrcode-desc {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .qrcode-close {
            width: 100%;
            padding: 12px 0;
            border: none;
            background-color: #1890ff;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        /* 模拟复制成功提示 */
        .copy-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 2000;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">20:15</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <i class="fas fa-arrow-left back" onclick="window.history.back()"></i>
        <div class="title">我的名片</div>
    </div>
    
    <div class="content">
        <div class="card-preview">
            <div class="card-header">
                <div class="card-avatar">
                    <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?ixlib=rb-1.2.1&auto=format&fit=crop&w=900&q=80" alt="头像">
                </div>
                <div class="card-user-info">
                    <div class="card-username">王小明</div>
                    <div class="card-id">ID: 12345678</div>
                    <div class="card-gender"><i class="fas fa-mars"></i>男</div>
                </div>
            </div>
            
            <div class="card-qrcode" id="showQrcodeBtn">
                <i class="fas fa-qrcode"></i>
            </div>
            
            <div class="card-info-grid">
                <div class="card-info-item">
                    <div class="card-info-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="card-info-content">
                        <div class="card-info-label">手机号</div>
                        <div class="card-info-value">139****5678</div>
                    </div>
                </div>
                
                <div class="card-info-item">
                    <div class="card-info-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="card-info-content">
                        <div class="card-info-label">邮箱</div>
                        <div class="card-info-value">example@mail.com</div>
                    </div>
                </div>
                
                <div class="card-info-item">
                    <div class="card-info-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="card-info-content">
                        <div class="card-info-label">地区</div>
                        <div class="card-info-value">北京市 朝阳区</div>
                    </div>
                </div>
            </div>
            
            <div class="card-border-pattern"></div>
        </div>
        
        <div class="share-channels">
            <div class="channels-title">选择分享方式</div>
            
            <div class="channel-grid">
                <div class="channel-item">
                    <div class="channel-icon wechat">
                        <i class="fab fa-weixin"></i>
                    </div>
                    <div class="channel-name">微信好友</div>
                </div>
                
                <div class="channel-item">
                    <div class="channel-icon moments">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="channel-name">朋友圈</div>
                </div>
                
                <div class="channel-item">
                    <div class="channel-icon qq">
                        <i class="fab fa-qq"></i>
                    </div>
                    <div class="channel-name">QQ好友</div>
                </div>
                
                <div class="channel-item">
                    <div class="channel-icon weibo">
                        <i class="fab fa-weibo"></i>
                    </div>
                    <div class="channel-name">微博</div>
                </div>
                
                <div class="channel-item" id="copyLinkItem">
                    <div class="channel-icon copylink">
                        <i class="fas fa-link"></i>
                    </div>
                    <div class="channel-name">复制链接</div>
                </div>
                
                <div class="channel-item">
                    <div class="channel-icon messages">
                        <i class="fas fa-comment-alt"></i>
                    </div>
                    <div class="channel-name">短信</div>
                </div>
                
                <div class="channel-item">
                    <div class="channel-icon email">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="channel-name">邮件</div>
                </div>
                
                <div class="channel-item">
                    <div class="channel-icon more">
                        <i class="fas fa-ellipsis-h"></i>
                    </div>
                    <div class="channel-name">更多</div>
                </div>
            </div>
            
            <div class="copy-section">
                <input type="text" class="copy-input" value="https://chat.example.com/contact/12345678" readonly id="shareLink">
                <button class="copy-btn" id="copyBtn">复制</button>
            </div>
        </div>
    </div>
    
    <div class="tab-bar">
        <div class="tab">
            <i class="fas fa-comment"></i>
            <span>消息</span>
        </div>
        <div class="tab active">
            <i class="fas fa-address-book"></i>
            <span>通讯录</span>
        </div>
        <div class="tab">
            <i class="fas fa-phone-alt"></i>
            <span>通话</span>
        </div>
        <div class="tab">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>
    
    <!-- 二维码弹窗 -->
    <div class="qrcode-modal" id="qrcodeModal">
        <div class="qrcode-container">
            <div class="qrcode-title">我的二维码名片</div>
            <div class="qrcode-image">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://chat.example.com/contact/12345678" alt="二维码">
            </div>
            <div class="qrcode-desc">扫描上方二维码，添加我为好友</div>
            <button class="qrcode-close" id="closeQrcodeBtn">关闭</button>
        </div>
    </div>
    
    <!-- 复制成功提示 -->
    <div class="copy-toast" id="copyToast">复制成功</div>
    
    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000);
            
            const qrcodeModal = document.getElementById('qrcodeModal');
            const showQrcodeBtn = document.getElementById('showQrcodeBtn');
            const closeQrcodeBtn = document.getElementById('closeQrcodeBtn');
            const copyBtn = document.getElementById('copyBtn');
            const copyLinkItem = document.getElementById('copyLinkItem');
            const shareLink = document.getElementById('shareLink');
            const copyToast = document.getElementById('copyToast');
            
            // 显示二维码
            showQrcodeBtn.addEventListener('click', function() {
                qrcodeModal.style.display = 'flex';
            });
            
            // 关闭二维码
            closeQrcodeBtn.addEventListener('click', function() {
                qrcodeModal.style.display = 'none';
            });
            
            // 点击空白处关闭弹窗
            qrcodeModal.addEventListener('click', function(e) {
                if (e.target === qrcodeModal) {
                    qrcodeModal.style.display = 'none';
                }
            });
            
            // 复制链接功能
            function copyLink() {
                shareLink.select();
                document.execCommand('copy');
                
                // 显示复制成功提示
                copyToast.style.display = 'block';
                setTimeout(function() {
                    copyToast.style.display = 'none';
                }, 1500);
            }
            
            copyBtn.addEventListener('click', copyLink);
            copyLinkItem.addEventListener('click', copyLink);
            
            // 社交媒体分享按钮
            const channelItems = document.querySelectorAll('.channel-item');
            channelItems.forEach(item => {
                if (item !== copyLinkItem) {
                    item.addEventListener('click', function() {
                        const channelName = this.querySelector('.channel-name').textContent;
                        alert(`分享到${channelName}功能将在应用中实现`);
                    });
                }
            });
        });
    </script>
</body>
</html>
