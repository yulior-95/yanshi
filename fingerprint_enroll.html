<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>录入指纹</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="time">12:30</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>
        
        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back"><i class="fas fa-chevron-left"></i> 返回</div>
            <div class="title">添加指纹</div>
            <div></div>
        </div>
        
        <!-- 内容区 -->
        <div class="content">
            <div class="fingerprint-container">
                <h2 class="fingerprint-title">录入指纹</h2>
                <p class="fingerprint-desc">反复将手指放在指纹传感器上，抬起后再次放下</p>
                
                <div class="fingerprint-enroll-steps">
                    <div class="step active"></div>
                    <div class="step active"></div>
                    <div class="step"></div>
                    <div class="step"></div>
                    <div class="step"></div>
                </div>
                
                <div class="fingerprint-animation">
                    <i class="fas fa-fingerprint"></i>
                </div>
                
                <p class="fingerprint-desc">已完成40%，请继续...</p>
            </div>
            
            <div class="card" style="margin-top: 40px;">
                <h3 style="margin-bottom: 16px;">指纹用途设置</h3>
                <div class="list-item">
                    <div class="title">安全验证</div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="list-item">
                    <div class="title">支付验证</div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="list-item">
                    <div class="title">登录验证</div>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- 底部标签栏 -->
        <div class="tab-bar">
            <div class="tab-item">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="tab-item">
                <i class="fas fa-compass"></i>
                <span>发现</span>
            </div>
            <div class="tab-item">
                <i class="fas fa-bell"></i>
                <span>通知</span>
            </div>
            <div class="tab-item active">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
