<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直播播放页 · 打赏入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="live_reward_proto.css">
</head>
<body class="lr-proto lr-live-room">
    <header class="lr-status-bar lr-status-light">
        <span class="lr-sb-time">9:41</span>
        <span class="lr-dynamic-island" aria-hidden="true"></span>
        <div class="lr-sb-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </header>

    <div class="lr-nav-header">
        <button type="button" class="lr-nav-back" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
        <div class="lr-nav-avatar">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=160&q=80&auto=format&fit=crop" alt="">
        </div>
        <div class="lr-nav-meta">
            <div class="lr-nav-title">68测试群-0...(43)</div>
            <div class="lr-nav-sub">刚刚在线</div>
        </div>
    </div>

    <div class="lr-scroll-stack">
        <div class="lr-half-player">
            <img class="lr-video-img" src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=900&q=85&auto=format&fit=crop" alt="赛事直播画面">
            <button type="button" class="lr-pp-chevron" aria-label="收起播放器"><i class="fas fa-chevron-down"></i></button>
            <button type="button" class="lr-pp-mute" aria-label="静音"><i class="fas fa-volume-xmark"></i></button>
            <div class="lr-pp-pause" aria-hidden="true"><i class="fas fa-pause"></i></div>
            <div class="lr-pp-live"><span class="dot"></span>正在直播</div>
            <div class="lr-pp-score">ITA 0 11 · 13 0 POL</div>
            <button type="button" class="lr-pp-fs" aria-label="全屏"><i class="fas fa-expand"></i></button>
            <button type="button" class="lr-reward-fab" title="打赏">
                <i class="fas fa-gift"></i>
                <span class="lr-fab-label">打赏</span>
            </button>
        </div>

        <div class="lr-chat-feed">
            <div class="lr-msg incoming">
                <div class="lr-msg-avatar"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&q=80&auto=format&fit=crop" alt=""></div>
                <div class="lr-msg-body">
                    <div class="lr-msg-name">小雅</div>
                    <div class="lr-bubble">单行逻辑 😊<span class="lr-msg-time">17:11</span></div>
                </div>
            </div>
            <div class="lr-msg outgoing">
                <div class="lr-msg-body">
                    <div class="lr-bubble">多行最大宽度约束示意<span class="lr-msg-time">17:11</span></div>
                </div>
            </div>
            <div class="lr-msg incoming">
                <div class="lr-msg-avatar"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&q=80&auto=format&fit=crop" alt=""></div>
                <div class="lr-msg-body">
                    <div class="lr-msg-name">Ken</div>
                    <div class="lr-bubble">这波防守漂亮 🔥<span class="lr-msg-time">17:12</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="lr-composer">
        <div class="lr-composer-inner">
            <button type="button" class="lr-comp-plus"><i class="fas fa-plus"></i></button>
            <div class="lr-comp-field">
                <span class="at">@</span>
                <input type="text" placeholder="" aria-label="输入消息">
            </div>
            <button type="button" class="lr-comp-emoji" aria-label="表情"><i class="far fa-face-smile"></i></button>
            <button type="button" class="lr-comp-send" aria-label="发送"><i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <nav class="lr-tab-bar-app" aria-label="主导航">
        <div class="lr-tab-item"><i class="far fa-comment-dots"></i><span>消息</span></div>
        <div class="lr-tab-item"><i class="far fa-address-book"></i><span>通讯录</span></div>
        <div class="lr-tab-item active"><i class="fas fa-tower-broadcast"></i><span>直播</span></div>
        <div class="lr-tab-item"><i class="far fa-user"></i><span>我的</span></div>
    </nav>
</body>
</html>
