<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
        }
        
        .header .title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .profile-container {
            flex: 1;
            overflow-y: auto;
        }
        
        .profile-header {
            background-color: white;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            overflow: hidden;
            margin-right: 15px;
            border: 1px solid #eaeaea;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-info {
            flex: 1;
        }
        
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .profile-id {
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: center;
        }
        
        .profile-id span {
            margin-right: 5px;
        }
        
        .copy-icon {
            font-size: 14px;
            color: #999;
        }
        
        .profile-qrcode {
            font-size: 22px;
            color: #999;
        }
        
        .profile-actions {
            font-size: 16px;
            color: #666;
        }
        
        .menu-group {
            background-color: white;
            margin-bottom: 10px;
        }
        
        .menu-item {
            display: flex;
            padding: 16px 15px;
            align-items: center;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-icon {
            width: 24px;
            text-align: center;
            margin-right: 10px;
            font-size: 18px;
        }
        
        .menu-label {
            flex: 1;
            font-size: 16px;
            color: #333;
        }
        
        .menu-action {
            color: #999;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        
        .menu-action i {
            margin-left: 5px;
        }
        
        .security-icon {
            color: #1890ff;
        }
        
        .notification-icon {
            color: #ff9800;
        }
        
        .privacy-icon {
            color: #34c759;
        }
        
        .general-icon {
            color: #9c27b0;
        }
        
        .help-icon {
            color: #607d8b;
        }
        
        .about-icon {
            color: #795548;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <div class="title">我的</div>
    </div>
    
    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar">
                <img src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
            </div>
            <div class="profile-info">
                <div class="profile-name">Alex Zhang</div>
                <div class="profile-id">
                    <span>ID: 12345678</span>
                    <i class="far fa-copy copy-icon"></i>
                </div>
            </div>
            <div class="profile-qrcode">
                <i class="fas fa-qrcode"></i>
            </div>
            <div class="profile-actions">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
        
        <div class="menu-group">
            <div class="menu-item">
                <div class="menu-icon notification-icon">
                    <i class="fas fa-bell"></i>
                </div>
                <div class="menu-label">通知设置</div>
                <div class="menu-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <div class="menu-item">
                <div class="menu-icon security-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="menu-label">安全</div>
                <div class="menu-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <div class="menu-item">
                <div class="menu-icon privacy-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="menu-label">隐私</div>
                <div class="menu-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
        
        <div class="menu-group">
            <div class="menu-item">
                <div class="menu-icon general-icon">
                    <i class="fas fa-cog"></i>
                </div>
                <div class="menu-label">聊天设置</div>
                <div class="menu-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <div class="menu-item">
                <div class="menu-icon">
                    <i class="fas fa-database" style="color: #ff9800;"></i>
                </div>
                <div class="menu-label">数据与存储</div>
                <div class="menu-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
        
        <div class="menu-group">
            <div class="menu-item">
                <div class="menu-icon help-icon">
                    <i class="fas fa-question-circle"></i>
                </div>
                <div class="menu-label">帮助与反馈</div>
                <div class="menu-action">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <div class="menu-item">
                <div class="menu-icon about-icon">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div class="menu-label">关于</div>
                <div class="menu-action">
                    <span>V1.0.0</span>
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="tab-bar">
        <div class="tab">
            <i class="fas fa-comment"></i>
            <span>消息</span>
        </div>
        <div class="tab">
            <i class="fas fa-address-book"></i>
            <span>通讯录</span>
        </div>
        <div class="tab">
            <i class="fas fa-phone-alt"></i>
            <span>通话</span>
        </div>
        <div class="tab active">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>
</body>
</html>
