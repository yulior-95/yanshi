<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恢复成功</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #1d1d1f;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            position: relative;
        }

        .nav-bar .title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
        }

        /* 主内容区 */
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 180px;
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
            width: 100%;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            background: #34C759;
            color: #fff;
        }

        .step-label {
            font-size: 13px;
            color: #34C759;
        }

        .step-line {
            width: 40px;
            height: 2px;
            background: #34C759;
        }

        /* 成功动画 */
        .success-animation {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 30px;
        }

        .success-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.15) 0%, rgba(48, 179, 80, 0.15) 100%);
            animation: success-pulse 2s ease-in-out infinite;
        }

        @keyframes success-pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .success-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(52, 199, 89, 0.3);
        }

        .success-icon i {
            font-size: 36px;
            color: #fff;
        }

        /* 状态文字 */
        .status-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .status-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #34C759;
        }

        .status-subtitle {
            font-size: 15px;
            color: #86868b;
            line-height: 1.5;
            max-width: 280px;
            margin: 0 auto;
        }

        /* 恢复信息卡片 */
        .restore-info {
            width: 100%;
            background: #e8f8ed;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #a7f3c9;
        }

        .restore-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .restore-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .restore-icon i {
            font-size: 20px;
            color: #fff;
        }

        .restore-title {
            font-size: 16px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .restore-subtitle {
            font-size: 13px;
            color: #86868b;
        }

        .restore-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #fff;
            border-radius: 10px;
        }

        .restore-status i {
            color: #34C759;
            font-size: 14px;
        }

        .restore-status span {
            font-size: 13px;
            color: #34C759;
            font-weight: 500;
        }

        /* 更新详情 */
        .update-details {
            width: 100%;
            background: #f5f5f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .update-title {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .update-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e7;
        }

        .update-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .update-item:first-child {
            padding-top: 0;
        }

        .update-label {
            font-size: 14px;
            color: #86868b;
        }

        .update-value {
            font-size: 14px;
            color: #1d1d1f;
            font-weight: 500;
        }

        .update-value.success {
            color: #34C759;
        }

        /* 功能恢复列表 */
        .features-restored {
            width: 100%;
            background: #f5f5f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .features-title {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .features-title i {
            color: #34C759;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }

        .feature-item i {
            color: #34C759;
            font-size: 14px;
        }

        .feature-item span {
            font-size: 14px;
            color: #1d1d1f;
        }

        /* 底部按钮区域 */
        .bottom-section {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            padding: 20px;
            padding-bottom: 34px;
            background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.95) 30%);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .primary-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.3);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .secondary-btn:active {
            transform: scale(0.98);
            background: #e5e5e7;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- iOS状态栏 -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="title">恢复完成</div>
        </div>

        <!-- 主内容 -->
        <div class="content">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step">
                    <div class="step-num"><i class="fas fa-check" style="font-size: 12px;"></i></div>
                    <span class="step-label">验证身份</span>
                </div>
                <div class="step-line"></div>
                <div class="step">
                    <div class="step-num"><i class="fas fa-check" style="font-size: 12px;"></i></div>
                    <span class="step-label">确认生物识别</span>
                </div>
                <div class="step-line"></div>
                <div class="step">
                    <div class="step-num"><i class="fas fa-check" style="font-size: 12px;"></i></div>
                    <span class="step-label">恢复完成</span>
                </div>
            </div>

            <!-- 成功动画 -->
            <div class="success-animation">
                <div class="success-ring"></div>
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
            </div>

            <!-- 状态文字 -->
            <div class="status-section">
                <h1 class="status-title">iToken已恢复</h1>
                <p class="status-subtitle">您的iToken功能已成功恢复，所有敏感操作权限已重新启用</p>
            </div>

            <!-- 恢复信息卡片 -->
            <div class="restore-info">
                <div class="restore-header">
                    <div class="restore-icon">
                        <i class="fas fa-shield-check"></i>
                    </div>
                    <div>
                        <div class="restore-title">生物识别已更新</div>
                        <div class="restore-subtitle">iToken已与新的指纹信息绑定</div>
                    </div>
                </div>
                <div class="restore-status">
                    <i class="fas fa-check-circle"></i>
                    <span>设备保护已重新激活</span>
                </div>
            </div>

            <!-- 更新详情 -->
            <div class="update-details">
                <div class="update-title">更新详情</div>
                
                <div class="update-item">
                    <span class="update-label">更新时间</span>
                    <span class="update-value">2026-01-15 09:45:18</span>
                </div>

                <div class="update-item">
                    <span class="update-label">iToken状态</span>
                    <span class="update-value success">正常</span>
                </div>

                <div class="update-item">
                    <span class="update-label">生物识别</span>
                    <span class="update-value success">已绑定</span>
                </div>
            </div>

            <!-- 功能恢复列表 -->
            <div class="features-restored">
                <div class="features-title">
                    <i class="fas fa-unlock"></i>
                    已恢复的功能
                </div>
                <div class="feature-item">
                    <i class="fas fa-check-circle"></i>
                    <span>资产转账</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check-circle"></i>
                    <span>提现操作</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check-circle"></i>
                    <span>安全设置修改</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-check-circle"></i>
                    <span>设备管理</span>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-section">
            <div class="btn-group">
                <button class="primary-btn" onclick="window.location.href='message.html'">
                    <i class="fas fa-home"></i>
                    返回首页
                </button>
                <button class="secondary-btn" onclick="window.location.href='security_settings.html'">
                    <i class="fas fa-cog"></i>
                    查看安全设置
                </button>
            </div>
        </div>
    </div>
</body>
</html>
