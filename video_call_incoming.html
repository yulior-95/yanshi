<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频来电</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }
        
        .status-bar {
            height: 44px;
            background-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
            z-index: 10;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .call-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            filter: blur(8px);
        }
        
        .call-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px;
            position: relative;
        }
        
        .caller-info {
            text-align: center;
            z-index: 2;
        }
        
        .call-type {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            overflow: hidden;
            margin: 0 auto 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .caller-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .caller-number {
            font-size: 16px;
            opacity: 0.8;
        }
        
        .call-status {
            font-size: 20px;
            font-weight: 600;
            margin-top: 40px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }
        
        .call-actions {
            display: flex;
            width: 100%;
            justify-content: space-around;
            margin-bottom: 30px;
            z-index: 2;
        }
        
        .call-action {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .action-button {
            width: 64px;
            height: 64px;
            border-radius: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .action-button.answer {
            background-color: #34c759;
        }
        
        .action-button.decline {
            background-color: #ff3b30;
        }
        
        .action-button.audio-only {
            background-color: #1890ff;
        }
        
        .action-label {
            font-size: 14px;
        }
        
        .call-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 2;
        }
        
        .call-option {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .option-button {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        .option-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .encryption-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 4px 10px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .encryption-badge i {
            margin-right: 5px;
            color: #34c759;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="call-background"></div>
    
    <div class="call-container">
        <div class="caller-info">
            <div class="call-type">视频来电</div>
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="caller-name">张三</div>
            <div class="caller-number">加密聊天用户</div>
            <div class="encryption-badge">
                <i class="fas fa-lock"></i>
                <span>端对端加密</span>
            </div>
            <div class="call-status">视频通话邀请...</div>
        </div>
        
        <div>
            <div class="call-options">
                <div class="call-option">
                    <div class="option-button">
                        <i class="fas fa-volume-up"></i>
                    </div>
                    <div class="option-label">扬声器</div>
                </div>
                
                <div class="call-option">
                    <div class="option-button">
                        <i class="fas fa-video-slash"></i>
                    </div>
                    <div class="option-label">关闭摄像头</div>
                </div>
            </div>
            
            <div class="call-actions">
                <div class="call-action">
                    <div class="action-button decline">                 
                               <i class="fas fa-phone-slash"></i>
                    </div>
                    <div class="action-label">拒绝</div>
                </div>
                
                <div class="call-action">
                    <div class="action-button audio-only">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <div class="action-label">语音接听</div>
                </div>
                
                <div class="call-action">
                    <div class="action-button answer">
                        <i class="fas fa-video"></i>
                    </div>
                    <div class="action-label">视频接听</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
