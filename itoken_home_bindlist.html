<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iToken - 已绑定账号</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #fff;
        }

        /* 小程序顶部栏 */
        .mini-program-header {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            padding: 0 16px 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .close-btn i {
            color: #fff;
            font-size: 14px;
        }

        .header-title {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-btn i {
            color: #fff;
            font-size: 14px;
        }

        /* iToken 状态卡片 */
        .itoken-status-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px 20px;
            margin-top: 10px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            background: rgba(52, 199, 89, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-icon i {
            font-size: 18px;
            color: #30D158;
        }

        .status-info h3 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .status-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .account-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }

        /* 主内容区 */
        .content {
            padding: 20px;
            padding-bottom: 100px;
        }

        /* 区块标题 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .add-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: #007AFF;
            cursor: pointer;
        }

        .add-btn i {
            font-size: 12px;
        }

        /* 账号卡片列表 */
        .account-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 账号卡片 */
        .account-card {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .account-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .account-card.green {
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
        }

        .account-card.orange {
            background: linear-gradient(135deg, #FF9500 0%, #FF6B00 100%);
        }

        .account-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .account-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-avatar {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .account-avatar i {
            color: #fff;
            font-size: 18px;
        }

        .account-detail .account-name {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .account-detail .account-type {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        .account-menu {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .account-menu i {
            color: #fff;
            font-size: 14px;
        }

        /* 验证码区域 */
        .token-section {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 16px;
        }

        .token-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .token-label i {
            font-size: 10px;
        }

        .token-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .token-code {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 4px;
            font-family: 'SF Mono', 'Menlo', monospace;
        }

        .copy-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        .copy-btn i {
            color: #fff;
            font-size: 16px;
        }

        .token-timer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .timer-bar {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .timer-progress {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            transition: width 1s linear;
        }

        .timer-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            min-width: 60px;
            text-align: right;
        }

        /* 安全统计 */
        .security-stats {
            background: #f5f5f7;
            border-radius: 16px;
            padding: 20px;
            margin-top: 24px;
        }

        .stats-title {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #86868b;
        }

        /* 复制成功提示 */
        .copy-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .copy-toast i {
            color: #34C759;
            font-size: 20px;
        }

        /* 底部安全栏 */
        .bottom-safe-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            padding: 12px 20px;
            padding-bottom: 34px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .safe-bar-icon {
            color: #34C759;
            font-size: 14px;
        }

        .safe-bar-text {
            font-size: 13px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- iOS状态栏 -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 小程序顶部栏 -->
        <div class="mini-program-header">
            <div class="header-top">
                <div class="header-left">
                    <div class="close-btn">
                        <i class="fas fa-times"></i>
                    </div>
                    <span class="header-title">iToken</span>
                </div>
                <div class="header-right">
                    <div class="header-btn">
                        <i class="fas fa-cog"></i>
                    </div>
                </div>
            </div>

            <!-- iToken 状态 -->
            <div class="itoken-status-card">
                <div class="status-left">
                    <div class="status-icon">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <div class="status-info">
                        <h3>iToken 已激活</h3>
                        <p>硬件级安全保护</p>
                    </div>
                </div>
                <div class="account-count">
                    <i class="fas fa-user"></i> 2 个账号
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="content">
            <!-- 已绑定账号列表 -->
            <div class="section-header">
                <span class="section-title">已绑定账号</span>
                <div class="add-btn" id="addBtn">
                    <i class="fas fa-plus"></i>
                    <span>添加</span>
                </div>
            </div>

            <div class="account-list">
                <!-- 账号1 -->
                <div class="account-card">
                    <div class="account-header">
                        <div class="account-info">
                            <div class="account-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="account-detail">
                                <div class="account-name">68****8888</div>
                                <div class="account-type">68号登录</div>
                            </div>
                        </div>
                        <div class="account-menu">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>
                    </div>
                    <div class="token-section">
                        <div class="token-label">
                            <i class="fas fa-shield-halved"></i>
                            iToken 验证码
                        </div>
                        <div class="token-display">
                            <div class="token-code" id="tokenCode1">847 291</div>
                            <div class="copy-btn" data-code="tokenCode1">
                                <i class="fas fa-copy"></i>
                            </div>
                        </div>
                        <div class="token-timer">
                            <div class="timer-bar">
                                <div class="timer-progress" id="timerProgress1" style="width: 70%;"></div>
                            </div>
                            <span class="timer-text" id="timerText1">21秒后刷新</span>
                        </div>
                    </div>
                </div>

                <!-- 账号2 -->
                <div class="account-card green">
                    <div class="account-header">
                        <div class="account-info">
                            <div class="account-avatar">
                                <i class="fas fa-mobile-alt"></i>
                            </div>
                            <div class="account-detail">
                                <div class="account-name">138****6666</div>
                                <div class="account-type">手机号登录</div>
                            </div>
                        </div>
                        <div class="account-menu">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>
                    </div>
                    <div class="token-section">
                        <div class="token-label">
                            <i class="fas fa-shield-halved"></i>
                            iToken 验证码
                        </div>
                        <div class="token-display">
                            <div class="token-code" id="tokenCode2">523 847</div>
                            <div class="copy-btn" data-code="tokenCode2">
                                <i class="fas fa-copy"></i>
                            </div>
                        </div>
                        <div class="token-timer">
                            <div class="timer-bar">
                                <div class="timer-progress" id="timerProgress2" style="width: 45%;"></div>
                            </div>
                            <span class="timer-text" id="timerText2">14秒后刷新</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 安全统计 -->
            <div class="security-stats">
                <div class="stats-title">安全统计</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value">2</div>
                        <div class="stat-label">绑定账号</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">156</div>
                        <div class="stat-label">验证次数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0</div>
                        <div class="stat-label">异常拦截</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 复制成功提示 -->
        <div class="copy-toast" id="copyToast">
            <i class="fas fa-check-circle"></i>
            验证码已复制
        </div>

        <!-- 底部安全栏 -->
        <div class="bottom-safe-bar">
            <i class="fas fa-lock safe-bar-icon"></i>
            <span class="safe-bar-text">iToken 由设备安全芯片提供保护</span>
        </div>
    </div>

    <script>
        // 验证码数据
        const tokens = {
            1: { timeLeft: 21, code: '847 291' },
            2: { timeLeft: 14, code: '523 847' }
        };

        function generateCode() {
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            return code.slice(0, 3) + ' ' + code.slice(3);
        }

        // 更新倒计时
        function updateTimers() {
            Object.keys(tokens).forEach(id => {
                tokens[id].timeLeft--;
                if (tokens[id].timeLeft <= 0) {
                    tokens[id].timeLeft = 30;
                    tokens[id].code = generateCode();
                    document.getElementById('tokenCode' + id).textContent = tokens[id].code;
                }
                document.getElementById('timerProgress' + id).style.width = (tokens[id].timeLeft / 30 * 100) + '%';
                document.getElementById('timerText' + id).textContent = tokens[id].timeLeft + '秒后刷新';
            });
        }

        setInterval(updateTimers, 1000);

        // 复制功能
        const copyBtns = document.querySelectorAll('.copy-btn');
        const copyToast = document.getElementById('copyToast');

        copyBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const codeId = this.dataset.code;
                const code = document.getElementById(codeId).textContent.replace(' ', '');
                navigator.clipboard.writeText(code).then(function() {
                    copyToast.classList.add('show');
                    setTimeout(function() {
                        copyToast.classList.remove('show');
                    }, 2000);
                });
            });
        });

        // 添加账号
        document.getElementById('addBtn').addEventListener('click', function() {
            window.location.href = 'itoken_add_account.html';
        });

        // 关闭按钮
        document.querySelector('.close-btn').addEventListener('click', function() {
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
