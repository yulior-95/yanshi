<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直播中</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: rgba(0, 0, 0, 0.4);
            min-height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        
        /* 直播窗口 */
        .live-container {
            width: 100%;
            background-color: #000;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            max-height: 50vh;
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        
        /* 直播头部 */
        .live-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .live-title-container {
            flex: 1;
            display: flex;
            align-items: center;
        }
        
        .live-status {
            display: flex;
            align-items: center;
            margin-right: 12px;
        }
        
        .live-indicator {
            width: 8px;
            height: 8px;
            background-color: #ff4d4f;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: scale(0.8);
                opacity: 1;
            }
        }
        
        .live-status-text {
            font-size: 14px;
            color: #ff4d4f;
            font-weight: 600;
        }
        
        .live-title {
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            flex: 1;
        }
        
        .live-duration {
            font-size: 14px;
            color: #999;
            margin-right: 12px;
        }
        
        .live-close {
            font-size: 20px;
            color: #999;
            cursor: pointer;
        }
        
        /* 直播内容区域 */
        .live-content {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }
        
        .live-placeholder {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        .live-placeholder i {
            font-size: 48px;
            margin-bottom: 12px;
            color: #333;
        }
        
        /* 控制按钮 */
        .live-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .control-btn i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        
        .control-btn span {
            font-size: 12px;
        }
        
        /* 结束直播按钮 */
        .end-live-btn {
            width: 100%;
            height: 48px;
            background-color: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 77, 79, 0.3);
            transition: all 0.3s ease;
        }
        
        .end-live-btn:hover {
            background-color: #ff7875;
        }
        
        /* 积分信息 */
        .points-status {
            position: absolute;
            top: 16px;
            right: 16px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: #fff;
            display: flex;
            align-items: center;
        }
        
        .points-status i {
            margin-right: 6px;
            color: #faad14;
        }
    </style>
</head>
<body>
    <div class="live-container">
        <!-- 积分状态 -->
        <div class="points-status">
            <i class="fas fa-coins"></i>
            <span>剩余积分：500</span>
        </div>
        
        <!-- 直播头部 -->
        <div class="live-header">
            <div class="live-title-container">
                <div class="live-status">
                    <div class="live-indicator"></div>
                    <div class="live-status-text">直播中</div>
                </div>
                <div class="live-title">加密游戏技巧分享</div>
            </div>
            <div class="live-duration">00:05:32</div>
            <div class="live-close" onclick="window.history.back()">
                <i class="fas fa-times"></i>
            </div>
        </div>
        
        <!-- 直播内容区域 -->
        <div class="live-content">
            <div class="live-placeholder">
                <i class="fas fa-video"></i>
                <div>直播画面将显示在这里</div>
                <div style="margin-top: 8px; font-size: 12px;">观众人数：128</div>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="live-controls">
            <div class="control-btn" title="切换悬浮屏">
                <i class="fas fa-window-maximize"></i>
                <span>悬浮屏</span>
            </div>
            <div class="control-btn" title="切换横屏">
                <i class="fas fa-sync-alt"></i>
                <span>横屏</span>
            </div>
            <div class="control-btn" title="分享直播">
                <i class="fas fa-share-alt"></i>
                <span>分享</span>
            </div>
            <div class="control-btn" title="修改直播名字">
                <i class="fas fa-edit"></i>
                <span>改名</span>
            </div>
            <div class="control-btn" title="暂时离开">
                <i class="fas fa-sign-out-alt"></i>
                <span>离开</span>
            </div>
        </div>
        
        <!-- 结束直播按钮 -->
        <button class="end-live-btn" onclick="window.location.href='live_streaming_end.html'">
            结束直播
        </button>
    </div>
    
    <script>
        // 控制按钮功能
        document.querySelectorAll('.control-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const action = this.querySelector('span').textContent;
                switch(action) {
                    case '悬浮屏':
                        alert('已切换到悬浮屏模式');
                        break;
                    case '横屏':
                        alert('已切换到横屏模式');
                        break;
                    case '分享':
                        alert('直播链接已复制到剪贴板');
                        break;
                    case '改名':
                        const newTitle = prompt('请输入新的直播标题：', '加密游戏技巧分享');
                        if (newTitle) {
                            document.querySelector('.live-title').textContent = newTitle;
                        }
                        break;
                    case '离开':
                        if (confirm('确定要暂时离开直播吗？')) {
                            alert('您已暂时离开直播，聊天页面会有进入直播的入口');
                        }
                        break;
                }
            });
        });
        
        // 模拟直播时长
        let seconds = 332; // 5分32秒
        setInterval(() => {
            seconds++;
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.querySelector('.live-duration').textContent = timeString;
        }, 1000);
    </script>
</body>
</html>
