<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建群聊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .header .title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-right: 28px;
        }
        
        .header .action {
            font-size: 16px;
            color: #1890ff;
            cursor: pointer;
        }
        
        .header .action.disabled {
            color: #bfbfbf;
            pointer-events: none;
        }
        
        .search-bar {
            padding: 10px 15px;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
        }
        
        .search-input {
            background-color: #f0f2f5;
            border-radius: 10px;
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }
        
        .search-input i {
            color: #999;
            margin-right: 8px;
        }
        
        .search-input input {
            border: none;
            background: transparent;
            flex: 1;
            outline: none;
            font-size: 14px;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
        }
        
        .selected-section {
            background-color: white;
            padding: 15px;
            border-bottom: 1px solid #eaeaea;
        }
        
        .selected-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
        }
        
        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .selected-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            position: relative;
        }
        
        .selected-avatar {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .selected-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .selected-name {
            font-size: 12px;
            color: #333;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .selected-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background-color: #f5222d;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
        }
        
        .contact-list {
            background-color: white;
        }
        
        .section-header {
            padding: 10px 15px;
            background-color: #f5f5f5;
            font-size: 14px;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        
        .contact-item {
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f2f5;
            align-items: center;
        }
        
        .contact-item:active {
            background-color: #f9f9f9;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            overflow: hidden;
            margin-right: 12px;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .contact-info {
            flex: 1;
        }
        
        .contact-name {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid #d9d9d9;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
        }
        
        .checkbox.checked {
            background-color: #1890ff;
            border-color: #1890ff;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        
        .index-bar {
            position: fixed;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            font-size: 12px;
            color: #1890ff;
        }
        
        .index-bar div {
            padding: 2px 4px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <i class="fas fa-arrow-left back" onclick="window.history.back()"></i>
        <div class="title">创建群聊</div>
        <div class="action disabled" id="nextBtn">下一步</div>
    </div>
    
    <div class="search-bar">
        <div class="search-input">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索">
        </div>
    </div>
    
    <div class="content">
        <div class="selected-section">
            <div class="selected-title">已选择联系人: <span id="selectedCount">0</span>/20</div>
            <div class="selected-list" id="selectedList">
                <!-- 已选择的联系人将在这里显示 -->
            </div>
        </div>
        
        <div class="contact-list">
            <div class="section-header">A</div>
            <div class="contact-item">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">阿强</div>
                </div>
                <div class="checkbox" data-name="阿强" data-avatar="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80"></div>
            </div>
            
            <div class="section-header">L</div>
            <div class="contact-item">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">李明</div>
                </div>
                <div class="checkbox" data-name="李明" data-avatar="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80"></div>
            </div>
            
            <div class="contact-item">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">李四</div>
                </div>
                <div class="checkbox" data-name="李四" data-avatar="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80"></div>
            </div>
            
            <div class="section-header">W</div>
            <div class="contact-item">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">王芳</div>
                </div>
                <div class="checkbox" data-name="王芳" data-avatar="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80"></div>
            </div>
            
            <div class="contact-item">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">王五</div>
                </div>
                <div class="checkbox" data-name="王五" data-avatar="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80"></div>
            </div>
            
            <div class="section-header">Z</div>
            <div class="contact-item">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">张三</div>
                </div>
                <div class="checkbox" data-name="张三" data-avatar="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80"></div>
            </div>
            
            <div class="contact-item">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                </div>
                <div class="contact-info">
                    <div class="contact-name">赵钱</div>
                </div>
                <div class="checkbox" data-name="赵钱" data-avatar="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80"></div>
            </div>
        </div>
    </div>
    
    <div class="index-bar">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>L</div>
        <div>W</div>
        <div>Z</div>
        <div>#</div>
    </div>
    
  
    
    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000);
            
            const selectedList = document.getElementById('selectedList');
            const selectedCount = document.getElementById('selectedCount');
            const nextBtn = document.getElementById('nextBtn');
            const checkboxes = document.querySelectorAll('.checkbox');
            
            // 选择联系人
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('click', function() {
                    const name = this.getAttribute('data-name');
                    const avatar = this.getAttribute('data-avatar');
                    
                    if (this.classList.contains('checked')) {
                        // 取消选择
                        this.classList.remove('checked');
                        document.querySelector(`.selected-item[data-name="${name}"]`).remove();
                    } else {
                        // 选择
                        this.classList.add('checked');
                        
                        // 添加到已选择列表
                        const selectedItem = document.createElement('div');
                        selectedItem.className = 'selected-item';
                        selectedItem.setAttribute('data-name', name);
                        
                        selectedItem.innerHTML = `
                            <div class="selected-avatar">
                                <img src="${avatar}" alt="${name}">
                            </div>
                            <div class="selected-name">${name}</div>
                            <div class="selected-remove" data-name="${name}">×</div>
                        `;
                        
                        selectedList.appendChild(selectedItem);
                        
                        // 绑定移除事件
                        selectedItem.querySelector('.selected-remove').addEventListener('click', function(e) {
                            e.stopPropagation();
                            const name = this.getAttribute('data-name');
                            document.querySelector(`.checkbox[data-name="${name}"]`).classList.remove('checked');
                            this.parentElement.remove();
                            updateSelectedCount();
                        });
                    }
                    
                    updateSelectedCount();
                });
            });
            
            // 更新已选择人数
            function updateSelectedCount() {
                const count = selectedList.childElementCount;
                selectedCount.textContent = count;
                
                // 更新下一步按钮状态
                if (count > 0) {
                    nextBtn.classList.remove('disabled');
                    nextBtn.addEventListener('click', goToNextStep);
                } else {
                    nextBtn.classList.add('disabled');
                    nextBtn.removeEventListener('click', goToNextStep);
                }
            }
            
            // 下一步
            function goToNextStep() {
                window.location.href = 'create_group_info.html';
            }
            
            // 索引栏点击
            document.querySelectorAll('.index-bar div').forEach(index => {
                index.addEventListener('click', function() {
                    const letter = this.textContent;
                    const targetHeader = document.querySelector(`.section-header:contains('${letter}')`);
                    if (targetHeader) {
                        targetHeader.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
            
            // 简易版的:contains选择器
            Element.prototype.matches = Element.prototype.matches || Element.prototype.msMatchesSelector;
            NodeList.prototype.forEach = NodeList.prototype.forEach || Array.prototype.forEach;
            
            document.querySelectorAll('.section-header').forEach(header => {
                if (header.textContent.trim() === 'A') {
                    header.scrollIntoView();
                }
            });
        });
    </script>
</body>
</html>
