<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置群信息</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            background-color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .back {
            font-size: 18px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .header .title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-right: 28px;
        }
        
        .header .action {
            font-size: 16px;
            color: #1890ff;
            cursor: pointer;
        }
        
        .header .action.disabled {
            color: #bfbfbf;
            pointer-events: none;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .form-section {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .form-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .form-item:last-child {
            border-bottom: none;
        }
        
        .form-label {
            width: 80px;
            font-size: 16px;
            color: #333;
        }
        
        .form-input {
            flex: 1;
        }
        
        .form-input input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
        }
        
        .group-avatar {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 30px;
        }
        
        .group-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        
        .selected-members {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .members-header {
            padding: 15px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .members-count {
            font-size: 14px;
            color: #999;
            font-weight: normal;
        }
        
        .members-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 15px;
        }
        
        .member-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .member-avatar {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .member-name {
            font-size: 12px;
            color: #333;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .create-btn {
            background-color: #1890ff;
            color: white;
            height: 50px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 17px;
            font-weight: 500;
            margin-top: 30px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .create-btn:active {
            background-color: #096dd9;
        }
        
        .create-btn.disabled {
            background-color: #d9d9d9;
            color: #999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <i class="fas fa-arrow-left back" onclick="window.history.back()"></i>
        <div class="title">设置群信息</div>
        <div class="action" style="visibility: hidden;">完成</div>
    </div>
    
    <div class="content">
        <div class="form-section">
            <div class="form-item">
                <div class="form-label">群头像</div>
                <div class="form-input" style="display: flex; justify-content: flex-end;">
                    <div class="group-avatar" id="groupAvatar">
                        <i class="fas fa-camera"></i>
                        <img src="" alt="群头像" id="avatarPreview">
                    </div>
                </div>
            </div>
            
            <div class="form-item">
                <div class="form-label">群名称</div>
                <div class="form-input">
                    <input type="text" placeholder="请输入群名称" id="groupName" maxlength="20">
                </div>
            </div>
        </div>
        
        <div class="selected-members">
            <div class="members-header">
                已选择的成员 <span class="members-count">8人</span>
            </div>
            
            <div class="members-grid">
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                    </div>
                    <div class="member-name">张三</div>
                </div>
                
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                    </div>
                    <div class="member-name">李明</div>
                </div>
                
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                    </div>
                    <div class="member-name">王芳</div>
                </div>
                
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                    </div>
                    <div class="member-name">王五</div>
                </div>
                
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                    </div>
                    <div class="member-name">李四</div>
                </div>
                
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                    </div>
                    <div class="member-name">阿强</div>
                </div>
                
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="头像">
                    </div>
                    <div class="member-name">赵钱</div>
                </div>
                
                <div class="member-item">
                    <div class="member-avatar">
                        <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                    </div>
                    <div class="member-name">你自己</div>
                </div>
            </div>
        </div>
        
        <div class="create-btn disabled" id="createBtn">
            创建群聊
        </div>
    </div>
    

    
    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000);
            
            const groupAvatar = document.getElementById('groupAvatar');
            const avatarPreview = document.getElementById('avatarPreview');
            const groupNameInput = document.getElementById('groupName');
            const createBtn = document.getElementById('createBtn');
            
            // 点击选择群头像
            groupAvatar.addEventListener('click', function() {
                // 模拟选择图片
                setTimeout(() => {
                    const randomImage = `https://picsum.photos/200/200?random=${Math.floor(Math.random() * 100)}`;
                    avatarPreview.src = randomImage;
                    avatarPreview.style.display = 'block';
                    groupAvatar.querySelector('i').style.display = 'none';
                    
                    checkFormValidity();
                }, 500);
            });
            
            // 输入群名称
            groupNameInput.addEventListener('input', function() {
                checkFormValidity();
            });
            
            // 检查表单有效性
            function checkFormValidity() {
                if (groupNameInput.value.trim() !== '' && avatarPreview.style.display === 'block') {
                    createBtn.classList.remove('disabled');
                    createBtn.addEventListener('click', createGroup);
                } else {
                    createBtn.classList.add('disabled');
                    createBtn.removeEventListener('click', createGroup);
                }
            }
            
            // 创建群聊
            function createGroup() {
                // 可以在此处添加创建群聊的逻辑
                // 显示加载状态
                createBtn.textContent = '创建中...';
                createBtn.classList.add('disabled');
                
                // 模拟创建延迟
                setTimeout(() => {
                    // 创建成功，跳转到群聊页面
                    window.location.href = 'group_chat.html';
                }, 1500);
            }
            
            // 自动填充群名称
            const memberNames = Array.from(document.querySelectorAll('.member-name')).map(el => el.textContent);
            const suggestedName = memberNames.slice(0, 3).join('、');
            groupNameInput.placeholder = `${suggestedName}的群聊`;
        });
    </script>
</body>
</html>
