<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通话</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .call-type-selector {
            display: flex;
            background-color: white;
            padding: 10px 15px;
            border-bottom: 1px solid #eaeaea;
        }
        
        .call-type-btn {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            color: #666;
            position: relative;
        }
        
        .call-type-btn.active {
            color: #1890ff;
        }
        
        .call-type-btn.active:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background-color: #1890ff;
        }
        
        .calls-list {
            flex: 1;
            overflow-y: auto;
            background-color: white;
        }
        
        .call-item {
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f2f5;
            align-items: center;
        }
        
        .call-item:active {
            background-color: #f9f9f9;
        }
        
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            margin-right: 12px;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .call-info {
            flex: 1;
            overflow: hidden;
        }
        
        .call-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .call-name {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .call-time {
            font-size: 14px;
            color: #999;
        }
        
        .call-details {
            display: flex;
            align-items: center;
        }
        
        .call-type {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
        }
        
        .call-type i {
            margin-right: 5px;
        }
        
        .call-duration {
            font-size: 14px;
            color: #666;
            margin-left: 10px;
        }
        
        .call-missed {
            color: #ff3b30;
        }
        
        .call-outgoing {
            color: #34c759;
        }
        
        .call-actions {
            display: flex;
            align-items: center;
        }
        
        .call-actions i {
            font-size: 20px;
            color: #1890ff;
            margin-left: 20px;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <div class="title">通话</div>
    </div>
    
    <div class="call-type-selector">
        <div class="call-type-btn active">全部</div>
        <div class="call-type-btn">已接</div>
        <div class="call-type-btn">未接</div>
        <div class="call-type-btn">已拨</div>
    </div>
    
    <div class="calls-list">
        <div class="call-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="call-info">
                <div class="call-top">
                    <span class="call-name">张三</span>
                    <span class="call-time">今天 19:20</span>
                </div>
                <div class="call-details">
                    <div class="call-type call-incoming">
                        <i class="fas fa-phone-alt"></i>
                        <span>来电</span>
                    </div>
                    <span class="call-duration">5:20</span>
                </div>
            </div>
            <div class="call-actions">
                <i class="fas fa-phone-alt"></i>
                <i class="fas fa-video"></i>
            </div>
        </div>
        
        <div class="call-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="call-info">
                <div class="call-top">
                    <span class="call-name">李四</span>
                    <span class="call-time">今天 17:05</span>
                </div>
                <div class="call-details">
                    <div class="call-type call-outgoing">
                        <i class="fas fa-phone-alt"></i>
                        <span>已拨</span>
                    </div>
                    <span class="call-duration">12:34</span>
                </div>
            </div>
            <div class="call-actions">
                <i class="fas fa-phone-alt"></i>
                <i class="fas fa-video"></i>
            </div>
        </div>
        
        <div class="call-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="call-info">
                <div class="call-top">
                    <span class="call-name">王五</span>
                    <span class="call-time">昨天 15:30</span>
                </div>
                <div class="call-details">
                    <div class="call-type call-missed">
                        <i class="fas fa-phone-alt"></i>
                        <span>未接</span>
                    </div>
                </div>
            </div>
            <div class="call-actions">
                <i class="fas fa-phone-alt"></i>
                <i class="fas fa-video"></i>
            </div>
        </div>
        
        <div class="call-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="call-info">
                <div class="call-top">
                    <span class="call-name">赵六</span>
                    <span class="call-time">昨天 14:40</span>
                </div>
                <div class="call-details">
                    <div class="call-type call-incoming">
                        <i class="fas fa-video"></i>
                        <span>视频通话</span>
                    </div>
                    <span class="call-duration">8:45</span>
                </div>
            </div>
            <div class="call-actions">
                <i class="fas fa-phone-alt"></i>
                <i class="fas fa-video"></i>
            </div>
        </div>
        
        <div class="call-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="call-info">
                <div class="call-top">
                    <span class="call-name">张三</span>
                    <span class="call-time">周一 10:20</span>
                </div>
                <div class="call-details">
                    <div class="call-type call-outgoing">
                        <i class="fas fa-video"></i>
                        <span>已拨视频</span>
                    </div>
                    <span class="call-duration">3:12</span>
                </div>
            </div>
            <div class="call-actions">
                <i class="fas fa-phone-alt"></i>
                <i class="fas fa-video"></i>
            </div>
        </div>
    </div>
    
    <div class="tab-bar">
        <div class="tab">
            <i class="fas fa-comment"></i>
            <span>消息</span>
        </div>
        <div class="tab">
            <i class="fas fa-address-book"></i>
            <span>通讯录</span>
        </div>
        <div class="tab active">
            <i class="fas fa-phone-alt"></i>
            <span>通话</span>
        </div>
        <div class="tab">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>
</body>
</html>
