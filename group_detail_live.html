<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>群聊详情（含直播入口）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        
        /* 状态栏 */
        .status-bar {
            height: 44px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #e0e0e0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .back-btn {
            font-size: 18px;
            color: #333;
            margin-right: 16px;
        }
        
        .status-bar-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        /* 主内容区 */
        .main-content {
            margin-top: 44px;
            margin-bottom: 50px;
        }
        
        /* 群聊头像 */
        .group-avatar-section {
            background-color: #fff;
            padding: 20px;
            display: flex;
            align-items: center;
            border-bottom: 8px solid #f5f5f5;
        }
        
        .group-avatar {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background-color: #1890ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            color: #fff;
            font-size: 32px;
        }
        
        .group-info {
            flex: 1;
        }
        
        .group-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .group-members {
            font-size: 14px;
            color: #666;
        }
        
        /* 功能列表 */
        .feature-list {
            background-color: #fff;
            border-radius: 12px;
            margin: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .feature-item:last-child {
            border-bottom: none;
        }
        
        .feature-item-left {
            display: flex;
            align-items: center;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 14px;
            color: #fff;
        }
        
        .feature-icon.group-notice {
            background-color: #fa8c16;
        }
        
        .feature-icon.group-members {
            background-color: #52c41a;
        }
        
        .feature-icon.group-settings {
            background-color: #1890ff;
        }
        
        .feature-icon.live-streaming {
            background-color: #ff4d4f;
        }
        
        .feature-title {
            font-size: 16px;
            color: #333;
        }
        
        .feature-arrow {
            font-size: 14px;
            color: #999;
        }
        
        /* 直播入口按钮 */
        .live-entry-btn {
            background-color: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 12px;
            box-shadow: 0 4px 12px rgba(255, 77, 79, 0.3);
            transition: all 0.3s ease;
        }
        
        .live-entry-btn:hover {
            background-color: #ff7875;
        }
        
        .live-entry-btn i {
            margin-right: 8px;
        }
        
        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #999;
        }
        
        .nav-item.active {
            color: #1890ff;
        }
        
        .nav-item i {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-bar-left">
            <i class="fas fa-arrow-left back-btn" onclick="window.history.back()"></i>
            <div class="status-bar-title">群聊详情</div>
        </div>
        <div style="font-size: 16px; color: #666;">
            <i class="fas fa-ellipsis-v"></i>
        </div>
    </div>
    
    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 群聊头像 -->
        <div class="group-avatar-section">
            <div class="group-avatar">
                <i class="fas fa-users"></i>
            </div>
            <div class="group-info">
                <div class="group-name">加密游戏交流群</div>
                <div class="group-members">32 人</div>
            </div>
        </div>
        
        <!-- 直播入口按钮 -->
        <button class="live-entry-btn" onclick="window.location.href='live_streaming_popup.html'">
            <i class="fas fa-video"></i> 开启直播
        </button>
        
        <!-- 功能列表 -->
        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-item-left">
                    <div class="feature-icon group-notice">
                        <i class="fas fa-bullhorn"></i>
                    </div>
                    <div class="feature-title">群公告</div>
                </div>
                <div class="feature-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-item-left">
                    <div class="feature-icon group-members">
                        <i class="fas fa-user-friends"></i>
                    </div>
                    <div class="feature-title">群成员</div>
                </div>
                <div class="feature-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-item-left">
                    <div class="feature-icon live-streaming">
                        <i class="fas fa-video"></i>
                    </div>
                    <div class="feature-title">直播设置</div>
                </div>
                <div class="feature-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-item-left">
                    <div class="feature-icon group-settings">
                        <i class="fas fa-cog"></i>
                    </div>
                    <div class="feature-title">群设置</div>
                </div>
                <div class="feature-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <div class="nav-item">
            <i class="fas fa-comment-dots"></i>
            <span>消息</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-address-book"></i>
            <span>联系人</span>
        </div>
        <div class="nav-item active">
            <i class="fas fa-users"></i>
            <span>群聊</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>
</body>
</html>
