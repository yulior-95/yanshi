<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iToken生成中</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* iOS状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
        }

        .status-bar .time {
            font-size: 15px;
            font-weight: 600;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-bar .icons i {
            font-size: 14px;
            color: #1d1d1f;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            position: relative;
        }
        
        .nav-bar .title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
        }
        
        /* 主内容区 */
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 88px);
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 60px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e5e5e7;
        }

        .step-dot.active {
            background: #007AFF;
            width: 24px;
            border-radius: 4px;
        }

        .step-dot.completed {
            background: #34C759;
        }
        
        /* 动画容器 */
        .animation-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 50px;
        }
        
        /* 外圈旋转动画 */
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #007AFF;
            border-right-color: #5856D6;
            animation: spin 2s linear infinite;
        }
        
        .outer-ring::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #5856D6;
            border-left-color: #007AFF;
            animation: spin-reverse 1.5s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* 中心图标 */
        .center-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.15) 0%, rgba(88, 86, 214, 0.15) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-icon i {
            font-size: 40px;
            color: #007AFF;
            animation: pulse-icon 1.5s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        
        /* 粒子效果 */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #007AFF;
            border-radius: 50%;
            animation: particle-float 3s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            top: 10%;
            left: 20%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 0.5s;
            background: #5856D6;
        }

        .particle:nth-child(3) {
            bottom: 25%;
            left: 10%;
            animation-delay: 1s;
            background: #34C759;
        }

        .particle:nth-child(4) {
            bottom: 15%;
            right: 20%;
            animation-delay: 1.5s;
        }

        .particle:nth-child(5) {
            top: 50%;
            left: 5%;
            animation-delay: 2s;
            background: #FF9500;
        }

        .particle:nth-child(6) {
            top: 40%;
            right: 5%;
            animation-delay: 2.5s;
            background: #5856D6;
        }

        @keyframes particle-float {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-20px) scale(1.2);
                opacity: 1;
            }
        }

        /* 状态文字 */
        .status-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .status-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1d1d1f;
        }
        
        .status-subtitle {
            font-size: 15px;
            color: #86868b;
            line-height: 1.5;
        }
        
        /* 进度步骤 */
        .progress-steps {
            width: 100%;
            max-width: 320px;
            margin-bottom: 40px;
        }
        
        .progress-step {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #e5e5e7;
        }
        
        .progress-step:last-child {
            border-bottom: none;
        }
        
        .step-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #f5f5f7;
            color: #86868b;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .step-icon.completed {
            background: linear-gradient(135deg, #34C759 0%, #30B350 100%);
            color: #fff;
        }
        
        .step-icon.active {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            color: #fff;
            animation: step-pulse 1.5s ease-in-out infinite;
        }

        @keyframes step-pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 122, 255, 0);
            }
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-title {
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 2px;
        }
        
        .step-desc {
            font-size: 13px;
            color: #86868b;
        }
        
        .step-status {
            font-size: 13px;
            color: #86868b;
        }
        
        .step-status.completed {
            color: #34C759;
        }
        
        .step-status.active {
            color: #007AFF;
        }

        /* 安全提示 */
        .security-tip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: #f5f5f7;
            border-radius: 12px;
            max-width: 320px;
        }

        .security-tip i {
            color: #34C759;
            font-size: 18px;
        }

        .security-tip span {
            font-size: 13px;
            color: #86868b;
        }

        /* 数据流动画 - 白底版本隐藏 */
        .data-flow {
            display: none;
        }

        /* 连接线动画 */
        .connection-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .device-icon, .server-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
        }

        .device-icon i, .server-icon i {
            font-size: 22px;
            color: #007AFF;
        }

        .connection-line {
            width: 80px;
            height: 3px;
            background: #e5e5e7;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        
        .connection-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -30px;
            width: 30px;
            height: 100%;
            background: linear-gradient(90deg, transparent, #007AFF, transparent);
            animation: connection-flow 1.5s linear infinite;
        }

        @keyframes connection-flow {
            0% { left: -30px; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 数据流背景 -->
        <div class="data-flow">
            <div class="data-line"></div>
            <div class="data-line"></div>
            <div class="data-line"></div>
            <div class="data-line"></div>
            <div class="data-line"></div>
            <div class="data-line"></div>
        </div>

        <!-- iOS状态栏 -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
        
        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="title">iToken生成中</div>
        </div>
        
        <!-- 主内容 -->
        <div class="content">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step-dot completed"></div>
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
                        </div>

            <!-- 动画容器 -->
            <div class="animation-container">
                    <div class="particles">
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                    </div>
                <div class="outer-ring"></div>
                <div class="center-icon">
                    <i class="fas fa-key"></i>
                </div>
            </div>

            <!-- 连接可视化 -->
            <div class="connection-visual">
                <div class="device-icon">
                    <i class="fas fa-mobile-alt"></i>
                </div>
                <div class="connection-line"></div>
                <div class="server-icon">
                    <i class="fas fa-server"></i>
                    </div>
                </div>
                
            <!-- 状态文字 -->
            <div class="status-section">
                <h1 class="status-title">正在生成iToken</h1>
                <p class="status-subtitle">请保持网络连接，不要关闭应用</p>
            </div>

            <!-- 进度步骤 -->
            <div class="progress-steps">
                <div class="progress-step">
                    <div class="step-icon completed">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="step-content">
                            <div class="step-title">验证用户身份</div>
                        <div class="step-desc">确认用户权限</div>
                        </div>
                        <div class="step-status completed">已完成</div>
                    </div>
                    
                <div class="progress-step">
                    <div class="step-icon completed">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="step-content">
                            <div class="step-title">获取激活许可</div>
                        <div class="step-desc">服务器授权</div>
                        </div>
                        <div class="step-status completed">已完成</div>
                    </div>
                    
                <div class="progress-step">
                    <div class="step-icon active">
                        <i class="fas fa-microchip"></i>
                    </div>
                        <div class="step-content">
                            <div class="step-title">生成密钥对</div>
                        <div class="step-desc">安全芯片处理中</div>
                        </div>
                        <div class="step-status active">进行中...</div>
                    </div>
                    
                <div class="progress-step">
                    <div class="step-icon">
                        <i class="fas fa-certificate"></i>
                    </div>
                        <div class="step-content">
                        <div class="step-title">签发数字证书</div>
                        <div class="step-desc">等待服务器响应</div>
                    </div>
                    <div class="step-status">等待中</div>
                </div>
                
                <div class="progress-step">
                    <div class="step-icon">
                        <i class="fas fa-link"></i>
                    </div>
                    <div class="step-content">
                        <div class="step-title">完成设备绑定</div>
                        <div class="step-desc">存储证书并激活</div>
                </div>
                    <div class="step-status">等待中</div>
            </div>
        </div>
        
            <!-- 安全提示 -->
            <div class="security-tip">
                <i class="fas fa-lock"></i>
                <span>您的私钥将安全存储在设备安全芯片中</span>
            </div>
        </div>
    </div>
    
    <script>
        // 模拟进度更新
        const steps = document.querySelectorAll('.progress-step');
        let currentStep = 2; // 从第3步开始（索引2）

        function updateProgress() {
            if (currentStep < steps.length) {
                // 完成当前步骤
                const currentStepEl = steps[currentStep];
                const icon = currentStepEl.querySelector('.step-icon');
                const status = currentStepEl.querySelector('.step-status');
                
                icon.classList.remove('active');
                icon.classList.add('completed');
                icon.innerHTML = '<i class="fas fa-check"></i>';
                status.classList.remove('active');
                status.classList.add('completed');
                status.textContent = '已完成';

                currentStep++;

                // 激活下一步
                if (currentStep < steps.length) {
                    const nextStepEl = steps[currentStep];
                    const nextIcon = nextStepEl.querySelector('.step-icon');
                    const nextStatus = nextStepEl.querySelector('.step-status');
                    
                    nextIcon.classList.add('active');
                    nextStatus.classList.add('active');
                    nextStatus.textContent = '进行中...';
                }

                // 如果所有步骤完成，跳转到成功页面
                if (currentStep >= steps.length) {
        setTimeout(() => {
            window.location.href = 'itoken_success.html';
                    }, 1500);
                }
            }
        }

        // 每2秒更新一次进度
        setInterval(updateProgress, 2000);
    </script>
</body>
</html>
