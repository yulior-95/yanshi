<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扑克牌动态表情效果</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .animation-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            background-color: white;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .poker-card {
            width: 200px;
            height: 280px;
            position: relative;
            margin-bottom: 30px;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            backface-visibility: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.6s;
        }
        
        .card-front {
            background-color: white;
            transform: rotateY(180deg);
            overflow: hidden;
        }
        
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-back {
            background-color: #f0f0f0;
            transform: rotateY(0deg);
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1593085260707-5377ba37f868?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80');
            background-size: cover;
        }
        
        .card-flipped .card-front {
            transform: rotateY(0deg);
        }
        
        .card-flipped .card-back {
            transform: rotateY(-180deg);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .flip-button {
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .flip-button i {
            margin-right: 8px;
        }
        
        .shuffle-info {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        
        .shuffle-info i {
            margin-right: 5px;
            color: #1890ff;
        }
        
        /* 动画效果 */
        @keyframes shuffleCard {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-20px) rotate(-5deg); }
            50% { transform: translateX(20px) rotate(5deg); }
            75% { transform: translateX(-20px) rotate(-5deg); }
        }
        
        .shuffling {
            animation: shuffleCard 0.5s ease-in-out;
        }
        
        /* 发光效果 */
        @keyframes glowing {
            0%, 100% { box-shadow: 0 0 5px rgba(24, 144, 255, 0.5); }
            50% { box-shadow: 0 0 20px rgba(24, 144, 255, 0.8); }
        }
        
        .glowing {
            animation: glowing 2s infinite;
        }
        
        /* 底部导航栏 */
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        
        /* 卡片样式选择 */
        .card-selector {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 300px;
        }
        
        .card-option {
            width: 60px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .card-option:hover {
            transform: translateY(-5px);
        }
        
        .card-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="animation-container">
        <div class="title">
            扑克牌表情动画效果展示
        </div>
        
        <div class="poker-card" id="pokerCard">
            <div class="card-front">
                <img src="https://tinyurl.com/mvd6m6je" alt="黑桃A" id="cardFrontImage">
            </div>
            <div class="card-back"></div>
        </div>
        
        <div class="controls">
            <button class="flip-button" id="flipButton">
                <i class="fas fa-sync-alt"></i>洗牌并翻转
            </button>
            
            <div class="shuffle-info">
                <i class="fas fa-info-circle"></i>
                点击洗牌按钮后，卡片会在3-5秒后显示最终效果
            </div>
        </div>
        
        <div class="card-selector">
            <div class="card-option" data-card="黑桃A">
                <img src="https://tinyurl.com/mvd6m6je" alt="黑桃A">
            </div>
            <div class="card-option" data-card="方块2">
                <img src="https://tinyurl.com/2p94zkdn" alt="方块2">
            </div>
            <div class="card-option" data-card="红桃K">
                <img src="https://tinyurl.com/32zax7mm" alt="红桃K">
            </div>
        </div>
    </div>
    
    <div class="tab-bar">
        <div class="tab active">
            <i class="fas fa-comment"></i>
            <span>消息</span>
        </div>
        <div class="tab">
            <i class="fas fa-address-book"></i>
            <span>通讯录</span>
        </div>
        <div class="tab">
            <i class="fas fa-compass"></i>
            <span>发现</span>
        </div>
        <div class="tab">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>

    <script>
        // 更新状态栏时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);
        
        // 扑克牌翻转动画
        const pokerCard = document.getElementById('pokerCard');
        const flipButton = document.getElementById('flipButton');
        const cardFrontImage = document.getElementById('cardFrontImage');
        const cardOptions = document.querySelectorAll('.card-option');
        
        let isFlipping = false;
        
        flipButton.addEventListener('click', function() {
            if (isFlipping) return;
            isFlipping = true;
            
            // 先添加洗牌动画
            pokerCard.classList.add('shuffling');
            
            setTimeout(() => {
                pokerCard.classList.remove('shuffling');
                
                // 随机设置洗牌时间(3-5秒)
                const flipTime = Math.floor(Math.random() * 2000) + 3000;
                
                // 添加发光效果
                pokerCard.classList.add('glowing');
                
                // 设置倒计时
                let countdown = Math.ceil(flipTime / 1000);
                flipButton.innerHTML = `<i class="fas fa-hourglass-half"></i>等待翻牌(${countdown}s)`;
                
                const timer = setInterval(() => {
                    countdown--;
                    flipButton.innerHTML = `<i class="fas fa-hourglass-half"></i>等待翻牌(${countdown}s)`;
                    
                    if (countdown <= 0) {
                        clearInterval(timer);
                    }
                }, 1000);
                
                // 在指定时间后翻转卡片
                setTimeout(() => {
                    // 翻转卡片
                    pokerCard.classList.add('card-flipped');
                    
                    // 移除发光效果
                    pokerCard.classList.remove('glowing');
                    
                    // 重置按钮
                    flipButton.innerHTML = `<i class="fas fa-sync-alt"></i>再次洗牌`;
                    
                    // 延迟后重置翻转状态
                    setTimeout(() => {
                        isFlipping = false;
                    }, 1000);
                }, flipTime);
            }, 500);
        });
        
        // 选择不同的卡片
        cardOptions.forEach(option => {
            option.addEventListener('click', function() {
                if (isFlipping) return;
                
                // 移除卡片翻转状态
                pokerCard.classList.remove('card-flipped');
                
                // 获取选中的卡片
                const cardImage = this.querySelector('img').src;
                
                // 更新正面卡片图片
                cardFrontImage.src = cardImage;
                
                // 添加选中效果
                cardOptions.forEach(opt => opt.style.boxShadow = '');
                this.style.boxShadow = '0 0 10px rgba(24, 144, 255, 0.8)';
            });
        });
    </script>
</body>
</html>
