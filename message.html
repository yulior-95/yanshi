<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 44px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            color: white;
            font-size: 14px;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
        }
        
        .time {
            font-weight: 600;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
        }
        
        .battery {
            margin-left: 5px;
        }
        
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            border-bottom: 1px solid #eaeaea;
        }
        
        .header .title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .header .actions {
            display: flex;
            align-items: center;
        }
        
        .header .actions i {
            font-size: 20px;
            color: #333;
            margin-left: 15px;
            cursor: pointer;
        }
        
        /* 添加客服图标悬停效果 */
        .header .actions i.fa-headset:hover {
            color: #1890ff;
        }
        
        .search-bar {
            padding: 10px 15px;
            background-color: white;
        }
        
        .search-input {
            background-color: #f0f2f5;
            border-radius: 10px;
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }
        
        .search-input i {
            color: #999;
            margin-right: 8px;
        }
        
        .search-input input {
            border: none;
            background: transparent;
            flex: 1;
            outline: none;
            font-size: 14px;
        }
        
        .message-list {
            flex: 1;
            overflow-y: auto;
            background-color: white;
        }
        
        .message-item {
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f2f5;
        }
        
        .message-item:active {
            background-color: #f9f9f9;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            margin-right: 12px;
            position: relative;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .unread-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff3b30;
            color: white;
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .message-content {
            flex: 1;
            overflow: hidden;
        }
        
        .message-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        
        .name {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .time-stamp {
            font-size: 12px;
            color: #999;
        }
        
        .message-preview {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .encryption-badge {
            background-color: #e6f7ff;
            color: #1890ff;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            margin-right: 5px;
        }
        
        .tab-bar {
            height: 50px;
            background-color: white;
            display: flex;
            border-top: 1px solid #eaeaea;
        }
        
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        
        .tab.active {
            color: #1890ff;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 3px;
        }
        
        /* 添加弹出动画效果 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .pop-in {
            animation: popIn 0.3s ease-out forwards;
        }
        
        /* 添加消息状态样式 */
        .message-status-icon {
            display: inline-block;
            margin-left: 5px;
            font-size: 12px;
        }
        
        .status-sending {
            color: #999;
            animation: rotate 1s linear infinite;
        }
        
        .status-sent {
            color: #999;
        }
        
        .status-delivered {
            color: #999;
        }
        
        .status-read {
            color: #1890ff;
        }
        
        .status-failed {
            color: #ff3b30;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 发送失败消息样式 */
        .message-preview.failed {
            color: #ff3b30;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="status-bar-left">
            <div class="time">19:45</div>
        </div>
        <div class="status-bar-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi" style="margin-left: 5px;"></i>
            <div class="battery">
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
    </div>
    
    <div class="header">
        <div class="title">消息</div>
        <div class="actions">
            <i class="fas fa-headset" onclick="openCustomerService()" title="客服中心"></i>
            <i class="fas fa-plus-circle"></i>
        </div>
    </div>
    
    <div class="search-bar">
        <div class="search-input">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="搜索">
        </div>
    </div>
    
    <div class="message-list">
        <div class="message-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                <div class="unread-badge">3</div>
            </div>
            <div class="message-content">
                <div class="message-top">
                    <span class="name">张三</span>
                    <span class="time-stamp">19:30</span>
                </div>
                <div class="message-preview">
                    <span class="encryption-badge">加密</span>
                    我们今天讨论的事情已经处理完毕了，请查看...
                </div>
            </div>
        </div>
        
        <div class="message-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="message-content">
                <div class="message-top">
                    <span class="name">李四</span>
                    <span class="time-stamp">昨天</span>
                </div>
                <div class="message-preview">
                    <span class="encryption-badge">加密</span>
                    [语音消息] 0:15"
                </div>
            </div>
        </div>
        
        <div class="message-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
                <div class="unread-badge">5</div>
            </div>
            <div class="message-content">
                <div class="message-top">
                    <span class="name">网络安全群</span>
                    <span class="time-stamp">昨天</span>
                </div>
                <div class="message-preview">
                    <span class="encryption-badge">加密</span>
                    王五: 这是一条关于最新安全漏洞的讨论...
                </div>
            </div>
        </div>
        
        <div class="message-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="message-content">
                <div class="message-top">
                    <span class="name">赵六</span>
                    <span class="time-stamp">周二</span>
                </div>
                <div class="message-preview">
                    <span class="encryption-badge">加密</span>
                    [图片]
                </div>
            </div>
        </div>
        
        <div class="message-item">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=700&q=80" alt="头像">
            </div>
            <div class="message-content">
                <div class="message-top">
                    <span class="name">WEB3讨论组</span>
                    <span class="time-stamp">周一</span>
                </div>
                <div class="message-preview">
                    <span class="encryption-badge">加密</span>
                    孙七: 最近市场变化很大，我们需要调整策略...
                </div>
            </div>
        </div>
    </div>
    
    <div class="tab-bar">
        <div class="tab active">
            <i class="fas fa-comment"></i>
            <span>消息</span>
        </div>
        <div class="tab">
            <i class="fas fa-address-book"></i>
            <span>通讯录</span>
        </div>
        <div class="tab">
            <i class="fas fa-phone-alt"></i>
            <span>通话</span>
        </div>
        <div class="tab">
            <i class="fas fa-user"></i>
            <span>我的</span>
        </div>
    </div>
    
    <script>
        // 打开客服中心页面
        function openCustomerService() {
            window.location.href = 'customer_service.html';
        }
        
        // 设置当前时间
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            setInterval(updateTime, 60000); // 每分钟更新一次
            
            // 为客服图标添加动画效果
            const serviceIcon = document.querySelector('.fa-headset');
            serviceIcon.classList.add('pop-in');
        });
    </script>
</body>
</html>
